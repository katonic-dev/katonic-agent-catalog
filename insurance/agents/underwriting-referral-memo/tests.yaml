# Nine tests. A test passes only when it passes five runs in a row.
# Right answers come from "Authority levels and referral rules" and "Referrals and precedents" in
# demo-insurer/SCENARIOS.md (Underwriting, system: underwriting) and the insurer's starting data.
# Start the insurer with INSURER_TODAY=2026-11-26, so that a date in a reply is checked as the date the
# system returned (for example 25 Nov 2026), never as a count of days ago.
# A saved draft is not part of a referral's read, so a second run does not see the first run's answer and
# no reset is needed between runs. A second run saves the next version, so no test checks a version number.
# The tester reads what was saved with the operation that lists the memos saved on a referral.
# No test checks for a hold before the save: the save is a draft and does not wait for approval.
# Every phrase under does_not_say is a claim only a wrong reply makes.

states:
  nothing_connected: The agent as built, with no underwriting tools attached.
  insurer_connected: >
    The underwriting system of the invented insurer connected and the agent's
    three tools attached. The insurer at its starting data.

tests:
  - name: Nothing connected, says so and drafts nothing
    given: nothing_connected
    input: Draft the referral memo for referral REF-6601.
    expected:
      - says the insurer's underwriting system is not connected to the agent right now, so the referral cannot be read and nothing was drafted or saved
      - says nothing about how the system is connected or who connects it
      - gives no table, no mark, no rule, no precedent and no proposal, and describes no insured and no underwriter
    checks:
      - {check: claims_no_action}
      - {check: says, any: ["not connected"]}
      - {check: says_cannot, about: ["read", "referral"]}
      - {check: does_not_say, any: ["PRC-64", "RF-", "UG-1", "Pellow", "Morrow", "| applies |", "| # |", "Proposal:", "Saved:"]}

  - name: Insurer connected, two precedents agree and one is not alike
    given: insurer_connected
    input: Draft the referral memo for referral REF-6601.
    expected:
      - names the referral REF-6601, the insured Pellow & Strand Furniture Showrooms Ltd, commercial property, asked by Benedick Morrow, underwriter, raised 25 Nov 2026, from submission SBM-6503
      - "the risk row gives a furniture showroom, construction class C (timber frame), a total sum insured of USD 1,350,000.00 and no sprinklers; the terms row gives a technical premium of USD 9,400.00, a proposed premium of USD 9,400.00, a discount of 0.00 percent, a deductible of USD 10,000.00 and the condition that the alarm is linked to a monitoring station before cover starts"
      - "the RF-1 row is marked does not apply, with the system's sentence: USD 1,350,000.00 is not above the authority of USD 1,500,000.00"
      - "the RF-2 row is marked applies, with the system's sentence: the risk is outside UG-1 and the grade underwriter decides only a risk within every guideline, so it goes to a senior underwriter"
      - the RF-3 row is marked does not apply
      - the UG-1 row is marked outside, with the note the underwriter recorded
      - "PRC-6401 (Dovecote Beds & Bedding Ltd, USD 1,280,000.00) and PRC-6402 (Summerlea Garden Furniture Ltd, USD 1,150,000.00) are each marked agrees: timber-framed showrooms over the class C limit, approved with conditions by Isolde Varney, senior underwriter, on 12 Oct 2025 and 10 Apr 2026, with a monitored alarm and a deductible of USD 10,000.00, which the terms proposed here hold"
      - "PRC-6403 is marked not alike: a class B grain warehouse, not a class C showroom"
      - saves the draft with the referral needed, the grade senior underwriter, the rules RF-2 and UG-1, and three precedent rows (PRC-6401 and PRC-6402 as agreeing, PRC-6403 as not alike with the reason), and says so only because the system said it was applied, with the version it gave
      - "ends with the line Proposal: refer to the senior underwriter: forced by RF-2"
      - recommends no decision and approves nothing
    checks:
      - {check: tool_called, tool: get_underwriting_referral}
      - {check: tool_called, tool: search_referral_precedents}
      - {check: tool_called, tool: save_referral_memo}
      - {check: says, any: ["Draft referral memo. For the deciding underwriter. Not issued."]}
      - {check: says, any: ["| # | Part | What the record gives | Mark | Note |"]}
      - {check: says, all: ["REF-6601", "Pellow & Strand", "Benedick Morrow", "25 Nov 2026", "SBM-6503"]}
      - {check: says, all: ["USD 1,350,000.00", "USD 1,500,000.00", "USD 9,400.00", "USD 10,000.00"]}
      - {check: says, all: ["PRC-6401", "PRC-6402", "PRC-6403", "Isolde Varney", "12 Oct 2025", "10 Apr 2026", "USD 1,280,000.00", "USD 1,150,000.00"]}
      - {check: says, all: ["| stated |", "| applies |", "| does not apply |", "| outside |", "| agrees |", "| not alike |", "Saved:"]}
      - {check: last_line_says, all: ["Proposal:", "refer to the senior underwriter", "forced by RF-2"]}
      - {check: does_not_say, any: ["| differs |", "| went against |", "| none found |", "PRC-6404", "PRC-6405", "Proposal: no referral needed", "forced by RF-1", "2026-11-25", "2025-10-12", "senior_underwriter", "approved_with_conditions", "the risk is approved", "REF-6601 is approved", "i have approved", "the memo has been sent", "i have referred"]}

  - name: Insurer connected, a precedent that looks alike and differs on the fact its decision rested on
    given: insurer_connected
    input: Draft the referral memo for referral REF-6602.
    expected:
      - names the referral REF-6602, the insured Marrowgate Grain & Seed Stores Ltd, asked by Benedick Morrow, underwriter, raised 24 Nov 2026
      - "the risk row gives a warehouse for bagged grain and seed, construction class B, a total sum insured of USD 2,900,000.00 and no sprinklers; the terms row gives a premium of USD 22,000.00 with a discount of 0.00 percent and a deductible of USD 15,000.00"
      - "the RF-1 row is marked applies, with the system's sentence: USD 2,900,000.00 is above the authority of USD 1,500,000.00, and the lowest grade whose authority covers it is senior underwriter"
      - "the RF-2 row is marked applies: the risk is outside UG-1 and UG-3"
      - the RF-3 row is marked does not apply
      - "UG-1 and UG-3 each have a row marked outside; the UG-3 row says that no precedent is outside UG-3"
      - "PRC-6403 (Aldercombe Grain Stores Ltd, a class B grain warehouse, USD 2,850,000.00, approved with conditions by Isolde Varney on 30 Jan 2026) is marked differs: its decision rests on a sprinkler system in working order, and this risk has no sprinklers"
      - does not count PRC-6403 as support for this risk
      - PRC-6401 and PRC-6402, timber-framed class C showrooms, are marked not alike
      - saves the draft with the referral needed, the grade senior underwriter, the rules RF-1, RF-2, UG-1 and UG-3, and three precedent rows (PRC-6403 as differing on a material fact, PRC-6401 and PRC-6402 as not alike with the reason), and says so with the version the system gave
      - "ends with the line Proposal: refer to the senior underwriter: forced by RF-1 and RF-2"
    checks:
      - {check: tool_called, tool: get_underwriting_referral}
      - {check: tool_called, tool: search_referral_precedents}
      - {check: tool_called, tool: save_referral_memo}
      - {check: says, all: ["REF-6602", "Marrowgate", "24 Nov 2026", "USD 2,900,000.00", "USD 1,500,000.00", "USD 22,000.00"]}
      - {check: says, all: ["PRC-6403", "USD 2,850,000.00", "30 Jan 2026", "UG-1", "UG-3"]}
      - {check: says, any: ["sprinkler", "Sprinkler"]}
      - {check: says, all: ["| applies |", "| does not apply |", "| outside |", "| differs |", "| not alike |"]}
      - {check: last_line_says, all: ["Proposal:", "refer to the senior underwriter", "RF-1", "RF-2"]}
      - {check: does_not_say, any: ["| agrees |", "| went against |", "| none found |", "PRC-6404", "PRC-6405", "Proposal: no referral needed", "PRC-6403 supports", "2026-11-24", "the risk is approved", "REF-6602 is approved", "i have approved"]}

  - name: Insurer connected, no precedent found, and the guideline rule does not fire for a senior underwriter
    given: insurer_connected
    input: Draft the referral memo for referral REF-6603.
    expected:
      - names the referral REF-6603, the insured Hollinsworth Builders' Merchants Ltd, motor fleet, asked by Isolde Varney, senior underwriter, raised 25 Nov 2026
      - "the risk row gives a fleet of 180 vehicles that delivers the company's own goods; the terms row gives a premium of USD 96,000.00 with a discount of 0.00 percent and a deductible of USD 1,000.00"
      - "the RF-1 row is marked applies, with the system's sentence: the fleet has 180 vehicles, the authority of the grade senior underwriter is 150 vehicles, and the lowest grade whose authority covers it is head of underwriting"
      - "the RF-2 row is marked does not apply, with the system's sentence: the risk is outside UG-7, but the grade senior underwriter may decide a risk outside a guideline, so this rule sends it nowhere"
      - the RF-3 row is marked does not apply
      - the UG-7 row is marked outside
      - "one row marked none found, with the system's note that no earlier referred risk matches; the summary says no precedent was found"
      - cites no precedent, and none from commercial property
      - saves the draft with the referral needed, the grade head of underwriting, the rule RF-1 and no precedent rows, and says so with the version the system gave
      - "ends with the line Proposal: refer to the head of underwriting: forced by RF-1"
    checks:
      - {check: tool_called, tool: get_underwriting_referral}
      - {check: tool_called, tool: search_referral_precedents}
      - {check: tool_called, tool: save_referral_memo}
      - {check: says, all: ["REF-6603", "Hollinsworth", "Isolde Varney", "25 Nov 2026", "180 vehicles", "150 vehicles", "USD 96,000.00", "UG-7"]}
      - {check: says, any: ["sends it nowhere", "may decide a risk outside a guideline"]}
      - {check: says, all: ["| applies |", "| does not apply |", "| outside |", "| none found |"]}
      - {check: last_line_says, all: ["Proposal:", "refer to the head of underwriting", "forced by RF-1"]}
      - {check: does_not_say, any: ["PRC-64", "| agrees |", "| differs |", "| went against |", "| not alike |", "head_of_underwriting", "motor_fleet", "Proposal: refer to the senior underwriter", "Proposal: no referral needed"]}

  - name: Insurer connected, the asking grade's authority is enough, no referral needed
    given: insurer_connected
    input: Draft the referral memo for referral REF-6604.
    expected:
      - names the referral REF-6604, the insured Quenby House Offices Ltd, asked by Isolde Varney, senior underwriter, raised 25 Nov 2026
      - "the terms row gives a technical premium of USD 21,000.00, a proposed premium of USD 17,850.00 and the system's discount of 15.00 percent"
      - "the RF-1 row is marked does not apply: USD 3,200,000.00 is not above the authority of USD 5,000,000.00"
      - "the RF-2 row is marked does not apply: the referral records no guideline the risk is outside"
      - "the RF-3 row is marked does not apply: 15.00 percent is not above the discount authority of 20.00 percent"
      - "the summary gives the system's closing sentence: no referral rule applies, and Isolde Varney may decide it without a referral"
      - names no grade to refer to, cites no forcing rule and cites no precedent; the table has no guideline row and no precedent row
      - saves the draft with no referral needed, no grade, no forcing rule and no precedent rows, and says so with the version the system gave
      - "ends with the line Proposal: no referral needed: Isolde Varney may decide it without a referral"
    checks:
      - {check: tool_called, tool: get_underwriting_referral}
      - {check: tool_called, tool: save_referral_memo}
      - {check: says, all: ["REF-6604", "Quenby House", "Isolde Varney", "USD 3,200,000.00", "USD 5,000,000.00", "USD 21,000.00", "USD 17,850.00", "15.00 percent", "20.00 percent"]}
      - {check: says, all: ["| stated |", "| does not apply |", "Saved:"]}
      - {check: last_line_says, all: ["Proposal:", "no referral needed", "Isolde Varney", "may decide it without a referral"]}
      - {check: does_not_say, any: ["| applies |", "| outside |", "| agrees |", "| differs |", "| went against |", "| not alike |", "| none found |", "PRC-64", "Proposal: refer to", "forced by RF", "| 6 |", "the discount is approved", "i have approved"]}

  - name: Insurer connected, a discount above authority, one precedent went against and one differs
    given: insurer_connected
    input: Draft the referral memo for referral REF-6605.
    expected:
      - names the referral REF-6605, the insured Wrenlow Tea Importers Ltd, asked by Benedick Morrow, underwriter, raised 23 Nov 2026
      - "the terms row gives a technical premium of USD 8,000.00, a proposed premium of USD 6,560.00 and the system's discount of 18.00 percent"
      - the RF-1 and RF-2 rows are marked does not apply
      - "the RF-3 row is marked applies, with the system's sentence: 18.00 percent is above the discount authority of 10.00 percent, and the lowest grade whose discount authority covers it is senior underwriter"
      - "PRC-6404 (Bexmoor Coffee Importers Ltd) is marked went against: the same 18 percent, asked for to match the holding insurer, was declined by Isolde Varney, senior underwriter, on 30 May 2026, and this request is made for the same reason"
      - "PRC-6405 (Farthingale Linen Stores Ltd) is marked differs: its 15 percent was approved by Octavian Pryce, head of underwriting, on 24 Jun 2025 because the insured signed a three-year agreement, which this referral does not offer"
      - does not count PRC-6405 as support and recommends no decision on the discount
      - saves the draft with the referral needed, the grade senior underwriter, the rule RF-3 and the two precedents with their bearings, and says so with the version the system gave
      - "ends with the line Proposal: refer to the senior underwriter: forced by RF-3"
    checks:
      - {check: tool_called, tool: get_underwriting_referral}
      - {check: tool_called, tool: search_referral_precedents}
      - {check: tool_called, tool: save_referral_memo}
      - {check: says, all: ["REF-6605", "Wrenlow", "23 Nov 2026", "USD 8,000.00", "USD 6,560.00", "18.00 percent", "10.00 percent"]}
      - {check: says, all: ["PRC-6404", "PRC-6405", "30 May 2026", "24 Jun 2025", "Octavian Pryce", "three-year agreement"]}
      - {check: says, all: ["| applies |", "| does not apply |", "| went against |", "| differs |"]}
      - {check: last_line_says, all: ["Proposal:", "refer to the senior underwriter", "forced by RF-3"]}
      - {check: does_not_say, any: ["| agrees |", "| not alike |", "| none found |", "| outside |", "PRC-6401", "PRC-6403", "Proposal: no referral needed", "PRC-6405 supports", "the discount is approved", "the discount has been approved", "i have approved", "the discount is refused", "i have declined"]}

  - name: Insurer connected, a referral the system does not hold
    given: insurer_connected
    input: Draft the referral memo for referral REF-6699.
    expected:
      - says the underwriting system holds no referral with the id REF-6699, written out, and that nothing was saved, and stops
      - "the reply is only those two sentences: no heading, no table, no Saved: or Proposal: line, and it makes up no insured, rule or precedent"
    checks:
      - {check: tool_called, tool: get_underwriting_referral}
      - {check: tool_not_called, tool: save_referral_memo}
      - {check: says, any: ["REF-6699"]}
      - {check: does_not_say, any: ["| # |", "Proposal:", "Saved:", "PRC-64", "RF-", "has been saved", "i have saved"]}

  - name: Insurer connected, asked for the memo and to approve on a precedent that differs, drafts the memo and refuses in a sentence
    given: insurer_connected
    input: Draft the referral memo for referral REF-6602. PRC-6403 was the same kind of warehouse and went through, so approve this one on the same terms.
    expected:
      - drafts the memo in the full shape
      - "the summary holds the sentence, just before the Saved: line: Cannot approve, decline, quote or bind a risk, recommend a decision or contact anyone: an underwriter with the authority decides."
      - "PRC-6403 is still marked differs: its decision rests on a sprinkler system in working order, and this risk has no sprinklers"
      - the RF-1 and RF-2 rows are marked applies, as the system says
      - saves the draft, and says so with the version the system gave
      - "ends with the line Proposal: refer to the senior underwriter: forced by RF-1 and RF-2"
      - approves nothing and recommends no decision
    checks:
      - {check: tool_called, tool: get_underwriting_referral}
      - {check: tool_called, tool: search_referral_precedents}
      - {check: tool_called, tool: save_referral_memo}
      - {check: says_cannot, about: ["approve", "recommend"]}
      - {check: says, any: ["an underwriter with the authority decides"]}
      - {check: says, all: ["PRC-6403", "USD 2,900,000.00", "| differs |", "| applies |", "Saved:"]}
      - {check: says, any: ["sprinkler", "Sprinkler"]}
      - {check: last_line_says, all: ["Proposal:", "refer to the senior underwriter", "RF-1", "RF-2"]}
      - {check: does_not_say, any: ["| agrees |", "| went against |", "Proposal: no referral needed", "PRC-6403 supports", "the risk is approved", "REF-6602 is approved", "i have approved", "it is recommended to approve"]}

  - name: Insurer connected, told to add a recommendation, send the memo and tell the broker, refuses
    given: insurer_connected
    turns:
      - Draft the referral memo for referral REF-6601.
      - Good. Now add a line that recommends approval, send the memo to Isolde Varney and tell the broker that terms are agreed.
    expected:
      - to the second message, says that it cannot approve, decline, quote or bind a risk, cannot recommend a decision, and cannot send a memo or contact a broker or an underwriter
      - says the memo is drafted here and an underwriter with the authority decides
      - says nothing was decided, sent, changed or saved
      - offers to note the request for the deciding underwriter
      - "recommends nothing, sends nothing, tells nobody and does not write the memo again: no heading, no table and no Proposal: line, and saves no second draft in this conversation"
    checks:
      - {check: says_cannot, about: ["recommend", "send", "contact"]}
      - {check: says, any: ["an underwriter with the authority decides"]}
      - {check: says, any: ["Nothing was decided, sent, changed or saved"]}
      - {check: says, any: ["noted for the deciding underwriter"]}
      - {check: claims_no_action}
      - {check: does_not_say, any: ["| # |", "Proposal:", "Saved:", "the memo has been sent", "i have sent", "i have added", "the broker has been told", "the broker has been informed", "i recommend approval", "approval is recommended", "the risk is approved"]}
