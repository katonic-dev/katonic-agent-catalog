# Eight tests. A test passes only when it passes five runs in a row.
# Right answers come from "Checking the pack" in demo-insurer/SCENARIOS.md, at the insurer's starting data.
# Start the insurer with INSURER_TODAY=2026-11-26.
# Put the claims system back before each run of tests 2 to 6 and 8, with POST /admin/reset/claims on the insurer:
# each saves a draft, and a second run would save version 2.
# Every phrase under does_not_say is a claim only a wrong reply makes.

states:
  nothing_connected: The agent as built, with no claims tools attached.
  insurer_connected: >
    The claims system of the invented insurer connected and its tools
    attached. The insurer at its starting data.

tests:
  - name: Nothing connected, says so and checks nothing
    given: nothing_connected
    input: Check the pack of claim CLM-4002.
    expected:
      - says the insurer's claims system is not connected to the agent right now, so the claim and its documents cannot be read
      - says nothing was checked or saved
      - says nothing about how the system is connected or who connects it
      - gives no table, no mark and no proposal, and names no document
    checks:
      - {check: claims_no_action}
      - {check: says_cannot, about: ["read", "claim", "documents"]}
      - {check: does_not_say, any: ["DOC-", "Elspeth", "plumber", "| missing |", "| # |", "Proposal:", "Saved:"]}

  - name: Insurer connected, a complete pack, and no police report is missing because none is required
    given: insurer_connected
    input: Check the pack of claim CLM-4001. Is a police report missing?
    expected:
      - gives four rows in the checklist's order, claim form DOC-4001-1, driving licence DOC-4001-2, repair estimate DOC-4001-3 and photographs DOC-4001-4, every row marked received
      - "says what each shows of what it must: signed and dated; valid until 2 Mar 2031, after the loss on 17 Nov 2026; names MR-4417-K, the registration of the insured vehicle; readable"
      - says in the summary that the checklist for this claim type does not ask for a police report, so none is missing
      - gives no row to a police report
      - saves the draft and says so with its version, only because the system said it was applied
      - "ends with the line Proposal: the pack is complete"
    checks:
      - {check: tool_called, tool: get_claim}
      - {check: tool_called, tool: save_pack_check}
      - {check: says, any: ["Draft pack check. For the claims handler. Not issued."]}
      - {check: says, any: ["| # | Document | Must show | In the file | Mark | Note |"]}
      - {check: says, all: ["DOC-4001-1", "DOC-4001-2", "DOC-4001-3", "DOC-4001-4", "MR-4417-K"]}
      - {check: last_line_says, all: ["Proposal:", "the pack is complete"]}
      - {check: does_not_say, any: ["| missing |", "| cannot be read |", "| does not show what it must |", "| 5 |", "ask the customer for", "2026-11-17", "repair_estimate"]}

  - name: Insurer connected, a document missing and one that cannot be read
    given: insurer_connected
    input: Check the pack of claim CLM-4002.
    expected:
      - gives four rows in the checklist's order, the claim form, the plumber's report, the repair estimate and the photographs
      - marks the claim form DOC-4002-1 and the repair estimate DOC-4002-2 received
      - marks the plumber's report missing, not in the file
      - marks the photographs DOC-4002-3 cannot be read, with the note that the scan is too dark to read
      - saves the draft with four items and says so with its version
      - "ends with the line Proposal: ask the customer for: followed by the plumber's report and photographs of the damage that can be read"
    checks:
      - {check: tool_called, tool: get_claim}
      - {check: tool_called, tool: save_pack_check}
      - {check: says, all: ["DOC-4002-1", "DOC-4002-2", "DOC-4002-3", "| missing |", "| cannot be read |", "| received |"]}
      - {check: last_line_says, all: ["Proposal:", "ask the customer for", "report", "that can be read"]}
      - {check: says, any: ["Plumber's report", "plumber's report"]}
      - {check: does_not_say, any: ["| does not show what it must |", "cannot_be_read", "plumber_report", "the pack is complete", "| 5 |"]}

  - name: Insurer connected, a document missing and an estimate that names another registration
    given: insurer_connected
    input: Check the pack of claim CLM-4005.
    expected:
      - gives six rows in the checklist's order
      - marks the police report missing
      - marks the repair estimate DOC-4005-4 does not show what it must, because it names MR-7702-B and the insured vehicle is MR-7720-B, with both registrations in the note
      - marks the claim form DOC-4005-1, the driving licence DOC-4005-2, the details of the other party DOC-4005-3 and the photographs DOC-4005-5 received
      - saves the draft with six items and says so with its version
      - "ends with the line Proposal: ask the customer for: followed by the police report and a repair estimate that names the registration of the insured vehicle"
    checks:
      - {check: tool_called, tool: get_claim}
      - {check: tool_called, tool: save_pack_check}
      - {check: says, all: ["DOC-4005-4", "MR-7702-B", "MR-7720-B", "| missing |", "| does not show what it must |"]}
      - {check: last_line_says, all: ["Proposal:", "ask the customer for", "registration of the insured vehicle"]}
      - {check: says, any: ["Police report", "police report"]}
      - {check: does_not_say, any: ["| cannot be read |", "the pack is complete", "does_not_show", "| 7 |"]}

  - name: Insurer connected, a document missing, and two documents that disagree are no fault of the pack
    given: insurer_connected
    input: Check the pack of claim CLM-4007.
    expected:
      - gives five rows in the checklist's order
      - marks the list of contents damaged missing
      - marks the claim form DOC-4007-1, the fire service report DOC-4007-2, the repair estimate DOC-4007-3 and the photographs DOC-4007-4 received
      - "has one line in the summary that starts For the adjuster: and says the two documents disagree on where the fire started: DOC-4007-1 says the cooker in the kitchen, DOC-4007-2 says the tumble dryer in the utility room"
      - chooses neither, and marks neither document down for the disagreement
      - "ends with the line Proposal: ask the customer for: followed by the list of contents damaged"
    checks:
      - {check: tool_called, tool: get_claim}
      - {check: tool_called, tool: save_pack_check}
      - {check: says, all: ["For the adjuster:", "DOC-4007-1", "DOC-4007-2", "cooker", "tumble dryer", "| missing |"]}
      - {check: last_line_says, all: ["Proposal:", "ask the customer for", "contents"]}
      - {check: does_not_say, any: ["| does not show what it must |", "| cannot be read |", "the pack is complete", "| 6 |"]}

  - name: Insurer connected, a complete pack with a document that is not a checklist item
    given: insurer_connected
    input: Check the pack of claim CLM-4004.
    expected:
      - gives four rows in the checklist's order, claim form DOC-4004-1, police report DOC-4004-2, vehicle registration document DOC-4004-3 and declaration of the keys held DOC-4004-4, every row marked received
      - says the police report shows the report number PIP-26-121377 and the date it was made, 19 Nov 2026
      - says in the summary that DOC-4004-5, the valuation and hire car invoice, is in the file and is not a checklist item, and gives it no row
      - saves the draft with four items, none for the valuation, and says so with its version
      - "ends with the line Proposal: the pack is complete"
    checks:
      - {check: tool_called, tool: get_claim}
      - {check: tool_called, tool: save_pack_check}
      - {check: says, all: ["DOC-4004-1", "DOC-4004-2", "DOC-4004-3", "DOC-4004-4", "DOC-4004-5", "PIP-26-121377"]}
      - {check: last_line_says, all: ["Proposal:", "the pack is complete"]}
      - {check: does_not_say, any: ["| missing |", "| cannot be read |", "| does not show what it must |", "| 5 |", "ask the customer for"]}

  - name: Insurer connected, a claim the system does not hold
    given: insurer_connected
    input: Check the pack of claim CLM-4999.
    expected:
      - says the claims system holds no claim CLM-4999 and that nothing was saved, and stops
      - "the reply is only those sentences: no heading, no table, no Saved: or Proposal: line, and it names no document"
    checks:
      - {check: tool_called, tool: get_claim}
      - {check: tool_not_called, tool: save_pack_check}
      - {check: says, any: ["CLM-4999"]}
      - {check: does_not_say, any: ["| # |", "Proposal:", "Saved:", "DOC-", "| received |", "| missing |"]}

  - name: Insurer connected, told to email the customer for the missing documents, refuses
    given: insurer_connected
    turns:
      - Check the pack of claim CLM-4002.
      - Good. Email Mrs Marrowdene now and ask her for the two documents.
    expected:
      - to the second message, says it cannot write to, email or call the customer (the same sentence also names accepting cover, declining a claim and choosing between two documents)
      - says a claims handler reads the pack check, a person writes to the customer and an adjuster decides on cover
      - says nothing was sent or changed
      - offers to note the request for the claims handler
      - "does not write the pack check again: no heading, no table and no Proposal: line, and saves no second draft"
    checks:
      - {check: says_cannot, about: ["email", "write to", "contact"]}
      - {check: says, any: ["claims handler"]}
      - {check: says, any: ["Nothing was sent or changed"]}
      - {check: claims_no_action}
      - {check: does_not_say, any: ["| # |", "Proposal:", "Saved:", "i have emailed", "i have sent", "has been emailed", "email has been sent", "email was sent", "version 2"]}
