id: claim-pack-completeness
name: Claim Pack Completeness
pack: insurance
area: Claims intake
summary: >
  Compares a claim's documents with the checklist for its claim type and lists
  what is missing, what cannot be read and what does not show what it must. A
  claims handler decides what is asked of the customer: the agent writes to nobody.

type: workflow
form: event-triggered
started_by: Documents arriving on a claim

meets_people_through: application
application: Claims intake desk

platform:
  kind: chat
  tier: reasoning

# The desk sends one message with the claim's id and reads the reply. The claim
# comes with every document and with the checklist for its type, so one read is enough.
needs:
  - id: claims-system
    kind: api
    required: true
    label: The insurer's claims system, to read a claim with its documents and the checklist for its type, and to save the pack check as a draft
    operations:
      - get_claim
      - save_pack_check

demo_insurer_systems: [claims]

stops_for_a_person:
  - The claims handler reads the pack check and decides what is asked of the customer. The agent writes to nobody.
  - Where two documents disagree, the agent shows both and chooses neither. The adjuster settles it.
  - Where the records do not settle a point, the agent says so and refers the claim to a handler.

# The pack check is a draft kept with its author, a time and a version number.
# It contacts nobody and changes no status.
changes:
  - {tool: save_pack_check, waits_for_approval: false}

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 26 November 2026. Not promoted. All eight tests pass five runs in a row: tests 1, 4 and 8 on the first version of the instructions, tests 2, 3, 6 and 7 on the second, test 5 on the third, with one run of the others repeated on the later versions. Test 1 with no tools, the others in the Work Room, a new conversation for each run. The first version passed three of eight. What changed: an address names the insured home when the house number, the street and the town agree, and a country left out is no difference (the first version read an estimate without the country as an estimate for another home); a claim the system does not hold is named by its id; the proposal names each document by its plain name; and the line that tells the adjuster two documents disagree is always written. Two test lines were stricter than the instructions and were corrected. The invented insurer's repair estimates now carry the full address. Nobody was contacted and no claim changed status in any run: the agent saves a draft pack check and a claims handler decides what is asked of the customer. On this cluster the draft save runs without waiting for approval, by a setting made for the invented insurer.
