id: pre-authorisation-preparation
name: Pre-authorisation Preparation
pack: insurance
area: Health claims
summary: >
  Sets a provider's request for approval against the member's own plan and the
  insurer's medical policy, and prepares the file: what is met, what is not, and
  what the notes do not say. A clinician or an authorised assessor decides. The
  agent never approves and never refuses a request.

type: workflow
form: event-triggered
started_by: A pre-authorisation request arriving, which the health system can announce through its pre-authorisation-request event

meets_people_through: application
application: Health claims desk

platform:
  kind: chat
  tier: reasoning

# The desk sends one message with the request's id and reads the reply. The
# request comes whole in one read: the member's cover on the planned date, the
# row of the member's own plan, the plan's position, the medical policy with its
# criteria, and both of the provider's documents. No other read is needed.
needs:
  - id: health-system
    kind: api
    required: true
    label: The insurer's health system, to read a pre-authorisation request with everything needed to assess it, and to save the assessment as a draft
    operations:
      - get_pre_authorisation_request
      - save_pre_authorisation_assessment

demo_insurer_systems: [health]

stops_for_a_person:
  - The assessor reads the file and decides. The agent approves nothing and refuses nothing, whichever way the file falls.
  - Where a criterion of the medical policy is not met, the file goes to the medical reviewer, a clinician. Only the medical reviewer declines a request.
  - Where the notes say nothing about a criterion, the agent proposes a question for the provider. A person asks it; the agent contacts nobody.
  - Where the member's cover is not in force on the planned date, the plan does not cover the procedure, or the plan needs no pre-authorisation for it, the work stops there and goes to the assessor.

# Saving an assessment is a draft kept with its author, a time and a version
# number. It approves nothing, declines nothing and contacts nobody.
changes:
  - {tool: save_pre_authorisation_assessment, waits_for_approval: false}

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 26 November 2026. Not promoted. All ten tests pass five runs in a row on the first version of the instructions. Test 1 with no tools, the others in the Work Room, a new conversation for each run. The agent reads one request with everything the system gives for it (the member's cover on the planned date, the row of the member's own plan, whether the plan needs pre-authorisation, the medical policy and the provider's two documents) and judges each criterion from the provider's notes: met, not met, or not stated. A criterion the notes say nothing about was asked of the provider and never guessed, in every run. Two things judged on what the Work Room shows and not on the raw text: the lines of the summary appear as separate paragraphs, and a check written as a row of bars and cells was judged on the cells shown. No request was approved or refused and none changed status in any run: the agent saves a draft file and a clinician or an authorised assessor decides. On this cluster the draft save runs without waiting for approval, by a setting made for the invented insurer.
