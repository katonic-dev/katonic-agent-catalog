id: claims-processing
name: Claims Processing
pack: insurance
area: Claims intake
summary: >
  Sorts a new claim by the sorting rules of the insurer's claims handling
  guide so that it reaches the right team, with the rule and the reason. A
  claims handler decides: the agent assigns nothing.

type: workflow
form: event-triggered
started_by: A claim being registered

meets_people_through: application
application: Claims intake desk

platform:
  kind: chat
  tier: reasoning

# The desk sends one message with the claim's id and reads the reply. The claim
# comes with its whole file, so one read of the claim and one of the guide are enough.
needs:
  - id: claims-system
    kind: api
    required: true
    label: The insurer's claims system, to read a claim with its whole file, read the claims handling guide and save how the claim is sorted as a draft
    operations:
      - get_claim
      - get_claims_handling_guide
      - save_claim_triage

demo_insurer_systems: [claims]

stops_for_a_person:
  - The claims handler reads the sorting and assigns the claim. The agent assigns it to nobody.
  - Whether the wording covers the loss is for the coverage check and an adjuster. The agent accepts and declines nothing.
  - Where the file does not settle which rule applies, the agent says so and refers the claim to a handler.

# The sorting is a draft kept with its author, a time and a version number.
# It assigns the claim to nobody and changes no status.
changes:
  - {tool: save_claim_triage, waits_for_approval: false}

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 26 November 2026. Not promoted. All eight tests pass five runs in a row: tests 1, 2, 5 and 8 on the first version of the instructions, tests 3, 4, 6 and 7 on the second, with one run of each of the others repeated on the second version. Test 1 with no tools, the others in the Work Room, a new conversation for each run. What the second version changed: a row on cover gives the system's sentence of reason in full, a row on an injury names the person as the document does, a claim the system does not hold is named by its id, and a yes or no fact is written in words. One test line was wrong and was corrected: test 6 asked the reply to say in words that the driver point changes no row; the instructions ask only that the point is named as one for the coverage check, and the table shows the rest. No claim was assigned and none changed status in any run: the agent saves a draft sorting and a claims handler assigns the claim. The first version passed four of eight. On this cluster the draft save runs without waiting for approval, by a setting made for the invented insurer.
