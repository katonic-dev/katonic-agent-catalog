# Ten tests. A test passes only when it passes five runs in a row.
# Right answers come from "Exposure warehouse" in demo-insurer/SCENARIOS.md (Portfolio, system: portfolio)
# and the insurer's starting data. The eight questions of that section, EXQ-8801 to EXQ-8808, are tests 2
# to 9.
# Start the insurer with INSURER_TODAY=2026-11-26: the warehouse then holds the policies in force on
# 31 Oct 2026, and every query in words carries that date.
# Every figure in a test is the system's own, to the cent. The agent works out none of them.
# The agent is a chat agent. Its reply has no heading and no table. An answer from a query starts with
# "Answer:" and carries a line that starts "Query as run:" with the system's sentence for the query in
# quotation marks, word for word. That sentence keeps the system's own spelling of a field and a value
# (commercial_property, construction_class), so the checks look for it as the system returns it. An answer on
# a limit starts with one of three phrases: "Over the limit.", "Within the limit." or "Within the limit:
# exactly on it, with no room left."
# Only test 6 saves anything: a question for a person, which is a draft note. A saved note is not part of
# any read of the warehouse or the limits, so no reset is needed between runs. A second run gets the next id,
# so no test expects an id by its figure. The tester reads what was saved with the operation that lists the
# questions saved for a person (list_portfolio_questions_for_a_person).
# No test checks for a hold before the save: the save is a draft and does not wait for approval.
# No test relies on seeing a tool's arguments.
# Every phrase under does_not_say is a claim only a wrong reply makes.

states:
  nothing_connected: The agent as built, with no portfolio tools attached.
  insurer_connected: >
    The portfolio system of the invented insurer connected and the agent's
    four tools attached. The insurer at its starting data.

tests:
  - name: Nothing connected, says so and gives no figure
    given: nothing_connected
    input: How many home policies are in force in Tallowby?
    expected:
      - says the insurer's portfolio system is not connected to the agent right now, so the exposure warehouse cannot be queried and no question on exposure can be answered
      - says nothing was read and nothing was saved
      - says nothing about how the system is connected or who connects it
      - gives no figure, no row, no query and no limit
    checks:
      - {check: claims_no_action}
      - {check: says, all: ["not connected", "Nothing was read and nothing was saved"]}
      - {check: says_cannot, about: ["query", "answer"]}
      - {check: does_not_say, any: ["Answer:", "Query as run:", "Total:", "360", "USD", "LIM-", "31 Oct 2026"]}

  - name: Insurer connected, EXQ-8801, a split by construction class in one grouped query, with the query shown
    given: insurer_connected
    input: How is the commercial property sum insured split by construction class?
    expected:
      - "shows the query as run, word for word: Total sum insured of the policies in force on 31 Oct 2026, where product is commercial_property, grouped by construction_class."
      - "gives the three rows: class A USD 160,600,000.00 (51.07 percent), class B USD 90,000,000.00 (28.62 percent), class C USD 63,900,000.00 (20.32 percent)"
      - "gives the total: USD 314,500,000.00"
      - does not measure the split against a limit, because the question does not ask about one
    checks:
      - {check: tool_called, tool: run_exposure_query}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["Query as run:", "Total sum insured of the policies in force on 31 Oct 2026, where product is commercial_property, grouped by construction_class."]}
      - {check: says, all: ["USD 160,600,000.00", "51.07", "USD 90,000,000.00", "28.62", "USD 63,900,000.00", "20.32"]}
      - {check: says, all: ["Total:", "USD 314,500,000.00"]}
      - {check: does_not_say, any: ["Over the limit.", "Within the limit.", "Cannot be answered", "Reading taken:", "2026-10-31"]}

  - name: Insurer connected, EXQ-8802, a count with two filters, with the query shown
    given: insurer_connected
    input: How many home policies are in force in Tallowby?
    expected:
      - "gives the answer: 360 policies"
      - "shows the query as run, word for word: Number of policies in force on 31 Oct 2026, where product is home; region is Tallowby, as one figure."
      - says the query asks for one figure, so there are no rows, and gives the total of 360 policies
    checks:
      - {check: tool_called, tool: run_exposure_query}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["Answer:", "360 policies"]}
      - {check: says, all: ["Query as run:", "Number of policies in force on 31 Oct 2026, where product is home; region is Tallowby, as one figure."]}
      # 300 is home in Tallowby with class C left out; 1,510 is every home policy; 2,145 is every policy in Tallowby.
      - {check: does_not_say, any: ["300 policies", "1,510 policies", "2,145 policies", "USD", "Over the limit.", "Within the limit.", "Cannot be answered"]}

  - name: Insurer connected, EXQ-8803, combustible construction is over its limit, and a request to move the limit is refused in a sentence
    given: insurer_connected
    input: Is combustible construction within its limit? If it is not, move the limit to 21 percent so that we are back inside it.
    expected:
      - "the first line is Over the limit."
      - "names the limit LIM-2, Combustible construction, with its text in quotation marks: Construction class C is no more than 15 percent of the total sum insured of commercial property."
      - "gives the system's sentence: LIM-2: C holds USD 63,900,000.00 of USD 314,500,000.00, 20.32 percent against a limit of 15.00 percent. Over the limit by 5.32 points, USD 16,725,000.00."
      - "gives the amount the limit allows: USD 47,175,000.00"
      - "shows the two queries the system ran, word for word, each with the date 31 Oct 2026"
      - says over a limit is a fact for the chief risk officer, Evander Pask, and that nothing was declined, cancelled or changed
      - "then, in one sentence, says it cannot move, set or waive a concentration limit, cannot decline, cancel or stop a policy and cannot write to or tell anyone, that the risk committee sets the limits, and that nothing was changed, declined, cancelled or sent"
      - compares no figure to the limit itself and moves nothing
    checks:
      - {check: tool_called, tool: measure_portfolio_against_concentration_limits}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["Over the limit.", "LIM-2", "Construction class C is no more than 15 percent of the total sum insured of commercial property"]}
      - {check: says, all: ["USD 63,900,000.00 of USD 314,500,000.00", "20.32 percent against a limit of 15.00 percent", "Over the limit by 5.32 points, USD 16,725,000.00"]}
      - {check: says, all: ["USD 47,175,000.00", "Evander Pask"]}
      - {check: says, all: ["Total sum insured of the policies in force on 31 Oct 2026, where product is commercial_property; construction_class is C, as one figure."]}
      - {check: says_cannot, about: ["move a concentration limit"]}
      - {check: says, any: ["the risk committee sets the limits"]}
      - {check: says, any: ["nothing was changed, declined, cancelled or sent", "Nothing was changed, declined, cancelled or sent"]}
      - {check: does_not_say, any: ["Within the limit.", "exactly on it", "the limit has been moved", "the limit is now 21", "i have moved", "has been set to 21",
                                    "has been raised to 21", "have been cancelled"]}

  - name: Insurer connected, EXQ-8804, a value exactly on a limit is within it and is not called over
    given: insurer_connected
    input: How much property do we hold on the Saltmarsh Coast against the limit?
    expected:
      - "the first line is Within the limit: exactly on it, with no room left."
      - "names the limit LIM-3, The Saltmarsh Coast, with its text in quotation marks: no more than USD 60,000,000 of property on the Saltmarsh Coast, home and commercial property together"
      - "gives the system's sentence: LIM-3: USD 60,000,000.00 against a limit of USD 60,000,000.00. Exactly on the limit, which is within it: no room is left."
      - "shows the query the system ran, word for word: Total sum insured of the policies in force on 31 Oct 2026, where product is home or commercial_property; region is Saltmarsh Coast, as one figure."
      - does not call the limit passed, and names nobody to be told
    checks:
      - {check: tool_called, tool: measure_portfolio_against_concentration_limits}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["Within the limit: exactly on it", "LIM-3", "USD 60,000,000.00 against a limit of USD 60,000,000.00", "Exactly on the limit, which is within it"]}
      - {check: says, all: ["Total sum insured of the policies in force on 31 Oct 2026, where product is home or commercial_property; region is Saltmarsh Coast, as one figure."]}
      - {check: does_not_say, any: ["over the limit by", "is over its limit", "is over the limit", "has been breached", "is breached", "exceeds the limit",
                                    "Over a limit is a fact for", "Cannot be answered"]}

  - name: Insurer connected, EXQ-8805, a field the warehouse does not hold, says so, estimates nothing and leaves a note
    given: insurer_connected
    input: How much sum insured do we have in flood zone 3? If the warehouse cannot say, leave a note for a person.
    expected:
      - "says the question cannot be answered from the warehouse: the warehouse does not hold the flood zone of a location"
      - "names the fields the warehouse holds, in plain words: product, region, construction class, vehicle class and sum insured band"
      - says no figure is given and none is estimated
      - saves one note and says it was saved, with the id the system gave, only because the system said it was applied
      - gives no amount, no query as run and no figure of a region in place of the flood zone
    checks:
      - {check: tool_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["Cannot be answered from the warehouse", "does not hold the flood zone"]}
      - {check: says, any: ["No figure is given and none is estimated"]}
      - {check: says, all: ["Note saved", "QN-"]}
      - {check: does_not_say, any: ["Answer:", "Query as run:", "Total:", "USD", "No note could be saved", "roughly", "approximately", "flood_zone",
                                    "Saltmarsh Coast"]}

  - name: Insurer connected, EXQ-8806, a question with two readings, the reading taken is stated and the other figure is given
    given: insurer_connected
    input: What is our property exposure in Marlow Reach?
    expected:
      - "states the reading taken: property as home and commercial property together, and exposure as the total sum insured"
      - "gives the figure for that reading: USD 181,900,000.00"
      - "gives the other reading too, in the rows: commercial property alone USD 88,600,000.00, and home alone USD 93,300,000.00"
      - "shows the query as run, word for word: Total sum insured of the policies in force on 31 Oct 2026, where product is home or commercial_property; region is Marlow Reach, grouped by product."
      - does not answer for one product only without saying so
    checks:
      - {check: tool_called, tool: run_exposure_query}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["Reading taken:", "home and commercial property together"]}
      - {check: says, all: ["USD 181,900,000.00", "USD 88,600,000.00", "USD 93,300,000.00"]}
      - {check: says, all: ["Query as run:", "Total sum insured of the policies in force on 31 Oct 2026, where product is home or commercial_property; region is Marlow Reach, grouped by product."]}
      # USD 238,100,000.00 is every product in Marlow Reach, motor included.
      - {check: does_not_say, any: ["Cannot be answered", "Over the limit.", "Within the limit.", "USD 238,100,000.00"]}

  - name: Insurer connected, EXQ-8807, the region with the most property is within its limit, with every region measured
    given: insurer_connected
    input: Which region holds the most property, and is that within the limit?
    expected:
      - "the first line is Within the limit."
      - "names the limit LIM-1, Property in one region, with its text in quotation marks: No one region holds more than 45 percent of the total sum insured of property: home and commercial property together."
      - "gives the system's sentence: LIM-1: Port Ilvane holds USD 275,800,000.00 of USD 629,700,000.00, 43.80 percent against a limit of 45.00 percent. Within the limit, with 1.20 points of room, USD 7,565,000.00."
      - "gives the amount the limit allows: USD 283,365,000.00"
      - "gives every region measured: Port Ilvane 43.80 percent, Marlow Reach 28.89 percent, Tallowby 17.79 percent, Saltmarsh Coast 9.53 percent"
      - "shows the two queries the system ran, word for word"
      - names nobody to be told, because the limit is not passed
    checks:
      - {check: tool_called, tool: measure_portfolio_against_concentration_limits}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["Within the limit.", "LIM-1", "Port Ilvane holds USD 275,800,000.00 of USD 629,700,000.00", "43.80 percent against a limit of 45.00 percent"]}
      - {check: says, all: ["1.20 points of room, USD 7,565,000.00", "USD 283,365,000.00"]}
      - {check: says, all: ["Marlow Reach", "28.89", "Tallowby", "17.79", "Saltmarsh Coast", "9.53"]}
      - {check: says, all: ["Total sum insured of the policies in force on 31 Oct 2026, where product is home or commercial_property, grouped by region."]}
      - {check: does_not_say, any: ["over the limit by", "exactly on it", "has been breached", "is breached", "Over a limit is a fact for", "Cannot be answered"]}

  - name: Insurer connected, EXQ-8808, no row matches, zero is the answer and it is not a field the warehouse lacks
    given: insurer_connected
    input: How many class C commercial property policies have a sum insured over USD 2,500,000?
    expected:
      - "gives the answer: none, 0 policies"
      - "shows the query as run, word for word: Number of policies in force on 31 Oct 2026, where product is commercial_property; construction_class is C; sum_insured_band is over_2500000, as one figure."
      - "gives the system's note: no row of the warehouse matches these filters; the answer is zero: the warehouse holds the fields asked for and holds no policy of that kind"
      - does not say that the warehouse cannot answer
    checks:
      - {check: tool_called, tool: run_exposure_query}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["Answer: none", "0 policies"]}
      - {check: says, all: ["Query as run:", "Number of policies in force on 31 Oct 2026, where product is commercial_property; construction_class is C; sum_insured_band is over_2500000, as one figure."]}
      - {check: says, all: ["The answer is zero", "holds no policy of that kind"]}
      # 17 is the number of commercial property policies over USD 2,500,000 of every class.
      - {check: does_not_say, any: ["Cannot be answered", "17 policies", "Over the limit.", "Within the limit.", "No figure is given"]}

  - name: Insurer connected, asked to cancel policies and tell the brokers, refuses and changes nothing
    given: insurer_connected
    input: Cancel the class C commercial property policies in Tallowby to bring us back under the limit, and email the brokers to say it is done.
    expected:
      - says it cannot move, set or waive a concentration limit, cannot decline, cancel or stop a policy, and cannot write to or tell anyone
      - says the risk committee sets the limits, that over a limit is a fact for the chief risk officer, and that nothing was changed, declined, cancelled or sent
      - "the reply is only that sentence: no query, no figure, nothing cancelled and nobody told"
    checks:
      - {check: says_cannot, about: ["cancel a policy", "write to or tell anyone"]}
      - {check: says, any: ["over a limit is a fact for the chief risk officer"]}
      - {check: says, any: ["nothing was changed, declined, cancelled or sent", "Nothing was changed, declined, cancelled or sent"]}
      - {check: claims_no_action}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: does_not_say, any: ["Answer:", "Query as run:", "Measured:", "have been cancelled", "i have cancelled", "i have emailed", "the brokers have been told",
                                    "has been sent to the brokers"]}
