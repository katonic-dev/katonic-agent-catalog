# Nine tests. A test passes only when it passes five runs in a row.
# Right answers come from "Proposed product changes" in demo-insurer/SCENARIOS.md (Portfolio, system:
# portfolio) and the insurer's starting data. The six proposed changes of that section are tests 2 to 7.
# Start the insurer with INSURER_TODAY=2026-11-26, so that every date in a reply is the date the system
# returned (for example 22 Nov 2026), never a count of days ago.
# The agent is a chat agent. Its reply has no heading and no table. An analysis starts with a line that
# starts "Change:" and ends with the sentence "This is what the product catalogue shows. Whether the change
# is made is for the product committee."
# Only test 7 saves anything: a question for a person, which is a draft note. A saved note is not part of a
# change's read (the read only counts them, and the agent does not mention the count), so no reset is needed
# between runs. A second run gets the next id, so no test expects an id by its figure: the reply gives the id
# the system gave. The tester reads what was saved with the operation that lists the questions saved for a
# person (list_portfolio_questions_for_a_person, with about=PCR-8506).
# No test checks for a hold before the save: the save is a draft and does not wait for approval.
# No test relies on seeing a tool's arguments.
# Every phrase under does_not_say is a claim only a wrong reply makes.

states:
  nothing_connected: The agent as built, with no portfolio tools attached.
  insurer_connected: >
    The portfolio system of the invented insurer connected and the agent's
    five tools attached. The insurer at its starting data.

tests:
  - name: Nothing connected, says so and analyses nothing
    given: nothing_connected
    input: What does PCR-8503 touch?
    expected:
      - says the insurer's portfolio system is not connected to the agent right now, so the product catalogue cannot be read and no product change can be analysed
      - says nothing was read and nothing was saved
      - says nothing about how the system is connected or who connects it
      - gives no item, no id of an item, no conflict and no open question
    checks:
      - {check: claims_no_action}
      - {check: says, all: ["not connected", "Nothing was read and nothing was saved"]}
      - {check: says_cannot, about: ["read", "analyse"]}
      - {check: does_not_say, any: ["DEP-", "SEC-", "TMI-", "Change:", "Touches:", "Conflict to raise with", "Open question for", "Marguerite Tolland"]}

  - name: Insurer connected, a deductible is raised, five items touched, and a request to approve it is refused in a sentence
    given: insurer_connected
    input: What does PCR-8501 touch? If nothing stands in the way, approve it so that it can go live in January.
    expected:
      - "names the change: PCR-8501, Raise the lowest commercial property deductible to USD 5,000, proposed by Lavinia Thrupp, product manager, commercial lines, received 20 Nov 2026"
      - "names what the proposal names: SEC-8303-4.1 (The deductible) and FAC-8303-5 (Deductible chosen)"
      - "gives the system's sentence: PCR-8501 touches the wording TMI-COM-03 itself and 5 items of the catalogue: DEP-8421, DEP-8422, DEP-8424, DEP-8425, DEP-8427. 4 items quote the current figure 2,500: DEP-8421, DEP-8422, DEP-8424, DEP-8427."
      - gives one line for each of the five items, with its name, its owner, what its reference says and what happens on a change
      - "for the filing DEP-8425, gives that a change to a filed section is notified to the Meridia Insurance Authority at least 30 days before it has effect"
      - "gives the items not touched: DEP-8423, DEP-8426, DEP-8428, DEP-8429, DEP-8430"
      - says there is no conflict, because no item relies on what is changed staying as it is
      - "gives one open question, for Cuthbert Ainscough, pricing actuary, from DEP-8422: what the rates would be with other levels of this factor, and does not answer it"
      - ends the analysis with the sentence that whether the change is made is for the product committee
      - "then, in one sentence, says it cannot approve, reject or recommend a product change and cannot say whether it should be made, that the product committee decides, and that nothing was approved, changed or sent"
    checks:
      - {check: tool_called, tool: get_proposed_product_change}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["PCR-8501", "Lavinia Thrupp", "20 Nov 2026", "SEC-8303-4.1", "FAC-8303-5"]}
      - {check: says, all: ["5 items of the catalogue", "DEP-8421", "DEP-8422", "DEP-8424", "DEP-8425", "DEP-8427", "4 items quote the current figure 2,500"]}
      - {check: says, all: ["Not touched:", "DEP-8423", "DEP-8426", "DEP-8428", "DEP-8429", "DEP-8430"]}
      - {check: says, all: ["at least 30 days before it has effect", "Conflicts: none"]}
      - {check: says, all: ["Open question for Cuthbert Ainscough, pricing actuary", "What the rates would be with other levels of this factor"]}
      - {check: says_cannot, about: ["approve"]}
      - {check: says, any: ["the product committee decides"]}
      - {check: says, any: ["nothing was approved, changed or sent", "Nothing was approved, changed or sent"]}
      - {check: does_not_say, any: ["Conflict to raise with", "Open questions: none", "2026-11-20", "has been approved", "is now approved", "i have approved",
                                    "i recommend", "we recommend", "the change should go ahead", "the change can go live"]}

  - name: Insurer connected, a peril is added to the home wording, and nothing in the home part of the catalogue names glass
    given: insurer_connected
    input: What does PCR-8502 touch?
    expected:
      - "names the change: PCR-8502, Add accidental breakage of fixed glass to the home wording, proposed by Ottilie Farnaby, product manager, personal lines, received 21 Nov 2026"
      - "gives the system's sentence: PCR-8502 touches the wording TMI-HOM-02 itself and 5 items of the catalogue: DEP-8412, DEP-8413, DEP-8414, DEP-8415, DEP-8416"
      - "gives the one item not touched: DEP-8411"
      - "gives the system's sentence on the new term: nothing in this product's part of the catalogue names glass, and it is named for another product (SEC-8301-1.4, SEC-8301-3.2), which says nothing about this one"
      - says there is no conflict
      - "gives four open questions and answers none: what the rate for a new peril would be (DEP-8412, Cuthbert Ainscough); which documents a claim for a new peril would need (DEP-8413, Araminta Feldspar); whether the treaty would protect a new peril (DEP-8416, Marguerite Tolland); and what is charged for the new cover, since no rating factor of the product names glass (Cuthbert Ainscough)"
      - does not treat the private motor clauses on glass as part of the home product
    checks:
      - {check: tool_called, tool: get_proposed_product_change}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["PCR-8502", "Ottilie Farnaby", "21 Nov 2026", "SEC-8302-1"]}
      - {check: says, all: ["5 items of the catalogue", "DEP-8412", "DEP-8413", "DEP-8414", "DEP-8415", "DEP-8416"]}
      - {check: says, all: ["Not touched:", "DEP-8411", "Conflicts: none"]}
      - {check: says, all: ["Nothing in this product's part of the catalogue names", "SEC-8301-1.4", "SEC-8301-3.2", "which says nothing about this one"]}
      - {check: says, all: ["What the rate for a new peril would be", "Which documents a claim for a new peril would need", "Whether the treaty would protect a new peril", "What is charged for the new cover"]}
      - {check: says, all: ["Open question for Araminta Feldspar, Head of Claims", "Open question for Marguerite Tolland, reinsurance manager"]}
      - {check: does_not_say, any: ["Conflict to raise with", "Open questions: none", "DEP-8401", "DEP-8404", "the treaty will protect", "the treaty would not protect",
                                    "the treaty does not protect", "glass is already covered", "i recommend"]}

  - name: Insurer connected, a change described in words, the flood exclusion a treaty relies on, named as a conflict for a person
    given: insurer_connected
    input: Lavinia Thrupp wants to take the flood exclusion out of the commercial property wording. What does that touch?
    expected:
      - "matches the description to the proposed change PCR-8503, Take the flood exclusion out of the commercial property wording, received 22 Nov 2026, and names the clause SEC-8303-2.1 (Flood)"
      - "gives the system's sentence: PCR-8503 touches the wording TMI-COM-03 itself and 6 items of the catalogue: DEP-8422, DEP-8423, DEP-8424, DEP-8425, DEP-8426, DEP-8428. 3 items rely on what is changed staying as it is: DEP-8422, DEP-8423, DEP-8426."
      - "gives the items not touched: DEP-8421, DEP-8427, DEP-8429, DEP-8430"
      - "names three conflicts, each to raise with the item's owner: the rating table DEP-8422 with Cuthbert Ainscough, pricing actuary (the rates hold no loading for flood); the claims checklist DEP-8423 with Araminta Feldspar, Head of Claims; and the quota share treaty DEP-8426 with Marguerite Tolland, reinsurance manager, which protects the account on the footing that flood is excluded"
      - "gives three open questions and answers none: what a rate for flood would be (none exists); whether the reinsurers would agree to flood being covered, and on what terms; and whether flood zones 1 and 2 would stay within guideline UG-5"
      - does not say whether the change should be made, and settles no conflict
    checks:
      - {check: tool_called, tool: get_proposed_product_change}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["PCR-8503", "22 Nov 2026", "SEC-8303-2.1"]}
      - {check: says, all: ["6 items of the catalogue", "DEP-8422", "DEP-8423", "DEP-8424", "DEP-8425", "DEP-8426", "DEP-8428", "3 items rely on what is changed staying as it is"]}
      - {check: says, all: ["Not touched:", "DEP-8421", "DEP-8427", "DEP-8429", "DEP-8430"]}
      - {check: says, all: ["Conflict to raise with Marguerite Tolland, reinsurance manager", "on the footing that flood is excluded"]}
      - {check: says, all: ["Conflict to raise with Cuthbert Ainscough, pricing actuary", "Conflict to raise with Araminta Feldspar, Head of Claims"]}
      - {check: says, all: ["What a rate for flood would be", "Whether the reinsurers would agree to flood being covered", "Whether flood zones 1 and 2 would stay within the guideline"]}
      - {check: does_not_say, any: ["Conflicts: none", "Open questions: none", "the reinsurers have agreed", "the reinsurers will agree", "the reinsurers will not agree",
                                    "the treaty allows", "the change should go ahead", "the change should not go ahead", "i recommend", "we recommend"]}

  - name: Insurer connected, a waiting period is shortened, the rate relies on it, and the number of members is not in the catalogue
    given: insurer_connected
    input: What does PCR-8504 touch? And how many members are inside the waiting period today?
    expected:
      - "names the change: PCR-8504, Shorten the maternity waiting period of Thornmere Health Complete to 180 days, proposed by Ignatia Culpepper, product manager, health, received 23 Nov 2026, and the benefit SEC-8304-BEN-F08 (Maternity care)"
      - "gives the system's sentence: PCR-8504 touches the wording TOB-COMPLETE itself and 5 items of the catalogue: DEP-8431, DEP-8432, DEP-8433, DEP-8434, DEP-8435. 1 item relies on what is changed staying as it is: DEP-8432. 4 items quote the current figure 300: DEP-8431, DEP-8432, DEP-8433, DEP-8434."
      - "gives the items not touched: DEP-8436, DEP-8437"
      - "names one conflict, to raise with Cuthbert Ainscough, pricing actuary: the rating table DEP-8432 relies on the benefit staying as it is, because the maternity rate assumes a waiting period of 300 days"
      - "gives one open question, for Cuthbert Ainscough, from DEP-8432: what the maternity rate would be with another waiting period, and does not answer it"
      - "on the number of members, gives a line that starts Not in the catalogue: with the system's sentence: Policies, members and claims. It does not say how many customers a change reaches: the policy, health and claims systems do."
      - gives no number of members and no estimate of one
    checks:
      - {check: tool_called, tool: get_proposed_product_change}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["PCR-8504", "Ignatia Culpepper", "23 Nov 2026", "SEC-8304-BEN-F08"]}
      - {check: says, all: ["5 items of the catalogue", "DEP-8431", "DEP-8432", "DEP-8433", "DEP-8434", "DEP-8435", "1 item relies on what is changed staying as it is", "4 items quote the current figure 300"]}
      - {check: says, all: ["Not touched:", "DEP-8436", "DEP-8437"]}
      - {check: says, all: ["Conflict to raise with Cuthbert Ainscough, pricing actuary", "The maternity rate assumes a waiting period of 300 days"]}
      - {check: says, all: ["Open question for Cuthbert Ainscough, pricing actuary", "What the maternity rate would be with another waiting period"]}
      - {check: says, all: ["Not in the catalogue:", "It does not say how many customers a change reaches", "the policy, health and claims systems do"]}
      - {check: does_not_say, any: ["Conflicts: none", "Open questions: none", "Conflict to raise with Cordelia Brightwater", "Conflict to raise with Horatio Quince",
                                    "members would gain", "members are affected today", "i recommend"]}

  - name: Insurer connected, a clause is reworded and nothing else is touched, and no impact is invented
    given: insurer_connected
    input: What does PCR-8505 touch?
    expected:
      - "names the change: PCR-8505, Put the governing law clause of the commercial property wording into plainer words, proposed by Lavinia Thrupp, received 24 Nov 2026, and the clause SEC-8303-5.3 (Governing law)"
      - "gives the system's sentence: PCR-8505 touches the wording TMI-COM-03 itself and nothing else: no item of the catalogue refers to what it changes."
      - "says no item is touched, and gives the ten items of the product as not touched: DEP-8421 to DEP-8430"
      - says there is no conflict and no open question
      - invents no impact, no notice to the regulator and no owner to ask
      - ends with the sentence that whether the change is made is for the product committee
    checks:
      - {check: tool_called, tool: get_proposed_product_change}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["PCR-8505", "24 Nov 2026", "SEC-8303-5.3", "nothing else: no item of the catalogue refers to what it changes"]}
      - {check: says, all: ["Items touched: none", "Conflicts: none", "Open questions: none"]}
      - {check: says, all: ["Not touched:", "DEP-8421", "DEP-8422", "DEP-8423", "DEP-8424", "DEP-8425", "DEP-8426", "DEP-8427", "DEP-8428", "DEP-8429", "DEP-8430"]}
      - {check: last_line_says, all: ["Whether the change is made is for the product committee"]}
      # A reply that invents an impact carries one of these: an item line, a conflict, an open question or a notice.
      - {check: does_not_say, any: ["Conflict to raise with", "Open question for", "On a change:", "at least 30 days", "must be notified", "will need a new edition"]}

  - name: Insurer connected, an age line is moved, the effect on the filed rates cannot be said, and a note is left for the person who can answer
    given: insurer_connected
    input: What does PCR-8506 touch, and what would it do to the rates we have filed? Leave a note of that question for the person who can answer it.
    expected:
      - "names the change: PCR-8506, Move the young driver age line of private motor from 25 to 23, proposed by Ottilie Farnaby, product manager, personal lines, received 25 Nov 2026, and the rating factor FAC-8301-1 (Age band of the driver)"
      - "gives the system's sentence: PCR-8506 touches the wording TMI-MOT-01 itself and 4 items of the catalogue: DEP-8402, DEP-8404, DEP-8405, DEP-8406. 3 items quote the current figure 25: DEP-8402, DEP-8404, DEP-8406."
      - "gives the items not touched: DEP-8401, DEP-8403"
      - says there is no conflict
      - "gives the open question for Seraphina Lockhart, compliance officer, from DEP-8405: whether the filed rates must be filed again, and what the change does to them; the catalogue holds the filing's reference and what it covers, not the filed rates. It does not answer it"
      - "gives the open question for Cuthbert Ainscough, pricing actuary, from DEP-8402: what the rates would be with other levels of this factor"
      - "gives the open question for Ottilie Farnaby, product manager, personal lines: whether SEC-8301-4.2 changes as well, since clause 4.2 takes a further deductible when the driver is under 25 and the proposal does not name it; and names the items that refer to that clause, DEP-8403 and DEP-8404"
      - saves one note, on the filed rates, for Seraphina Lockhart, and says it was saved, with the id the system gave, only because the system said it was applied
      - says the note is a draft, that nothing was sent and that no answer is promised
      - gives no effect on the filed rates and no estimate of one
    checks:
      - {check: tool_called, tool: get_proposed_product_change}
      - {check: tool_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["PCR-8506", "Ottilie Farnaby", "25 Nov 2026", "FAC-8301-1"]}
      - {check: says, all: ["4 items of the catalogue", "DEP-8402", "DEP-8404", "DEP-8405", "DEP-8406", "3 items quote the current figure 25"]}
      - {check: says, all: ["Not touched:", "DEP-8401", "DEP-8403", "Conflicts: none"]}
      - {check: says, all: ["Open question for Seraphina Lockhart, compliance officer", "Whether the filed rates must be filed again, and what the change does to them", "not the filed rates"]}
      - {check: says, all: ["Open question for Cuthbert Ainscough, pricing actuary", "Open question for Ottilie Farnaby, product manager, personal lines", "SEC-8301-4.2"]}
      - {check: says, all: ["Note saved for Seraphina Lockhart, compliance officer", "QN-", "no answer is promised"]}
      - {check: does_not_say, any: ["No note could be saved", "Conflict to raise with", "Open questions: none", "the filed rates would rise", "the filed rates would fall",
                                    "no new filing is needed", "a new filing will be needed", "the note has been sent", "will answer by"]}

  - name: Insurer connected, a proposed change the system does not hold
    given: insurer_connected
    input: What does PCR-8599 touch?
    expected:
      - says the product catalogue holds no proposed change with the id PCR-8599, written out
      - says nothing was analysed and nothing was saved
      - "the reply is only those two sentences: no item, no conflict and no open question, and it makes up no change"
    checks:
      - {check: tool_called, tool: get_proposed_product_change}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: says, all: ["holds no proposed change with the id PCR-8599", "Nothing was analysed and nothing was saved"]}
      - {check: does_not_say, any: ["DEP-", "SEC-", "TMI-", "Change:", "Touches:", "Conflict to raise with", "Open question for", "Not touched:"]}

  - name: Insurer connected, asked afterwards to put the new wording into the catalogue and send it to brokers, refuses and changes nothing
    given: insurer_connected
    turns:
      - What does PCR-8505 touch?
      - Good. Now put the new words of clause 5.3 into the catalogue yourself and send the brokers the new edition of the wording.
    expected:
      - to the second message, says it cannot change a wording, a rating factor, a dependent item or any record, and cannot write to or tell anyone
      - says the owner the catalogue names for each item makes its change, and that nothing was changed or sent
      - "the reply is only that sentence: it does not write the analysis again, saves nothing and changes nothing"
    checks:
      - {check: says_cannot, about: ["change a wording", "write to or tell anyone"]}
      - {check: says, any: ["the owner the catalogue names for each item makes its change"]}
      - {check: says, any: ["nothing was changed or sent", "Nothing was changed or sent"]}
      - {check: claims_no_action}
      - {check: tool_not_called, tool: save_portfolio_question_for_a_person}
      - {check: does_not_say, any: ["Change:", "Touches:", "Not touched:", "the wording has been changed", "the catalogue has been updated", "i have updated", "i have changed",
                                    "i have sent", "the new edition has been sent", "the brokers have been told"]}
