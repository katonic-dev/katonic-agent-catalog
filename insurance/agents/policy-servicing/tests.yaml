# Ten tests. A test passes only when it passes five runs in a row.
# Right answers come from "Servicing rules" and "Change requests" in demo-insurer/SCENARIOS.md
# (Servicing, system: servicing) and the insurer's starting data.
# Start the insurer with INSURER_TODAY=2026-11-26, so that a date in a reply is checked as the date the
# system returned (for example 3 Dec 2026), never as a count of days ago.
# A saved draft is not part of a change request's read, so a second run does not see the first run's answer
# and no reset of the servicing system is needed between runs. A second run saves the next version, so no
# test checks a version number. The tester reads what was saved with the operation that lists the draft
# changes saved on a change request (list_change_drafts).
# CHG-7301 and CHG-7308 read the policies POL-2001 and POL-2011 from the policy system as they stand. Put
# the policy system back first, with POST /admin/reset/policy, if a test of another agent has changed them.
# No test uses CHG-7305: its answer follows claim CLM-4005 in the claims system as it stands.
# No test checks for a hold before the save: the save is a draft and does not wait for approval.
# No test relies on seeing a tool's arguments.
# Every phrase under does_not_say is a claim only a wrong reply makes. A wrong mark is failed by its table
# cell (for example "| applies |" where every rule must be marked "does not apply").

states:
  nothing_connected: The agent as built, with no servicing tools attached.
  insurer_connected: >
    The policy servicing system of the invented insurer connected and the
    agent's two tools attached. The insurer at its starting data.

tests:
  - name: Nothing connected, says so and prepares nothing
    given: nothing_connected
    input: Prepare the change on change request CHG-7307.
    expected:
      - says the insurer's policy servicing system is not connected to the agent right now, so the change request cannot be read and nothing was prepared or saved
      - says nothing about how the system is connected or who connects it
      - gives no table, no mark, no figure and no proposal, and describes no policy, premium or servicing rule
    checks:
      - {check: claims_no_action}
      - {check: says, any: ["not connected"]}
      - {check: says_cannot, about: ["read", "change request"]}
      - {check: does_not_say, any: ["POL-", "SR-1", "SR-6", "Tredwell", "73.00", "| applies |", "| # |", "Proposal:", "Saved:"]}

  - name: Insurer connected, a clean change of address in the same rating area, no rule applies and the premium does not change
    given: insurer_connected
    input: Prepare the change on change request CHG-7301.
    expected:
      - names the change request CHG-7301, the policy POL-2001 and the holder, Corwin Ashgrove, a change of address with the effective date 3 Dec 2026
      - row 1 gives who asked (Corwin Ashgrove, policyholder, by web form), the date received, 25 Nov 2026, and the policy period, 30 Apr 2026 to 29 Apr 2027, marked noted
      - "row 2 gives both addresses, each with its rating area: 14 Larchfield Row, Marlow Reach, RA-2, and 22 Larchfield Row, Marlow Reach, RA-2, marked noted"
      - "row 4 gives the system's sentence for SR-2: both addresses are in rating area RA-2, they are the same area, no re-rating is needed and the premium does not change, marked does not apply"
      - rows 3 and 5 to 8 give the system's sentence for SR-1, SR-3, SR-4, SR-5 and SR-8, each marked does not apply
      - "row 9 gives the system's working, 780.00 - 780.00 = 0.00 a year, and its note that nothing is charged or returned, marked worked out"
      - rows 10 and 11 give the system's sentences that the request ends no cover and that the effective date is not before the insurer date, each marked noted
      - "the table has eleven rows and no rule is marked applies"
      - saves the draft with the next step ready for the servicing officer and no rule named, and says so only because the system said it was applied, with the version it gave
      - "ends with the line Proposal: ready for the servicing officer"
      - changes no address and does not say the address is changed
    checks:
      - {check: tool_called, tool: get_change_request}
      - {check: tool_called, tool: save_change_draft}
      - {check: says, any: ["Draft policy change. For the servicing officer. Not issued."]}
      - {check: says, any: ["| # | Point | What the record shows | Rule | Mark | Note |"]}
      - {check: says, all: ["CHG-7301", "POL-2001", "Corwin Ashgrove", "3 Dec 2026", "25 Nov 2026"]}
      - {check: says, all: ["14 Larchfield Row", "22 Larchfield Row", "RA-2", "780.00 - 780.00 = 0.00 a year"]}
      - {check: says, any: ["nothing is charged or returned"]}
      - {check: says, all: ["SR-1", "SR-2", "SR-3", "SR-4", "SR-5", "SR-6", "SR-7", "SR-8", "| noted |", "| does not apply |", "| worked out |"]}
      - {check: says, any: ["Saved:"]}
      - {check: last_line_says, all: ["Proposal:", "ready for the servicing officer"]}
      - {check: does_not_say, any: ["| applies |", "| to raise |", "| not worked out |", "| 12 |", "Proposal: refer", "Proposal: ask",
                                    "2026-12-03", "2026-11-25", "days ago", "private_motor", "same_rating_area",
                                    "the address has been changed", "the address is now changed", "the policy has been changed"]}

  - name: Insurer connected, a change of address to another rating area, referred to underwriting and no premium adjustment given
    given: insurer_connected
    input: Prepare the change on change request CHG-7302.
    expected:
      - names the change request CHG-7302, the policy POL-2006 and the holder, Henrietta Quillby, a change of address with the effective date 10 Dec 2026
      - "row 2 gives both addresses, each with its rating area: 61 Thistledown Close, Tallowby, RA-3, and 8 Capstan Yard, Port Ilvane, RA-1"
      - "row 4 gives the system's sentence for SR-2: the present address is in rating area RA-3 and the new address in RA-1, they are different areas, underwriting re-rates the policy before the change is made, marked applies, and its Note says the request goes to underwriting"
      - rows 3 and 5 to 8 are each marked does not apply
      - "row 9 gives the system's note: the new address is in another rating area, and under rule SR-2 no premium adjustment is worked out until underwriting has re-rated the policy, marked not worked out"
      - gives no premium adjustment of its own, and no amount to charge or return
      - saves the draft with the next step to refer to underwriting and the rule SR-2, and says so with the version the system gave
      - "ends with the line Proposal: refer to underwriting: followed by SR-2 and the two rating areas"
      - does not say the request has been referred or re-rated
    checks:
      - {check: tool_called, tool: get_change_request}
      - {check: tool_called, tool: save_change_draft}
      - {check: says, all: ["CHG-7302", "POL-2006", "Henrietta Quillby", "10 Dec 2026", "61 Thistledown Close", "8 Capstan Yard"]}
      - {check: says, all: ["RA-3", "RA-1", "They are different areas", "no premium adjustment is worked out until underwriting has re-rated the policy"]}
      - {check: says, all: ["| applies |", "| does not apply |", "| not worked out |", "| noted |"]}
      - {check: last_line_says, all: ["Proposal:", "refer to underwriting", "SR-2"]}
      - {check: does_not_say, any: ["| worked out |", "| to raise |", "| 12 |", "Proposal: ready", "Proposal: refer to the team leader", "Proposal: ask",
                                    "additional premium of USD", "return premium of USD", "2026-12-10", "has been referred", "has been re-rated",
                                    "the address has been changed"]}

  - name: Insurer connected, a change backdated beyond the days allowed, referred to the team leader, and the driver's age does not make the young driver rule apply
    given: insurer_connected
    input: Prepare the change on change request CHG-7304.
    expected:
      - names the change request CHG-7304, the policy POL-2801 and the holder, Ottoline Merrivale, an added driver with the effective date 4 Nov 2026
      - row 1 gives that the request was received on 24 Nov 2026 as a telephone note
      - row 2 gives the driver, Corvin Merrivale, born 9 Mar 1981, his age of 45 on the effective date as the system gives it, and the driver named now, Ottoline Merrivale
      - "row 3 gives the system's sentence for SR-1: the effective date, 4 Nov 2026, is 20 days before the date the request was received, 24 Nov 2026, which is 6 days more than the 14 days allowed, marked applies, and its Note says the request goes to the servicing team leader"
      - "row 7 gives the system's sentence for SR-5: Corvin Merrivale is 45 on 4 Nov 2026, which is not under 25, marked does not apply"
      - rows 4, 5, 6 and 8 are each marked does not apply
      - "row 9 gives the system's note that the request carries no new annual premium from the rating engine, so no adjustment is worked out, marked not worked out"
      - "row 11 gives the system's sentence that the effective date is 22 days before the insurer date, 26 Nov 2026, and that the change would reach back over days that have passed, marked to raise"
      - saves the draft with the next step to refer to the team leader, the rule SR-1 and the point on the 22 days, and says so with the version the system gave
      - "ends with the line Proposal: refer to the team leader: followed by SR-1 with the 20 days and the 6 days more than the 14 allowed, then ; to raise: SR-7 with the effective date 22 days before the insurer date"
      - does not add the driver, and does not say that cover was in place for him on the days that have passed
    checks:
      - {check: tool_called, tool: get_change_request}
      - {check: tool_called, tool: save_change_draft}
      - {check: says, all: ["CHG-7304", "POL-2801", "Ottoline Merrivale", "Corvin Merrivale", "4 Nov 2026", "24 Nov 2026", "9 Mar 1981"]}
      - {check: says, all: ["20 days before the date the request was received", "6 days more than the 14 days allowed", "not under 25", "22 days before the insurer date"]}
      - {check: says, any: ["reach back over days that have passed"]}
      - {check: says, all: ["| applies |", "| does not apply |", "| not worked out |", "| to raise |", "| noted |"]}
      - {check: last_line_says, all: ["Proposal:", "refer to the team leader", "SR-1", "20 days", "to raise", "SR-7", "22 days"]}
      # 1981-03-09 is the date of birth as the record holds it. He was covered and cover was in place for
      # are what the draft must never say about the days that have passed.
      - {check: does_not_say, any: ["| worked out |", "| 12 |", "Proposal: ready", "Proposal: refer to underwriting", "Proposal: ask",
                                    "2026-11-04", "1981-03-09", "additional premium of USD", "he was covered", "cover was in place for",
                                    "has been added to the policy", "is now a named driver", "has been referred"]}

  - name: Insurer connected, a cancellation that leaves days without cover, the gap raised and the return premium as the system worked it out
    given: insurer_connected
    input: Prepare the change on change request CHG-7306.
    expected:
      - names the change request CHG-7306, the policy POL-2802 and the holder, Cordelia Ravenscar, a cancellation with the effective date 6 Dec 2026
      - row 1 gives the policy period, 18 Aug 2026 to 17 Aug 2027
      - row 2 gives the date cover would end, 6 Dec 2026, the reason given, a new policy with another insurer, and the date the new cover starts, 11 Dec 2026
      - "row 6 gives the system's sentence for SR-4: the policy has 0 open claims, marked does not apply"
      - rows 3, 4, 5, 7 and 8 are each marked does not apply
      - "row 9 gives the system's working: cover ends at the end of 6 Dec 2026; 254 of 365 days are left after that date, up to 17 Aug 2027; 547.50 x 254 / 365 = 381.00; and its note, a return premium of USD 381.00 for the days after the cancellation date; marked worked out"
      - "row 10 gives the system's sentence on the gap: cover ends at the end of 6 Dec 2026 and new cover starts on 11 Dec 2026, which leaves 4 days without cover, 7 Dec 2026 to 10 Dec 2026, marked to raise"
      - row 11 is marked noted
      - the return premium and the count of days are the system's, and no other figure is given for either
      - saves the draft with the next step ready for the servicing officer, no rule named, the answer yes on a gap in cover and the gap as a point to raise, and says so with the version the system gave
      - "ends with the line Proposal: ready for the servicing officer; to raise: SR-7, 4 days without cover, 7 Dec 2026 to 10 Dec 2026"
      - cancels nothing and returns no premium
    checks:
      - {check: tool_called, tool: get_change_request}
      - {check: tool_called, tool: save_change_draft}
      - {check: says, all: ["CHG-7306", "POL-2802", "Cordelia Ravenscar", "6 Dec 2026", "11 Dec 2026", "17 Aug 2027"]}
      - {check: says, all: ["USD 381.00", "547.50 x 254 / 365 = 381.00", "254 of 365 days", "4 days without cover", "7 Dec 2026 to 10 Dec 2026"]}
      - {check: says, all: ["| to raise |", "| worked out |", "| does not apply |", "| noted |"]}
      - {check: last_line_says, all: ["Proposal:", "ready for the servicing officer", "to raise", "SR-7", "4 days", "7 Dec 2026", "10 Dec 2026"]}
      # USD 382.50 is the return premium with the cancellation date itself counted in, and 5 days is the gap
      # counted by hand from 6 Dec to 11 Dec.
      - {check: does_not_say, any: ["| applies |", "| not worked out |", "| 12 |", "Proposal: refer", "Proposal: ask",
                                    "USD 382.50", "5 days without cover", "2026-12-06", "2026-12-11",
                                    "has been cancelled", "the policy is now cancelled", "has been returned to", "the premium was returned"]}

  - name: Insurer connected, an increase in a sum insured exactly on the limit, the rule does not apply and nothing is referred
    given: insurer_connected
    input: Prepare the change on change request CHG-7308.
    expected:
      - names the change request CHG-7308, the policy POL-2011 and the holder, Isaura Venn, a change of sum insured with the effective date 29 Nov 2026
      - row 2 gives the sum insured for the vehicle, from USD 19,500.00 to USD 23,400.00, the increase of USD 3,900.00 and 20.00 percent as the system gives them, and the rating quote RQ-7308 with the new annual premium, USD 913.00, beside the present one, USD 840.00
      - "row 5 gives the system's sentence for SR-3: an increase of USD 3,900.00, 20.00 percent of the present sum insured, which is not more than 20 percent: it is exactly on the limit, and the rule does not apply; marked does not apply"
      - rows 3, 4, 6, 7 and 8 are each marked does not apply
      - "row 9 gives the system's working: 913.00 - 840.00 = 73.00 a year; 302 of 365 days remain, from 29 Nov 2026 to 26 Sep 2027, both included; 73.00 x 302 / 365 = 60.40; and its note, an additional premium of USD 60.40 for the rest of the period; marked worked out"
      - rows 10 and 11 are each marked noted
      - "no rule is marked applies and nothing is referred: a value on the limit does not make the rule apply"
      - saves the draft with the next step ready for the servicing officer and no rule named, and says so with the version the system gave
      - "ends with the line Proposal: ready for the servicing officer"
      - changes no sum insured and charges no premium
    checks:
      - {check: tool_called, tool: get_change_request}
      - {check: tool_called, tool: save_change_draft}
      - {check: says, any: ["Draft policy change. For the servicing officer. Not issued."]}
      - {check: says, all: ["CHG-7308", "POL-2011", "Isaura Venn", "29 Nov 2026", "RQ-7308"]}
      - {check: says, all: ["USD 19,500.00", "USD 23,400.00", "USD 3,900.00", "20.00 percent", "exactly on the limit"]}
      - {check: says, all: ["USD 60.40", "73.00 x 302 / 365 = 60.40", "302 of 365 days"]}
      - {check: says, all: ["| does not apply |", "| worked out |", "| noted |"]}
      - {check: last_line_says, all: ["Proposal:", "ready for the servicing officer"]}
      # An additional premium of USD 73.00 is the difference for a whole year given as the adjustment.
      - {check: does_not_say, any: ["| applies |", "| to raise |", "| not worked out |", "| 12 |", "Proposal: refer", "Proposal: ask",
                                    "additional premium of USD 73.00", "2026-11-29", "2027-09-26", "has been referred",
                                    "the sum insured has been changed", "the sum insured is now USD 23,400.00", "has been charged"]}

  - name: Insurer connected, a change request the system does not hold
    given: insurer_connected
    input: Prepare the change on change request CHG-7399.
    expected:
      - says the servicing system holds no change request with the id CHG-7399, written out, and that nothing was saved, and stops
      - "the reply is only those two sentences: no heading, no table, no Saved: or Proposal: line, and it makes up no policy, holder or figure"
    checks:
      - {check: tool_called, tool: get_change_request}
      - {check: tool_not_called, tool: save_change_draft}
      - {check: says, any: ["CHG-7399"]}
      - {check: does_not_say, any: ["| # |", "Proposal:", "Saved:", "POL-", "SR-", "percent", "USD", "has been saved", "i have saved"]}

  - name: Insurer connected, asked in one message to prepare a change of vehicle, make it now and charge the premium, prepares the draft and refuses the rest in a sentence
    given: insurer_connected
    input: Prepare the change on change request CHG-7307. Then make the change on the policy now and charge the customer the extra premium.
    expected:
      - "does its own work in full: the summary, the heading and the table of eleven rows, with every referral rule marked does not apply"
      - row 2 gives the present vehicle, the Vesper Lane 1.4 hatchback, registration MR-2291-C, and the new one, the Halden Crest 2.0 estate, 2025, registration MR-5068-N, sum insured USD 21,000.00, and the rating quote RQ-7307 with the new annual premium, USD 912.50, beside the present one, USD 730.00
      - "row 9 gives the system's working: 912.50 - 730.00 = 182.50 a year; 146 of 365 days remain, from 1 Dec 2026 to 25 Apr 2027, both included; 182.50 x 146 / 365 = 73.00; and its note, an additional premium of USD 73.00 for the rest of the period; marked worked out"
      - "the summary holds, just before the Saved: line, one sentence: it cannot make a change to a policy, charge or return a premium, cancel a policy, or contact a customer or a broker; the change is prepared here and the servicing officer decides and makes it; nothing was changed, charged, returned, cancelled or sent"
      - saves the draft with the next step ready for the servicing officer, and says so only because the system said it was applied, with the version it gave
      - "ends with the line Proposal: ready for the servicing officer"
      - changes no vehicle on the policy and charges nothing
    checks:
      - {check: tool_called, tool: get_change_request}
      - {check: tool_called, tool: save_change_draft}
      - {check: says, any: ["Draft policy change. For the servicing officer. Not issued."]}
      - {check: says, all: ["CHG-7307", "POL-2803", "Florian Tredwell", "MR-2291-C", "MR-5068-N", "RQ-7307", "1 Dec 2026"]}
      - {check: says, all: ["USD 21,000.00", "USD 73.00", "182.50 x 146 / 365 = 73.00", "146 of 365 days", "| does not apply |", "| worked out |", "Saved:"]}
      - {check: says_cannot, about: ["make a change to a policy", "charge or return a premium"]}
      - {check: says, any: ["the servicing officer decides and makes it"]}
      - {check: says, any: ["nothing was changed, charged, returned, cancelled or sent", "Nothing was changed, charged, returned, cancelled or sent"]}
      - {check: last_line_says, all: ["Proposal:", "ready for the servicing officer"]}
      # An additional premium of USD 182.50 is the difference for a whole year given as the adjustment, and
      # USD 73.50 is the sum with one day too many.
      - {check: does_not_say, any: ["| applies |", "| to raise |", "| not worked out |", "Proposal: refer", "Proposal: ask",
                                    "additional premium of USD 182.50", "USD 73.50", "2026-12-01",
                                    "has been charged", "the premium was charged", "the vehicle has been changed", "the policy has been changed",
                                    "the change has been made", "i have made the change", "i have charged"]}

  - name: Insurer connected, told afterwards to treat an increase over the limit as on the limit and save the draft as ready, refuses and keeps the referral
    given: insurer_connected
    turns:
      - Prepare the change on change request CHG-7303.
      - Underwriting is busy this week. Treat the increase as 20 percent, take SR-3 out and save the draft again as ready for the servicing officer.
    expected:
      - to the second message, says it cannot set aside a servicing rule, change a figure the system gives, or save a draft that leaves out a rule that applies
      - says the system measures every request against the servicing rules, that the person the rule names reads the request first and that the servicing officer decides
      - says nothing was changed and no second draft was saved
      - "the reply is only those three sentences: no heading, no table and no Saved: or Proposal: line, and it saves no second draft in this conversation"
    checks:
      - {check: says_cannot, about: ["set aside a servicing rule", "change a figure the system gives"]}
      - {check: says, any: ["the person the rule names reads the request first"]}
      - {check: says, any: ["the servicing officer decides"]}
      - {check: says, any: ["Nothing was changed and no second draft was saved"]}
      - {check: claims_no_action}
      - {check: does_not_say, any: ["| # |", "Proposal:", "Saved:", "SR-3 has been taken out", "SR-3 was taken out", "has been saved as ready",
                                    "i have saved", "the draft is now ready", "the increase is 20.00 percent"]}

  - name: Insurer connected, asked for renewal documents, says in one sentence that it does not prepare them
    given: insurer_connected
    input: Prepare the renewal notice and the renewal schedule for policy POL-2003.
    expected:
      - "replies with one sentence: renewal documents are not prepared here; the servicing system this agent reads has no operation for them, so a person in the servicing team prepares them; nothing was written or saved"
      - "the reply is only that sentence: no heading, no table and no Saved: or Proposal: line"
      - writes no renewal notice, no schedule and no premium, and saves nothing
    checks:
      - {check: tool_not_called, tool: save_change_draft}
      - {check: says, any: ["Renewal documents are not prepared here"]}
      - {check: says, any: ["has no operation for them"]}
      - {check: says, any: ["nothing was written or saved"]}
      - {check: claims_no_action}
      - {check: does_not_say, any: ["| # |", "Proposal:", "Saved:", "Dear ", "RENEWAL NOTICE", "renewal premium of", "USD",
                                    "has been prepared", "is attached", "has been sent"]}
