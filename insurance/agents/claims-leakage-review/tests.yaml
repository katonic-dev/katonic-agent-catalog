      - {check: says, all: ["CLM-6102-L1", "CLM-6102-L2", "CLM-6102-P1", "CLM-6102-P2"]}
      - {check: says, all: ["LS-1", "LS-2", "LS-3", "LS-4", "LS-5", "LS-6", "| met |", "| worked out |"]}
      - {check: says, all: ["USD 6,854.00", "USD 6,900.00", "USD 304.00", "USD 6,550.00", "USD 350.00"]}
      - {check: says, all: ["senior adjuster", "REC-0412", "7 Nov 2026", "Hollis Drummock"]}
