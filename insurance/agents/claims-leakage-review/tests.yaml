# Ten tests. A test passes only when it passes five runs in a row.
# Right answers come from "Handling standards (leakage review)" and "Closed claims" in demo-insurer/SCENARIOS.md
# (section "Investigations (system: investigations)"), at the insurer's starting data.
# Start the insurer with INSURER_TODAY=2026-11-26, so that the review period with no dates is 27 Oct 2026 to
# 26 Nov 2026 and every date in a reply is the date the system returned, never a count of days ago.
# A saved finding is not part of a closed claim's read, so a second run does not see the first run's answer and
# no reset is needed between runs. A second run saves the next version, so no test expects a version number by
# its figure: the reply gives the version the system gave. The tester reads what was saved with the operation
# that lists the findings on a closed claim (list_leakage_finding_drafts), which the agent does not hold.
# No test checks for a hold before the save: the save is a draft and does not wait for approval.
# The agent is meant to run on a schedule. In every test a person sends the message.
# Every phrase under does_not_say is a claim only a wrong reply makes. The names of the insurer's staff are among
# them: a finding names the standard and the payment, and gives a role where the system's sentence gives a name.

states:
  nothing_connected: The agent as built, with no investigations tools attached.
  insurer_connected: >
    The investigations system of the invented insurer connected and the agent's
    five tools attached. The insurer at its starting data.

tests:
  - name: Nothing connected, says so and reviews nothing
    given: nothing_connected
    input: Review closed claim CLM-6103.
    expected:
      - says the insurer's investigations system is not connected to the agent right now, so no closed claim can be read and nothing was reviewed or saved
      - says nothing about how the system is connected or who connects it
      - gives no figure, no table, no finding and no proposal, and names no claimant, standard or payment
    checks:
      - {check: claims_no_action}
      - {check: says, any: ["not connected"]}
      - {check: says_cannot, about: ["read", "review"]}
      - {check: does_not_say, any: ["USD", "LS-1", "CLM-6103-", "Corwin", "GBR-2240", "| # |", "Proposal:", "Saved:"]}

  - name: Insurer connected, a claim paid correctly, a line over its limit was paid at the limit and no standard fires
    given: insurer_connected
    input: Review closed claim CLM-6101.
    expected:
      - the summary names the claim CLM-6101, Isaura Venn, the claim type in words, the date of the loss, 17 Oct 2026, and the date of closing, 5 Nov 2026
      - gives the system's sentence on the outcome, that CLM-6101 was paid within the handling standards, USD 1,680.00 should have been paid and USD 1,680.00 was paid
      - says every standard is met, and names the line CLM-6101-L2, the rear windscreen, as invoiced over its limit and paid at the limit
      - "the row of CLM-6101-L1: USD 1,480.00 on the file, USD 1,480.00 under the standards, difference USD 0.00, the mark met"
      - "the row of CLM-6101-L2: USD 500.00 on the file, USD 500.00 under the standards, difference USD 0.00, the mark met, and a Note with the amount invoiced, USD 610.00, and the system's sentence on the windscreen limit of clause 3.2"
      - the row of the payment CLM-6101-P1 to Candlewick Coachworks against invoice CC-3117, USD 1,680.00, is marked met
      - gives one row for each of LS-1 to LS-6, each marked met, each with the system's sentence, and the row of the standard on the deductible shows USD 300.00 taken and USD 300.00 due
      - "the last row: USD 1,680.00 paid, USD 1,680.00 should have been paid, difference USD 0.00, the mark worked out"
      - marks nothing as not met and nothing as cannot tell
      - names no member of the insurer's staff, and gives the approval on the file as that of a handler
      - saves the finding with the outcome that the claim was paid within the standards and with no rows, and says it was saved, with the version the system gave, only because the system said it was applied
      - "ends with the line Proposal: no action: CLM-6101 was paid within the handling standards"
    checks:
      - {check: tool_called, tool: get_closed_claim_payment_file}
      - {check: tool_called, tool: calculate_what_should_have_been_paid}
      - {check: tool_called, tool: save_leakage_finding}
      - {check: says, all: ["Draft leakage finding. For the claims quality team. Not issued.", "Saved:"]}
      - {check: says, any: ["| # | Item | On the file | Under the standards | Difference | Standard | Mark | Note |"]}
      - {check: says, all: ["CLM-6101-L1", "CLM-6101-L2", "CLM-6101-P1", "CC-3117"]}
      - {check: says, all: ["LS-1", "LS-2", "LS-3", "LS-4", "LS-5", "LS-6"]}
      - {check: says, all: ["| met |", "| worked out |"]}
      - {check: says, all: ["USD 1,680.00", "USD 1,480.00", "USD 500.00", "USD 610.00", "USD 300.00", "USD 0.00"]}
      - {check: says, all: ["Isaura Venn", "17 Oct 2026", "5 Nov 2026"]}
      - {check: says, any: ["3.2"]}
      - {check: last_line_says, all: ["Proposal: no action:", "CLM-6101", "was paid within the handling standards"]}
      # USD 1,790.00 is what a reply would give if it took the windscreen at the invoiced amount. USD 110.00 is the windscreen's amount over its limit, which was never paid.
      - {check: does_not_say, any: ["| not met |", "| cannot tell |", "Proposal: for the claims quality team", "Proposal: cannot tell", "USD 1,790.00", "difference USD 110.00", "Ottilie Marsh", "paid_within", "2026-10-17", "2026-11-05", "days ago"]}

