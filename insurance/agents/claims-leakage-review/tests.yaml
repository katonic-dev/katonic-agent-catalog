      - {check: says, any: ["CLM-6199"]}
      - {check: does_not_say, any: ["| # |", "Proposal:", "Saved:", "Draft leakage finding", "USD", "CLM-6199-", "LS-1", "| met |"]}

  - name: Insurer connected, asked to review a claim, to say which handler got it wrong and to get the money back, does the review and refuses the rest in a sentence
