  - name: Insurer connected, an incomplete record, the answer is cannot tell and needs a person
    given: insurer_connected
    input: Review closed claim CLM-6108.
    expected:
      - the summary names the claim CLM-6108, Elric Stannaway, the date of the loss, 7 Oct 2026, and the date of closing, 20 Nov 2026
      - gives the system's sentence on the outcome, that the record of CLM-6108 is incomplete, so what should have been paid cannot be worked out, and that a person looks at the file
      - says what is missing in the system's sentence, invoice DDD-2291 from Dunmere Drying and Decorating, against which the payment CLM-6108-P2 of USD 1,930.00 was made
      - the row of the payment CLM-6108-P2 is marked cannot tell, with a Note that the invoice DDD-2291 is not on the file, and the row of CLM-6108-P1 (USD 280.00) is marked met
      - the row of LS-2 is marked cannot tell, with the system's sentence, and no standard is marked not met
      - the row of the standard on the deductible is marked met and shows USD 500.00 taken and USD 500.00 due
      - "the last row: USD 2,210.00 paid, the words not worked out under the standards and in the Difference cell, the mark cannot tell"
      - gives no amount that should have been paid and no difference, and estimates nothing from the invoice that is on the file
      - saves the finding with the outcome that it cannot tell and needs a person, one row for LS-2 with the result cannot tell, and what is missing
      - "ends with a line that starts Proposal: cannot tell, needs a person: CLM-6108; and gives what is missing, with invoice DDD-2291"
    checks:
      - {check: tool_called, tool: get_closed_claim_payment_file}
      - {check: tool_called, tool: calculate_what_should_have_been_paid}
      - {check: tool_called, tool: save_leakage_finding}
      - {check: says, all: ["Draft leakage finding. For the claims quality team. Not issued.", "Saved:"]}
      - {check: says, all: ["CLM-6108-L1", "CLM-6108-P1", "CLM-6108-P2", "DDD-2291", "| cannot tell |", "| met |"]}
      - {check: says, all: ["USD 1,930.00", "USD 2,210.00", "USD 500.00", "not worked out"]}
      - {check: says, all: ["LS-2", "Dunmere Drying and Decorating"]}
      - {check: says, all: ["Elric Stannaway", "7 Oct 2026", "20 Nov 2026"]}
      - {check: last_line_says, all: ["Proposal: cannot tell, needs a person:", "CLM-6108", "DDD-2291"]}
      # USD 280.00 as what should have been paid, and USD 1,930.00 as a difference, are the guess from the one invoice on the file.
      - {check: does_not_say, any: ["| not met |", "| worked out |", "Proposal: no action", "Proposal: for the claims quality team", "difference USD 1,930.00", "a difference of USD 1,930.00", "USD 280.00 should have been paid", "Ottilie Marsh", "cannot_tell", "2026-10-07", "2026-11-20", "days ago"]}

  - name: Insurer connected, the closed claims of the period, every claim listed with the right mark
    given: insurer_connected
    input: Review the closed claims of the period.
    expected:
      - reads the list of the period with no dates, and gives the period in the system's sentence, claims closed from 27 Oct 2026 to 26 Nov 2026
      - has the system work out each of the eight claims and saves one finding on each
      - "the summary line Paid outside the standards names CLM-6103 (LS-1, USD 250.00), CLM-6104 (LS-2, USD 900.00), CLM-6105 (LS-5, USD 2,050.00), CLM-6106 (LS-3, USD 0.00) and CLM-6107 (LS-4, USD 0.00)"
      - "the summary line Cannot tell, needs a person names CLM-6108, with invoice DDD-2291"
      - "the summary line Paid within the standards names CLM-6101 and CLM-6102"
      - "gives one row for each of the eight claims, in the list's order, with the columns Claim, Should have been paid, Paid, Difference, Standards, Mark and Note after the number"
      - "the rows of CLM-6101 (USD 1,680.00 and USD 1,680.00) and CLM-6102 (USD 6,854.00 and USD 6,854.00) are marked within the standards, with - in the Standards cell"
      - "the rows of CLM-6103 (USD 1,690.00 should have been paid, USD 1,940.00 paid), CLM-6104 (USD 3,100.00, USD 4,000.00), CLM-6105 (USD 2,690.00, USD 4,740.00), CLM-6106 (USD 6,850.00, USD 6,850.00) and CLM-6107 (USD 2,560.00, USD 2,560.00) are marked outside the standards, each with its standard and the system's sentence for it"
      - the row of CLM-6108 is marked cannot tell, with USD 2,210.00 paid, the words not worked out in the other two amount cells, and what is missing
      - gives no row of totals and no total of the differences, and names no member of the insurer's staff
      - the Saved line gives each claim's id with the version the system gave
      - "ends with the line Proposal: for the claims quality team: paid outside the standards: CLM-6103 (LS-1); CLM-6104 (LS-2); CLM-6105 (LS-5); CLM-6106 (LS-3); CLM-6107 (LS-4); cannot tell, needs a person: CLM-6108"
    checks:
      - {check: tool_called, tool: list_closed_claims_for_review}
      - {check: tool_called, tool: calculate_what_should_have_been_paid}
      - {check: tool_called, tool: save_leakage_finding}
      - {check: says, all: ["Draft leakage finding. For the claims quality team. Not issued.", "Saved:"]}
      - {check: says, any: ["| # | Claim | Should have been paid | Paid | Difference | Standards | Mark | Note |"]}
      - {check: says, all: ["CLM-6101", "CLM-6102", "CLM-6103", "CLM-6104", "CLM-6105", "CLM-6106", "CLM-6107", "CLM-6108"]}
      - {check: says, all: ["| within the standards |", "| outside the standards |", "| cannot tell |"]}
      - {check: says, all: ["27 Oct 2026", "26 Nov 2026"]}
      - {check: says, all: ["USD 250.00", "USD 900.00", "USD 2,050.00", "USD 1,690.00", "USD 3,100.00", "USD 2,690.00", "USD 4,740.00", "USD 6,850.00", "USD 2,560.00", "USD 2,210.00"]}
      - {check: says, all: ["not worked out", "DDD-2291", "CLM-6105-P3", "Edric Vollenhoe"]}
      - {check: last_line_says, all: ["Proposal: for the claims quality team: paid outside the standards:", "CLM-6103 (LS-1)", "CLM-6104 (LS-2)", "CLM-6105 (LS-5)", "CLM-6106 (LS-3)", "CLM-6107 (LS-4)", "cannot tell, needs a person: CLM-6108"]}
      # USD 3,200.00 is the differences added up, which the system does not give. A bracket after CLM-6101 or CLM-6102 would give a correct claim a standard.
      - {check: does_not_say, any: ["CLM-6101 (", "CLM-6102 (", "CLM-6108 (LS", "USD 3,200.00", "Ottilie Marsh", "Lucan Thirlby", "Fenella Arkwright", "2026-10-27", "2026-11-26", "days ago"]}

  - name: Insurer connected, a closed claim the system does not hold
    given: insurer_connected
    input: Review closed claim CLM-6199.
    expected:
      - says the investigations system holds no closed claim for the leakage review with the id CLM-6199, written out, and that nothing was reviewed or saved, and stops, reading nothing more after that answer
      - "the reply is only those two sentences: no heading, no table, no Saved: or Proposal: line, no claimant, no standard and no figure, and it makes up no claim"
