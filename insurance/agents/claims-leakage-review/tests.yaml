  - name: Insurer connected, paid above authority with no second approval, the amount is right and no person is named
    given: insurer_connected
    input: Review closed claim CLM-6106.
    expected:
      - the summary names the claim CLM-6106, Ansel Whitlocke, the date of the loss, 20 Oct 2026, and the date of closing, 15 Nov 2026
      - gives the system's sentence on the outcome, that CLM-6106 was paid outside the handling standards, LS-3 not met, USD 6,850.00 should have been paid and USD 6,850.00 was paid, a difference of USD 0.00
      - the row of LS-3 is marked not met, and its Note gives the system's sentence, that USD 6,850.00 needs the approval of the senior adjuster, that the approval on the file is that of a handler, and that no approval by a senior adjuster is on the file
