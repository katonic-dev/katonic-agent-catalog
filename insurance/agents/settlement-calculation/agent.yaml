id: settlement-calculation
name: Settlement Calculation
pack: insurance
area: Claims assessment
summary: >
  Works out the amount payable on a claim from the invoice and estimate lines,
  the limits and the deductible, and shows the working line by line. It says
  which lines the policy wording does not cover; the claims system does the
  sums. It pays nothing and approves nothing.

type: workflow
form: api
started_by: A call from the insurer's claims system once the invoices are in

meets_people_through: application
application: Claims assessment desk

platform:
  kind: chat
  tier: reasoning

# The desk or the claims system sends one message with the claim's id and
# reads the reply. One read of the claim gives the whole file with every
# invoice and estimate line. The policy gives the id of its wording.
needs:
  - id: claims-system
    kind: api
    required: true
    label: The insurer's claims system, to read a claim with its whole file, to have a settlement worked out from the lines the wording does not cover, and to save the calculation as a draft
    operations:
      - get_claim
      - calculate_settlement
      - save_settlement_calculation
  - id: policy-system
    kind: api
    required: true
    label: The insurer's policy system, to read the policy a claim names and the policy wording with its numbered clauses
    operations:
      - get_policy
      - get_policy_wording

demo_insurer_systems: [claims, policy]

stops_for_a_person:
  - The adjuster decides whether the loss is covered. Where no decision on cover is recorded, the agent still works the figure out and refers the claim to the adjuster with it. Where a decision to decline is recorded, it works nothing out.
  - The person with the authority for the amount under rule HG-5 of the claims handling guide approves a settlement. The agent approves nothing and pays nothing.
  - Where the file does not settle whether the wording covers a line, the agent says so and refers the claim to the adjuster. It fills no gap.

# Saving a calculation is a draft kept with its author, a time and a version
# number. It approves nothing, pays nothing and changes no status. Working a
# settlement out is a search sent as a POST: it saves nothing, so it is not
# listed here.
changes:
  - {tool: save_settlement_calculation, waits_for_approval: false}

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 26 November 2026. Not promoted. All eight tests pass five runs in a row on the first version of the instructions. The second version added one sentence (every table row carries its number and all seven cells), after one run of one test left three rows unnumbered; tests 2, 3 and 4 were run five times again on it and the other five once. Test 1 with no tools, the others in the Work Room, a new conversation for each run. Every figure in every reply was the system's: USD 5,100.00, USD 1,900.00 and USD 14,200.00 on the three claims, with the approver the handling guide gives. Nothing was paid or approved and no claim changed status in any run: the agent saves a draft calculation and a person with the authority approves it. On this cluster the calculation and the draft save run without waiting for approval, by a setting made for the invented insurer.
