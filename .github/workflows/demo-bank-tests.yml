name: demo-bank tests

on:
  push:
    branches: [main]
    paths:
      - "demo-bank/**"
      - ".github/workflows/demo-bank-tests.yml"
  pull_request:
    paths:
      - "demo-bank/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: demo-bank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest -q
