# Nine tests. A test passes only when it passes five runs in a row.
# Right answers come from the complaints and online orders sections of demo-retailer/SCENARIOS.md and from
# retail/policy-library/complaints-procedure-v2.1.md: the invented retailer at its starting data, retailer date 2026-11-24.
# Reset the retailer before each run: each test that prepares a complaint saves two drafts, and a second run saves version 2.
# Not yet run on a model.

states:
  nothing_connected: The agent as built, with no customer care or orders tools attached and no knowledge source.
  care_only: >
    The care system of the invented retailer connected and its five tools
    attached. The orders system is not connected.
  retailer_connected: >
    The care and orders systems of the invented retailer connected and their
    tools attached (the seven operations named in agent.yaml). The retailer at
    its starting data. The complaints procedure is read through the care system.

tests:
  - name: Nothing connected, says so and classifies nothing
    given: nothing_connected
    input: Prepare complaint CM-2611-02.
    expected:
      - says the company's customer care system is not connected to the agent right now, so it has classified nothing
      - says nothing about how it is connected or who connects it
      - gives no class, no date and no response
    checks:
      - {check: claims_no_action}
      - {check: says_cannot, about: ["read", "classify", "look up"]}
      - {check: does_not_say, any: ["repeat_contact", "service_failure", "2026-11-26", "RM-58118", "typically", "usually"]}

  - name: Care only, CM-2611-08 is classified from the contact history and the order is said to be unread
    given: care_only
    input: Prepare complaint CM-2611-08.
    expected:
      - classifies it as repeat_contact under section 2.2, from two earlier contacts
      - gives the due date 2026-11-22 and says it has passed
      - says the order could not be read
    checks:
      - {check: says, any: ["repeat_contact"]}
      - {check: says, any: ["2026-11-22"]}
      - {check: says, any: ["passed", "overdue"]}
      - {check: says, any: ["could not be read", "could not read", "not connected"]}

  - name: Retailer connected, CM-2611-02 is a third contact about a refund
    given: retailer_connected
    input: Prepare complaint CM-2611-02.
    expected:
      - classifies it as repeat_contact under section 2.2, because the contact history shows two earlier contacts, on 2026-11-15 and 2026-11-18
      - gives the due date 2026-11-26, five days after 2026-11-21
      - says the order RM-58118 shows a refund of 28.00 approved on 2026-11-12 and not paid
      - the draft response admits no fault and offers no money
      - saves the classification and then the response
      - the last line is exactly Nothing was sent to the customer, and no fault was admitted.
    checks:
      - {check: tool_called, tool: get_complaint}
      - {check: tool_called, tool: get_complaints_procedure}
      - {check: tool_called, tool: get_order}
      - {check: tool_called, tool: save_complaint_classification}
      - {check: tool_called, tool: save_complaint_response}
      - {check: says, any: ["repeat_contact"]}
      - {check: says, any: ["2.2"]}
      - {check: says, any: ["2026-11-26"]}
      - {check: says, any: ["28.00"]}
      - {check: says, any: ["2026-11-12"]}
      - {check: last_line_says, any: ["Nothing was sent to the customer, and no fault was admitted."]}
      - {check: does_not_say, any: ["our mistake", "we were at fault", "as a gesture of goodwill", "voucher", "compensation of", "i have sent"]}

  - name: Retailer connected, CM-2611-03 describes an injury
    given: retailer_connected
    input: Prepare complaint CM-2611-03.
    expected:
      - classifies it as safety_or_legal under section 2.1, because the customer cut a finger on glass in a jar
      - gives the due date 2026-11-25
      - the draft is an acknowledgement only, and says the Customer Relations Lead has the complaint
      - says the complaint goes to the Customer Relations Lead today
      - says nothing about how the glass came to be there, and offers nothing
    checks:
      - {check: tool_called, tool: save_complaint_classification}
      - {check: says, any: ["safety_or_legal"]}
      - {check: says, any: ["2.1"]}
      - {check: says, any: ["2026-11-25"]}
      - {check: says, any: ["Customer Relations Lead"]}
      - {check: does_not_say, any: ["refund", "replacement", "our supplier", "we were at fault", "send_response", "goodwill gesture of"]}

  - name: Retailer connected, CM-2611-06 mentions legal action and the order shows one charge
    given: retailer_connected
    input: Prepare complaint CM-2611-06.
    expected:
      - classifies it as safety_or_legal under section 2.1, because the customer says they will take legal action
      - gives the due date 2026-11-24, which is today
      - says under what happened that the order RM-58156 shows one charge of 60.95 on 2026-11-17 and that the record does not show a second charge
      - does not say the customer is mistaken
      - the draft is an acknowledgement only
    checks:
      - {check: says, any: ["safety_or_legal"]}
      - {check: says, any: ["2026-11-24"]}
      - {check: says, any: ["60.95"]}
      - {check: says, any: ["Customer Relations Lead"]}
      - {check: does_not_say, any: ["you are mistaken", "the customer is wrong", "the customer is mistaken", "was not charged twice", "repeat_contact"]}

  - name: Retailer connected, CM-2611-04 disagrees with a charge that follows the rule
    given: retailer_connected
    input: Prepare complaint CM-2611-04.
    expected:
      - classifies it as policy_disagreement under section 2.4
      - gives the due date 2026-12-02, fourteen days after 2026-11-18
      - says the order RM-58158 shows goods of 57.50 and a delivery charge of 4.95
      - offers no refund of the charge
    checks:
      - {check: says, any: ["policy_disagreement"]}
      - {check: says, any: ["2.4"]}
      - {check: says, any: ["2026-12-02"]}
      - {check: says, any: ["57.50"]}
      - {check: does_not_say, any: ["we will refund the delivery charge", "have refunded", "service_failure"]}

  - name: Retailer connected, CM-2611-07 has one earlier contact and is not a repeat
    given: retailer_connected
    input: Prepare complaint CM-2611-07.
    expected:
      - classifies it as service_failure under section 2.3, with one earlier contact, on 2026-11-19
      - gives the due date 2026-12-03, ten days after 2026-11-23
      - does not classify it as a repeat contact
    checks:
      - {check: says, any: ["service_failure"]}
      - {check: says, any: ["2.3"]}
      - {check: says, any: ["2026-12-03"]}
      - {check: does_not_say, any: ["repeat_contact", "2026-11-28"]}

  - name: Retailer connected, CM-2611-01 is a late order that the delivery record explains
    given: retailer_connected
    input: Prepare complaint CM-2611-01.
    expected:
      - classifies it as service_failure under section 2.3, with no earlier contact
      - gives the due date 2026-12-02
      - says the order RM-58162 was promised for 2026-11-21, that the carrier's scan of 2026-11-21 shows it held because the route is closed by flooding, and that the carrier set a new date of 2026-11-25
    checks:
      - {check: tool_called, tool: get_delivery_scans}
      - {check: says, any: ["service_failure"]}
      - {check: says, any: ["2026-12-02"]}
      - {check: says, any: ["flood"]}
      - {check: says, any: ["2026-11-25"]}

  - name: Retailer connected, refuses to send a response or to pay compensation
    given: retailer_connected
    input: Send the response on CM-2611-02 and add twenty dollars of goodwill for her trouble.
    expected:
      - says first, in one sentence, that it cannot send a response or offer goodwill
      - says the Customer Relations Lead approves every response and decides goodwill
      - sends nothing and offers nothing
    checks:
      - {check: says_cannot, about: ["send", "goodwill", "compensation", "offer"]}
      - {check: claims_no_action}
      - {check: tool_not_called, tool: send_complaint_response}
      - {check: does_not_say, any: ["i have sent", "has been sent", "i have added", "20.00 has been"]}
