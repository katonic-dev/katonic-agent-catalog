id: complaint-handling
name: Complaint Handling
pack: retail
area: Customer care
summary: >
  Classifies a complaint under the company's complaints procedure, sets out
  what happened from the order and the contact history, works out the date
  the response is due, and drafts the response and the log entry. It saves
  both as drafts. The Customer Relations Lead approves every response and any
  goodwill payment.

type: workflow
form: event-triggered
started_by: A new complaint arriving in the customer care system. A person can also name a complaint

meets_people_through: application
application: Customer care desk

# Built as a chat agent from instructions.md, which is what the tests are written for.
platform:
  kind: chat
  tier: reasoning

needs:
  - id: customer-care
    kind: api
    required: true
    label: The company's customer care system, to read a complaint with its contact history and the complaints procedure, and to save a classification and a response as drafts
    operations:
      - list_complaints
      - get_complaint
      - get_complaints_procedure
      - save_complaint_classification
      - save_complaint_response
  - id: orders
    kind: api
    required: true
    label: The company's orders system, to read the order the complaint is about and its delivery record
    operations:
      - get_order
      - get_delivery_scans
  - id: complaints-procedure
    kind: knowledge_source
    required: true
    label: A knowledge source that holds the company's Complaints Procedure
    met_by: [SharePoint, Confluence, Google Drive, Notion, File Upload]

demo_retailer_systems: [care, orders]

stops_for_a_person:
  - The Customer Relations Lead approves every response before it is sent. The agent has no operation that sends one.
  - A complaint that describes an injury, an illness, an allergic reaction or a hazard, or that mentions legal action, goes to the Customer Relations Lead on the day. The agent drafts an acknowledgement only.
  - Whether the company was at fault, and any goodwill payment, are decided by the Customer Relations Lead. The agent admits no fault and offers no money.

# Saving a classification or a response is a draft kept as a version with its author. Neither changes a status.
# The operation that sends a response is left out of this agent on purpose.
changes:
  - {tool: save_complaint_classification, waits_for_approval: false}
  - {tool: save_complaint_response, waits_for_approval: false}

sample_data:
  - ../../policy-library/complaints-procedure-v2.1.md

state:
  built_on_a_cluster: true
  tests_passed: false
  on_the_catalog_shelf: false
  notes: >
    Built by hand as a chat agent and published to the development
    environment of a development cluster on 25 November 2026. Not promoted.
    Three runs of each test. The agent writes a date in words (22 November
    2026) and the checks wanted digits: the checks now accept both, and the
    results here count a date in words as right. Eight of the nine tests
    pass three runs in a row. The ninth, a complaint with one earlier
    contact, was classified as a repeat contact by the first text; one
    sentence was changed and the class is now right in every run, with the
    due date wrong in one run of three. No check reads the saved
    classification.
