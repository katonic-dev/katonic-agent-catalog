id: product-catalog
name: Product Catalog
pack: retail
area: E-commerce and catalogue
summary: >
  Drafts the description and the image tags of a new product to the
  company's style guide, from the supplier's specification and from the
  image descriptions the photo studio wrote. It works from those
  descriptions as text and says plainly that it has seen no image. It
  copies the allergen statement word for word and never works one out. It
  saves the description as a draft. A content lead publishes it.

type: workflow
form: event-triggered
started_by: "A new product arriving in the catalogue system. A person can also name a product"

meets_people_through: application
application: Product data desk

# Built as a chat agent from instructions.md, which is what the tests are written for. It reads no
# image: the catalogue system gives each image as a description in words.
platform:
  kind: chat
  tier: reasoning

needs:
  - id: catalogue
    kind: api
    required: true
    label: "The company's catalogue system, to read new products with their image descriptions, the supplier's specification and the style guide, and to save a description as a draft"
    operations:
      - list_new_products
      - get_supplier_specification
      - get_product_style_guide
      - save_product_description

demo_retailer_systems: [catalogue]

stops_for_a_person:
  - "A content lead reads every description and publishes it. The agent has no operation that publishes one."
  - "Where an image description and the specification disagree, the agent uses the specification and lists the difference. The content lead asks the supplier."
  - "The allergen statement is the supplier's. The agent copies it and never works one out."

# Saving a description is a draft kept as a version on the listing, with its author. It publishes nothing.
# The operation that publishes a description (publish_product_description) is left out of this agent on purpose.
changes:
  - {tool: save_product_description, waits_for_approval: false}

state:
  built_on_a_cluster: true
  tests_passed: false
  on_the_catalog_shelf: false
  notes: >
    Built by hand as a chat agent and published to the development
    environment of a development cluster on 25 November 2026. Not promoted.
    Three runs of each test. All seven tests pass three runs in a row on the
    instructions here, unchanged (five runs in a row is the bar for
    tests_passed), and every description saved to the invented retailer was
    right, twelve of twelve: the facts word for word, the length, the tags,
    and none of the words the style guide rules out. On the test page the
    first save was refused every time, for a list sent as text, and the
    agent corrected it. Built as a chat agent a person talks to; the form
    that an arriving product starts is not built.
