id: store-procedures-qa
name: Store Procedures Q&A
pack: retail
area: Store operations
summary: >
  Answers a store or restaurant colleague's question from the company's own
  Store Procedures Manual, with the procedure and clause cited, and says so when
  the manual is silent. It informs. Anything the manual does not cover goes to
  the restaurant manager.

type: conversational
form: answering
started_by: A colleague's question

meets_people_through: application
application: Store website

platform:
  kind: chat
  preset: knowledge_qa
  tier: reasoning

needs:
  - id: store-procedures-manual
    kind: knowledge_source
    required: true
    label: A knowledge source that holds the company's Store Procedures Manual
    met_by: [SharePoint, Confluence, Google Drive, Notion, File Upload]

demo_retailer_systems: []

stops_for_a_person:
  - It takes no action, so there is nothing to approve.
  - A situation the manual does not cover, a refund or compensation, and any limit set by the Food Safety Plan go to the restaurant manager or to the document that sets them.

changes: []

sample_data:
  - ../../policy-library/store-procedures-manual.md

state:
  built_on_a_cluster: false
  tests_passed: false
  on_the_catalog_shelf: false
  notes: >
    Written. The instructions and tests have not been run on a model. Not yet
    built on a platform.
