id: product-data-check
name: Product Data Check
pack: retail
area: E-commerce and catalogue
summary: >
  Sets each product listing against the supplier's specification and lists
  each attribute that is missing or does not match: net quantity, pack
  size, allergen statement and country of origin. Allergen findings come
  first. It saves the check as a draft. It corrects no listing and works no
  allergen out. A content lead corrects the listing.

type: workflow
form: scheduled
started_by: "A clock, once a week. A person can also name a category or one listing"

meets_people_through: application
application: Product data desk

# Built as a chat agent from instructions.md, which is what the tests are written for.
platform:
  kind: chat
  tier: reasoning

needs:
  - id: catalogue
    kind: api
    required: true
    label: "The company's catalogue system, to read product listings and the supplier's specification of each, and to save a data check as a draft"
    operations:
      - list_product_listings
      - get_supplier_specification
      - save_product_data_check

demo_retailer_systems: [catalogue]

stops_for_a_person:
  - "A content lead corrects every listing. The agent has no operation that changes one."
  - "Which of the two is right, the listing or the specification, is for the content lead and the supplier. The agent reports the difference."
  - "An allergen difference goes to a person first. The agent works no allergen out."

# Saving a data check is a draft kept as a version with its author. It changes no listing.
changes:
  - {tool: save_product_data_check, waits_for_approval: false}

state:
  built_on_a_cluster: true
  tests_passed: false
  on_the_catalog_shelf: false
  notes: >
    Built by hand as a chat agent and published to the development
    environment of a development cluster on 25 November 2026. Not promoted.
    Three runs of each test. A check of one line or of a small category was
    saved right in every run. The check of every listing could not be made
    on that cluster: it needs sixty reads of the specifications, and the
    cluster stopped a tool after eight calls in one turn. When it was cut
    off, three replies of six listed findings that do not exist; none was
    saved. A workflow that reads the specifications in a loop is the cure;
    it is built in the workflow folder. The instructions are as first written.
