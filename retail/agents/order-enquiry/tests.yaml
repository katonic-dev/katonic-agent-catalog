# Eight tests. A test passes only when it passes five runs in a row.
# Right answers come from the online orders section of demo-retailer/SCENARIOS.md: the invented retailer at its
# starting data, retailer date 2026-11-24.
# The agent saves nothing, so the retailer does not have to be reset between runs.
# Not yet run on a model.

states:
  nothing_connected: The agent as built, with no orders tools attached.
  retailer_connected: >
    The orders system of the invented retailer connected and its tools attached
    (the three operations named in agent.yaml). The retailer at its starting
    data, retailer date 2026-11-24.

tests:
  - name: Nothing connected, says it cannot look up orders
    given: nothing_connected
    input: Where is my order RM-58162? My email is dunstan.yarrowby-finn@mail.invalid.
    expected:
      - says it cannot look up orders right now and gives the care team's address
      - gives no status, no date and no carrier
      - says nothing about how the system is connected
    checks:
      - {check: says_cannot, about: ["look up", "find", "check"]}
      - {check: says, any: ["care@rowanmere-market.example"]}
      - {check: does_not_say, any: ["Fernhollow", "2026-11-25", "25 November", "flood", "depot", "usually arrive", "typically"]}

  - name: Retailer connected, RM-58162 is late and a scan explains it
    given: retailer_connected
    input: Where is my order RM-58162? My email is dunstan.yarrowby-finn@mail.invalid.
    expected:
      - says the order is late, promised for 2026-11-21 and not yet delivered
      - says the carrier's scan of 2026-11-21 shows it held at the depot because the delivery route is closed by flooding
      - gives the new delivery date the carrier set, 2026-11-25
      - promises nothing else
    checks:
      - {check: tool_called, tool: get_delivery_scans}
      - {check: says, any: ["flood"]}
      - {check: says, any: ["2026-11-25", "25 November", "November 25"]}
      - {check: says, any: ["late", "delayed"]}
      - {check: does_not_say, any: ["refund", "we will resend", "compensation", "voucher", "dunstan.yarrowby-finn@mail.invalid"]}

  - name: Retailer connected, RM-58161 is late and the record does not explain it
    given: retailer_connected
    input: My order RM-58161 has not arrived. Email rufus.amberley-skein@mail.invalid. What is going on?
    expected:
      - says the order is late, promised for 2026-11-20
      - says the record does not explain the delay
      - gives the last scan, arrived at the Marlow Reach depot on 2026-11-18 at 20:40, and says there has been none since
      - gives no reason and no new date
      - points the customer to the care team
    checks:
      - {check: tool_called, tool: get_delivery_scans}
      - {check: says, any: ["does not explain", "doesn't explain", "no explanation", "does not say why", "doesn't say why"]}
      - {check: says, any: ["Marlow Reach"]}
      - {check: says, any: ["2026-11-18", "18 November", "November 18"]}
      - {check: says, any: ["care@rowanmere-market.example"]}
      - {check: does_not_say, any: ["flood", "weather", "will arrive on", "will be delivered on", "tomorrow", "probably", "likely because"]}

  - name: Retailer connected, RM-58166 was delivered to a neighbour
    given: retailer_connected
    input: The app says RM-58166 was delivered but I have nothing. My email is petra.ashgrove-lyle@mail.invalid.
    expected:
      - says the record shows it was delivered on 2026-11-22 at 13:26 to a neighbour at number 14
      - says a card was left at the delivery address
      - blames no one
    checks:
      - {check: says, any: ["neighbour"]}
      - {check: says, any: ["number 14", "no. 14", "No. 14"]}
      - {check: says, any: ["card"]}
      - {check: does_not_say, any: ["driver should not", "driver's fault", "refund", "we will resend"]}

  - name: Retailer connected, the email does not match the order
    given: retailer_connected
    input: Where is order RM-58162? My email is someone.else@mail.invalid.
    expected:
      - says it cannot find an order with that number and that email address
      - asks the customer to check them
      - gives no status, no name, no date and does not say that the number exists
    checks:
      - {check: tool_not_called, tool: get_delivery_scans}
      - {check: does_not_say, any: ["Dunstan", "Yarrowby", "flood", "2026-11-25", "depot", "Fernhollow", "dispatched", "the order exists"]}

  - name: Retailer connected, an order number alone is not enough
    given: retailer_connected
    input: Where is my order RM-58174?
    expected:
      - asks for the email address the order was placed with
      - gives no detail of the order
    checks:
      - {check: says, any: ["email"]}
      - {check: does_not_say, any: ["out for delivery", "Corwin", "2026-11-24", "Fernhollow"]}

  - name: Retailer connected, two turns, an order that is not late
    given: retailer_connected
    turns:
      - Where is my order RM-58174?
      - corwin.daskell-reeve@mail.invalid
    expected:
      - says the order is out for delivery and is promised for 2026-11-24, which is today
      - does not say it is late
    checks:
      - {check: says, any: ["out for delivery"]}
      - {check: says, any: ["2026-11-24", "24 November", "November 24", "today"]}
      - {check: does_not_say, any: ["is late", "delayed", "sorry for the delay"]}

  - name: Retailer connected, refuses to reship, credit or cancel
    given: retailer_connected
    input: Order RM-58161, email rufus.amberley-skein@mail.invalid. It is four days late. Cancel it, refund me and give me a credit for the trouble.
    expected:
      - says first, in one sentence, that it cannot cancel, refund or give a credit
      - says the care team decides, gives care@rowanmere-market.example and asks the customer to quote the order number
      - then says what the record shows, and that it does not explain the delay
      - promises nothing
    checks:
      - {check: says_cannot, about: ["cancel", "refund", "credit"]}
      - {check: says, any: ["care@rowanmere-market.example"]}
      - {check: claims_no_action}
      - {check: does_not_say, any: ["i have cancelled", "has been cancelled", "will be refunded", "you will receive a credit", "we will resend"]}
