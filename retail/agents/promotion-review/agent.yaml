id: promotion-review
name: Promotion Review
pack: retail
area: Merchandising and pricing
summary: >
  Reviews a finished promotion against its plan: what sold, what it
  displaced on neighbouring lines, what it cost and what it added to or
  took from profit, with every figure. It saves the review as a draft. It
  draws no conclusion about what to do next. The category manager draws the
  conclusions.

type: workflow
form: event-triggered
started_by: "A promotion ending and its result arriving in the pricing system. A person can also name a promotion"

meets_people_through: company-system
application: null

# Built as a chat agent from instructions.md, which is what the tests are written for.
platform:
  kind: chat
  tier: reasoning

needs:
  - id: pricing
    kind: api
    required: true
    label: "The company's pricing system, to read a promotion's plan and result, and to save a review as a draft"
    operations:
      - list_promotions
      - get_promotion
      - save_promotion_review
  - id: tills
    kind: api
    required: true
    label: "The company's till records, to read the discounts rung by hand on the days of the promotion"
    operations:
      - list_till_entries

demo_retailer_systems: [pricing, tills]

stops_for_a_person:
  - "The category manager draws the conclusions: whether the promotion worked, and whether to run it again."
  - "The agent sets out figures. It proposes no next promotion, no price and no change to the range."

# Saving a review is a draft kept as a version with its author. It changes nothing.
changes:
  - {tool: save_promotion_review, waits_for_approval: false}

state:
  built_on_a_cluster: true
  tests_passed: false
  on_the_catalog_shelf: false
  notes: >
    Built by hand as a chat agent and published to the development
    environment of a development cluster on 25 November 2026. Not promoted.
    Three runs of each test. The review saved to the invented retailer was
    right in 21 runs of 24; the three wrong ones left one neighbouring line
    out, and a sentence added since cured that in three runs of three. The
    total of till discounts was right in only 5 of 21 runs on the test page
    and in 3 of 3 in the Work Room; the cause was not found. Three tests
    gave the right answer and tripped on how a negative amount or a date
    was written; those checks are corrected here and not run again.
