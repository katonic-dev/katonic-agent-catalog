id: collections-call-review
name: Collections Call Review
pack: banking
area: Lending
summary: >
  For a recorded collections call, writes a short summary, marks each of the
  bank's conduct rules followed, breached or not applicable with the exact
  words from the transcript, drafts the follow-up note, and says whether a
  supervisor should look. It contacts no customer and never marks a call as
  reviewed: a supervisor does.

type: workflow
form: scheduled
started_by: >
  A clock: the day's batch of unreviewed calls. It can also be asked for one
  call by its id

meets_people_through: bank-system
application: null

platform:
  kind: chat
  tier: reasoning

needs:
  - id: collections-system
    kind: api
    required: true
    label: The bank's collections system, to read recorded calls and the conduct rules, and to save a call review as a draft
    operations:
      - list_collections_calls
      - get_collections_call
      - get_conduct_rules
      - save_call_review

demo_bank_systems: [collections]

stops_for_a_person:
  - A supervisor reads each flagged call and its note and closes the review. The agent never marks a call as reviewed.
  - Whether a breach is serious, and what happens to the caller, is for the supervisor. The agent states what the transcript shows.
  - Anything said to the customer afterwards is for the bank's staff. The agent contacts no customer.

# Saving a call review is a draft kept with its author, a time and a version
# number. The call stays unreviewed.
changes:
  - {tool: save_call_review, waits_for_approval: false}

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 25 November 2026; three versions of the instructions were published and tested there the same day. Not promoted. All eight tests pass five runs in a row: tests 1, 2, 3, 6 and 7 on the second version, with one run each repeated on the third; tests 4, 5 and 8 on the third. Test 1 with no tools, tests 2 to 8 in the Work Room, a new conversation for each run, the collections system put back before each run. What made the batch test pass: on the second version the agent marked the pressure rule differently in a batch than on the same call alone, because two of the bank's call transcripts could be read two ways; the transcripts were rewritten so each call shows one thing, and the third version adds one general rule, that a rule about how the customer is treated is not applicable when the customer never came on the line. On the third version the marks in all five batch runs equal the marks of the single-call runs. Whole replies were lost several times to a restarting server or a dropped connection; a lost run is no result and was run again. Nothing was marked reviewed and nobody was contacted in any run: the agent saves a draft review and a supervisor decides.
