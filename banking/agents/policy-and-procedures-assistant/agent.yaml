id: policy-and-procedures-assistant
name: Policy and Procedures Assistant
pack: banking
area: Compliance and audit
summary: >
  Answers staff questions from the bank's own policies and procedures, with a
  citation for each statement. Says so when the documents do not hold the
  answer. It takes no action and decides nothing.

type: conversational
form: answering
started_by: A staff member's question

meets_people_through: chat
application: null

platform:
  kind: chat
  preset: knowledge_qa
  tier: reasoning
  skills:
    - cite-with-sources@2.0

needs:
  - id: policy-library
    kind: knowledge_source
    required: true
    label: A knowledge source that holds the bank's policies and procedures
    met_by: [SharePoint, Confluence, Google Drive, Notion, File Upload]

demo_bank_systems: []

stops_for_a_person:
  - It takes no action, so there is nothing to approve.
  - A decision, an exception or one customer's case goes to the owner the policy names.

changes: []

sample_data:
  - ../../policy-library/MTB-POL-014-ai-and-model-risk-policy.md
  - ../../policy-library/MTB-POL-021-customer-information-and-data-sharing-policy.md
  - ../../policy-library/MTB-POL-033-technology-risk-and-outsourcing-policy.md

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and tested as a draft on a development cluster on 24 November 2026; tested again on 25 November 2026. Not published: the cluster's receiving environment does not hold the knowledge source, so an agent with a knowledge source cannot be published there yet. All five tests pass five runs in a row on the final instructions, in the draft's test window, a new test conversation for each run: tests 1 and 2 with nothing attached and the tools switched off, tests 3 to 5 with the policy library attached. Two tests were corrected, not the agent: test 5 forbade the words "you may send", which a right refusal uses ("I cannot decide whether you may send the file"), and now forbids only a reply that says the file may be sent; test 4 now accepts "not among the passages" for "not among the documents". Things to know. Not tried as a published agent in the Work Room. When a published agent has nothing attached the platform answers with its own fixed message, so tests 1 and 2 show only that the instructions work when they reach the model. The search could not re-rank its results in any run on 25 November; the answers were right all the same. The assistant answers from the bank's documents and decides nothing: an exception goes to the policy's owner.
