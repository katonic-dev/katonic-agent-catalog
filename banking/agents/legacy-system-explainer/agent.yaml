id: legacy-system-explainer
name: Legacy System Explainer
pack: banking
area: Technology
summary: >
  Explains the tables, keys, codes, stored procedures and batch programs of the
  bank's old core system from the system's own catalog and source, shows the
  lines it relies on, and drafts the documentation nobody wrote. It only reads.
  It says so when the source does not answer.

type: conversational
form: answering
started_by: An engineer's question

meets_people_through: chat
application: null

platform:
  kind: chat
  tier: reasoning

needs:
  - id: legacy-system
    kind: api
    required: true
    label: The bank's old core system, read only, to read its tables, stored procedures and batch programs, and to save documentation as a draft
    operations:
      - list_legacy_tables
      - get_legacy_table
      - list_stored_procedures
      - get_stored_procedure
      - list_legacy_programs
      - get_legacy_program
      - save_legacy_documentation

demo_bank_systems: [legacy]

stops_for_a_person:
  - The engineer decides what to believe and what to keep. A meaning the agent marks as low confidence or as not known is for the people who ran the system to confirm.
  - The agent says what code does and never that a rule is right or a bug.

# Saving a piece of documentation is a draft kept with its author, a time
# and a version number. It changes nothing in the old system.
changes:
  - {tool: save_legacy_documentation, waits_for_approval: false}

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 25 November 2026. Not promoted. All nine tests pass five runs in a row, though not all on one version of the instructions: test 1 with no tools on the first version, whose words for that state did not change; tests 2, 3, 4, 5 and 9 on the second; tests 6 and 7 on the third; test 8 on the fourth. Each later version changed one thing (the third: a rule is given with every part the comment and the code state, and the reply after a save stays the full documentation; the fourth: a confidence is written in plain words). After each change one run of the tests it could touch was repeated and passed: tests 2, 3, 4, 5 and 9 on the third version, tests 2, 6 and 7 on the fourth; tests 3, 4, 5 and 9 were not repeated on the fourth. Tests 2 to 9 ran in the Work Room, a new conversation for each run, the old system put back before each run that saves. Two checks were corrected because they caught a right answer (a sentence saying what the source does not show). On the first afternoon every reply was replaced by the workspace guardrail during a platform fault, and later runs were lost to a restarting server; a lost run is no result and was run again. Nothing in the old system was changed in any run: the agent saves a draft of its documentation and an engineer decides what to keep. The first judged version passed five of nine; what changed is in the instructions and tests of this folder.
