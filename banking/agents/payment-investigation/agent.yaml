id: payment-investigation
name: Payment Investigation
pack: banking
area: Payments operations
summary: >
  Traces a payment's status, lines up the messages exchanged about it, and
  drafts the reply to the customer or the other bank. It stops before any
  recall, amendment or return: a payments operator decides what is sent and
  what is done about the payment.

type: workflow
form: event-triggered
started_by: A query on a payment. The bank's payments system can announce one through its event for new payment investigations

meets_people_through: application
application: Payments desk

platform:
  kind: chat
  tier: reasoning

# The desk sends one message with the investigation's id and reads the reply.
# The agent reads the investigation with its rules, the payment and earlier
# payments to the same beneficiary from the payments system.
needs:
  - id: payments-system
    kind: api
    required: true
    label: The bank's payments system, to read an investigation with the bank rules it lists, the payment with its timeline and messages, earlier payments to the same beneficiary, and to save a draft reply
    operations:
      - get_payment_investigation
      - get_payment
      - get_payment_rule
      - search_payments
      - save_investigation_reply

demo_bank_systems: [payments]

stops_for_a_person:
  - The payments operator reads the proposal and approves the reply, asks for more, or refers the case. The agent sends nothing to the customer or to another bank.
  - A recall, an amendment, a return and a claim for a charge deducted by an intermediary bank are for a person. The agent proposes words for the reply and starts none of them.
  - Where the records do not settle a point, the agent says so and refers the case to a person. It fills no gap.

# Saving a reply is a draft kept with its author, a time and a version number,
# with the findings it rests on. It sends nothing and changes no status.
changes:
  - {tool: save_investigation_reply, waits_for_approval: false}

sample_data:
  - ../../desks/payments/cases.json

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 25 November 2026. Not promoted. All seven tests pass five runs in a row: tests 1 to 6 on the fourth version of the instructions, test 7 on the fifth, which changed one sentence (the payment under investigation is not an earlier payment); one run each of tests 2 to 6 was repeated on the fifth version. Test 1 with no tools, tests 2 to 7 in the Work Room with the desk's own message, a new conversation for each run, the payments system put back before each. Three things to know. On the fifth version the repeated run of test 3 was right (the bank will claim the charge back and the records do not show that the claim has been made yet) and hit a check that caught those words; the check now holds only a claim that it was done. In one run of test 7 the sentence that no earlier payment was found came second, not first. Runs replaced by the workspace guardrail during a platform fault that afternoon, or by a restarting server, are no result and were run again. No payment was recalled, amended or returned and no reply was sent in any run: the agent saves a draft reply and the payments operator decides. The first version passed two of seven; what changed is in the instructions and tests of this folder, in the desk's instruction, and in the bank, whose notes on PAY-6001 and INV-5001 now give dates and no weekend. Not tried: the desk calling this agent, and an event starting it.
