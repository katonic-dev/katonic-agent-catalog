id: member-fund-assistant
name: Member Fund Assistant
pack: banking
area: Pensions and funds
summary: >
  Answers a scheme member's questions about the scheme's funds and the
  member's own holdings. Every figure comes from a fund fact sheet or from the
  member's own record, with the fact sheet and its date named. It gives
  information and never advice. It changes nothing.

type: conversational
form: answering
started_by: A member's question, or a staff member's question on a member's behalf

meets_people_through: chat
application: null

platform:
  kind: chat
  tier: reasoning

# The funds system holds one fact sheet per fund, at one date. It has no
# earlier sheets, so the agent cannot compare two dates. It also holds no
# sign-in for the member: the agent reads the member whose id the
# conversation names, and nobody else.
needs:
  - id: pension-scheme
    kind: api
    required: true
    label: The pension scheme's funds system, to read the funds, their fact sheets, a member and the member's holdings
    operations:
      - list_funds
      - get_fund_fact_sheet
      - get_member
      - get_member_holdings

demo_bank_systems: [funds]

stops_for_a_person:
  - It gives information and never advice. A choice of fund, a switch, a change of contributions or a transfer is for the member to decide, with the scheme's own team or an adviser.
  - Anything the fact sheets do not hold goes to the scheme's member services team.

# The agent has no tool that changes anything, and it saves no draft.
changes: []

sample_data:
  - ../../../demo-bank/SCENARIOS.md

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 25 November 2026. Not promoted. All seven tests pass five runs in a row on the second version of the instructions: test 1 with no tools (five runs on the first version, whose words for that state are unchanged, and one more on the second), tests 2 to 7 in the Work Room, a new conversation for each run started from the agent's own page. The agent only reads, so nothing was put back between runs. Three things to know. Tests 5, 6 and 7 pass on checks corrected after an earlier run: each had a phrase that caught a correct refusal (for example 'cannot say how much it has gone up'); tests 6 and 7 were then run again five times each, test 5 was not run again after its correction and its five passes are on the corrected check. Asked about another member, the agent read a member record before refusing in every run; the tool results kept by the platform show the asker's own record each time and no other member's, but the platform does not show a tool's arguments, so this rests on the results. Eighteen runs of an earlier round were replaced by the workspace guardrail during a platform fault that afternoon; a replaced run is no result. The first version failed the holdings test on the form of money (14086.2 for USD 14,086.20); what changed is in the instructions and tests of this folder.
