id: incident-response
name: Incident Response
pack: banking
area: Technology
summary: >
  For an open incident, gathers the dashboards and metrics, the recent changes
  and the incident's own tickets, and drafts the first assessment for the
  engineer on call: what is failing, since when, what changed just before, the
  likely cause with the evidence for and against, what is not known and what to
  check next. Every statement carries its record. It takes no action: the
  engineer on call decides.

type: multi-agent
form: manager
started_by: An incident being opened. The bank's IT operations system can announce a new incident through its event for incidents, otherwise a person names the incident

meets_people_through: bank-system
application: null

# A manager and three specialists, four agents in all. The manager holds no
# tool: the platform's team builder gives an agent that coordinates a team only
# the specialists attached, and its instructions go in the router prompt. It
# sends Incident Evidence first (which also tells it that an incident is closed
# or not held), then Change History, checks every id and figure they return,
# writes the one reply, and sends the finished text to the one specialist that
# can save it.
# The tests of version 4, built as one chat agent, showed where one agent
# could not hold the whole job: a change search left out, two readings of one
# gap set against each other, a draft saved twice, a reply shorter than its
# note. The split follows those lines. See README.md.
platform:
  kind: chat
  tier: reasoning

needs:
  - id: itops-system
    kind: api
    required: true
    label: The bank's IT operations system, to read incidents, metrics, dashboards, recent changes and runbooks, and to save an assessment as a draft note on the incident
    operations:
      - get_incident
      - get_service_metrics
      - get_dashboard_snapshot
      - list_recent_changes
      - get_runbook
      - save_incident_assessment

demo_bank_systems: [itops]

# The four agents. Each holds only the operations listed here, all from the
# need above. The manager holds none. Only Draft Keeper holds the operation
# that writes.
manager:
  name: Incident Response
  instructions: instructions.md
  purpose: Holds no tool. Refuses a message that asks only for an action without sending anyone; otherwise sends Incident Evidence first, stops if the incident is closed or not held, then sends Change History, checks each part against the ids in their blocks, writes the one reply in nine parts, and sends it once to Draft Keeper
  tools: []
  calls: [incident-evidence, change-history, draft-keeper]

specialists:
  - id: incident-evidence
    name: Incident Evidence
    instructions: specialists/incident-evidence/instructions.md
    purpose: Reads the incident, the measures of each service affected and the dashboards, and returns the facts, the timeline, the samples, every gap, and the alert's minutes without data paired with the gap's minutes as two readings of one event; for a closed incident it returns that it is closed and reads nothing else
    tools: [get_incident, get_service_metrics, get_dashboard_snapshot]
    writes: false
  - id: change-history
    name: Change History
    instructions: specialists/change-history/instructions.md
    purpose: Runs the fixed set of change searches, returns each search it ran with the period the system gave back, every change found by its id on its own line in the record's own words, and the runbook of the alert's service step by step
    tools: [list_recent_changes, get_runbook]
    writes: false
  - id: draft-keeper
    name: Draft Keeper
    instructions: specialists/draft-keeper/instructions.md
    purpose: Saves the manager's finished assessment once as a draft note on the incident, each part exactly as given with its heading, and returns what the system said
    tools: [save_incident_assessment]
    writes: true

stops_for_a_person:
  - The engineer on call decides every action. The agent restarts nothing, rolls nothing back, switches no flag and installs nothing.
  - Where a runbook step needs the incident manager or the change manager, a person runs it. The agent only says what the runbook says.
  - The agent does not close the incident or change its severity.

# Saving an assessment is a draft note on the incident, kept with its author,
# a time and a version number. It changes no service. Only Draft Keeper holds it.
changes:
  - {tool: save_incident_assessment, waits_for_approval: false}

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand as a manager with three specialists (Incident Evidence, Change History, Draft Keeper) and published to the development environment of a development cluster on 25 November 2026. Not promoted. Eight of the nine tests can be run on a team and all eight pass five runs in a row. Test 1, nothing connected, cannot be run in this form: the platform will not test or publish a manager with no specialist attached, and a manager holds no tools of its own. Which version each test ran on: tests 7, 8 and 9 on each specialist alone, second version; tests 5 and 6 on the manager's second version, with one run each repeated on its third; tests 2 and 3 on the manager's third version; test 4 ten judged runs in a row across the manager's second and third versions after one miss on the second. The third version of the manager changed one rule only: when the keeper's reply is neither saved nor refused, the reply says the save is not confirmed and never that nothing was saved. That rule was not exercised: no run of the third version had the keeper's reply replaced. Things to know. In about one run in five on the second version the workspace guardrail replaced the Draft Keeper's one-line confirmation after it had saved, and the manager then said nothing was saved while the bank held the draft; that is the fault the third version guards against. Whole replies were often lost to a restarting server or a dropped connection, because a manager turn takes two to three minutes; a lost run is no result and was run again, and one lost run left a draft behind. In several runs the manager sent Incident Evidence or Change History two or three times where once is expected; the reply was right and exactly one draft was saved each time. Nothing was rolled back, switched or closed in any run: the team saves a draft assessment on the incident and a person decides. Before this form the same job was built as one chat agent, which after four versions passed three of six tests; what changed is this folder.
