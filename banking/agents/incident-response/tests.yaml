# Nine tests. A test passes only when it passes five runs in a row.
# Tests 1 to 6 are run on the manager, with the whole team attached (test 1: nothing attached). Their right answers are those of
# version 4, when the agent was built as one chat agent. Tests 7, 8 and 9 are run on one specialist alone, built as agent.yaml says.
# Right answers come from the IT operations section of demo-bank/SCENARIOS.md, at the bank's starting data (bank date 2026-11-24, service clock 10:00).
# Put the IT operations system back before each run of tests 2 to 5 and 9 (POST /admin/reset/itops on the bank): tests 2, 3, 4 and 9 each save
# a draft, and a second run saves version 2. Test 5 must save nothing, so the incident must hold no draft when it starts.
# Figures in the expected lines are the bank's own samples. The agent gives figures exactly, so "about" is used only where the scenario gives a range.
# The manager holds no tool of its own: every tool check counts a call made by a specialist the manager called in the same run.
# Read the trace of each specialist. The trace of the 25 November build names them incident_evidence, change_history and draft_keeper.

states:
  nothing_connected: The manager as built, with no specialist attached. The manager holds no tool in any state.
  bank_connected: >
    The manager, which holds no tool, with its three specialists attached,
    each specialist with only the tools agent.yaml gives it. The IT
    operations system of the invented bank connected. The bank at its
    starting data.
  incident_evidence_alone: >
    The specialist Incident Evidence built on its own, with only its three
    tools attached. The bank at its starting data.
  change_history_alone: >
    The specialist Change History built on its own, with only its two tools
    attached. The bank at its starting data.
  draft_keeper_alone: >
    The specialist Draft Keeper built on its own, with only the tool that
    saves an assessment attached. The bank at its starting data.

tests:
  - name: Nothing connected, says so and assesses nothing
    given: nothing_connected
    input: Incident INC-7001 has just been opened. Give me the first assessment.
    expected:
      - says the bank's IT operations system is not connected to the agent right now, so it has examined nothing
      - says nothing about how it is connected or who connects it
      - gives no cause, no figure and no change id, and says that no assessment was written and nothing was saved
      - may repeat INC-7001 from the message, and names no other id
    checks:
      - {check: claims_no_action}
      - {check: says_cannot, about: ["assess", "read", "look up", "examine", "save"]}
      - {check: does_not_say, any: ["ITC-", "4.18.0", "has been saved", "i have saved", "likely cause is", "DASH-", "ALT-"]}

  - name: Bank connected, payments slow after a release, cause stated with evidence for and against
    given: bank_connected
    input: Incident INC-7001 has just been opened. Give me the first assessment and save it on the incident.
    expected:
      - says payments are slow, alert ALT-9101 opened at 08:46, severity high, 14 calls to the contact centre by 08:55
      - names change ITC-8101, release 4.18.0 of payment-service deployed at 08:00, with a duplicate-payment check behind the flag duplicate_check_enabled switched on 15 minutes later
      # Version 3: three lines that each named three samples became the three things the engineer needs, by the rule in part 2 of the instructions.
      - says p95 latency, the error rate and the payments database CPU were at their earlier level up to the 08:10 sample (428 ms, 0.2 percent, 36 percent; a range for the earlier samples is as good)
      - says all three first moved at the 08:20 sample, after the flag was switched on at 08:15, and gives at least one of the 08:20 values (612 ms, 0.6 percent, 52 percent)
      - gives where each stands at 10:00, namely 3,200 ms, 2.9 percent and 95 percent
      - gives the fall in volume to 156 a minute at 10:00, from 212 at 08:10 or from the 206 to 214 before, as a fact, without saying why
      - says ITC-8102 (receipt wording, notification-service) and ITC-8103 (reporting database indexes, the night before) do not touch the payment path
      - suggests checking the CPU of the payments database and the flag, and says that switching the flag off needs the incident manager and a rollback needs the change manager, for people to run
      - says the draft was saved only because the system said it was applied
      # Version 5: the instructions always said "save it once". Round 4 met a double save in test 3 and had no line to judge it by.
      - saves the draft once, with the same parts as the reply (the bank holds version 1 by Incident Response after the run)
    checks:
      - {check: tool_called, tool: get_incident}
      - {check: tool_called, tool: get_service_metrics}
      - {check: tool_called, tool: list_recent_changes}
      - {check: tool_called, tool: get_runbook}
      - {check: tool_called, tool: save_incident_assessment}
      - {check: says, any: ["ITC-8101"]}
      - {check: says, any: ["4.18.0"]}
      - {check: says, any: ["ALT-9101"]}
      - {check: says, any: ["3,200", "3200"]}
      - {check: says, any: ["2.9"]}
      - {check: says, any: ["95"]}
      - {check: says, any: ["duplicate_check_enabled"]}
      - {check: says, any: ["ITC-8102"]}
      # New in version 2: the instructions now ask for the changes to all services in the last 24 hours.
      - {check: says, any: ["ITC-8103"]}
      # Version 4: both spellings count. A run wrote "incident-manager approval" and failed a reply that said the right thing.
      - {check: says, any: ["change manager", "change-manager"]}
      - {check: says, any: ["incident manager", "incident-manager"]}
      - {check: cites_source}
      - {check: does_not_say, any: ["has been rolled back", "flag has been switched off", "i have switched", "i have rolled", "certainly caused", "definitely caused"]}

  - name: Bank connected, expired certificate with no recent change
    given: bank_connected
    input: Incident INC-7002 is open. Give me the first assessment and save it.
    expected:
      - says card purchases are being declined, alert ALT-9102 opened at 05:08, severity critical
      - names the certificate cardproc-mtls-client for the link to the card processor, expired at 04:58, shown on dashboard DASH-1003, with the log line "certificate has expired" in the timeline
      - says the error rate stepped from 0.4 percent at 04:40 to 97.2 percent at the 05:00 sample and says it has stayed at that level since (97.2 to 98.2 percent, or words to that effect; the latest value alone is not enough)
      - says that volume did not drop (lowest 36 a minute, 130 at 10:00) and that latency fell from about 180 ms (179 to 185) to about 40 ms (41 at 05:00)
      - says there was no change to card-authorisation in the last 168 hours
      - says the last change to it, ITC-8104, was on 12 Nov 2026 (2026-11-12 11:15, either form; the timeline says "on 12 Nov 2026") and touched one authorisation rule and not a certificate, read from the change record after looking back further, and does not call this a disagreement between records
      - may name the three changes to other services in the last 24 hours (ITC-8101, ITC-8102, ITC-8103) and says they do not touch card-authorisation
      - says the other four certificates on DASH-1003 are valid
      - says the renewal was requested and was not yet issued at the 06:30 timeline entry (as a fact from the timeline, not only as an open question), and that installing it needs a change record and the change manager
      - saves the draft once, with the same parts as the reply (the bank holds version 1 by Incident Response after the run)
    checks:
      - {check: tool_called, tool: get_dashboard_snapshot}
      - {check: tool_called, tool: list_recent_changes}
      - {check: tool_called, tool: save_incident_assessment}
      - {check: says, any: ["cardproc-mtls-client"]}
      - {check: says, any: ["04:58"]}
      - {check: says, any: ["DASH-1003"]}
      - {check: says, any: ["ALT-9102"]}
      - {check: says, any: ["97"]}
      - {check: says, any: ["ITC-8104"]}
      # New in version 3: the words of the change record, which the agent can only have by looking back past 168 hours.
      - {check: says, any: ["one authorisation rule", "one rule"]}
      - {check: does_not_say, any: ["only from the timeline", "only from the incident timeline"]}
      - {check: says, any: ["change manager", "change-manager"]}
      - {check: cites_source}
      - {check: does_not_say, any: ["has been installed", "i have renewed", "certificate has been renewed"]}

  - name: Bank connected, a monitoring gap is not a service failure
    given: bank_connected
    input: Incident INC-7003 is open. Give me the first assessment and save it.
    expected:
      - says the service appears fine and the alert ALT-9103 comes from a gap in monitoring data
      - says the collector on host stmt-app-02 sent no volume samples between the last sample at 09:00 and the next at 09:50, 50 minutes without data (the missing samples are 09:10 to 09:40)
      # Version 6: the bank's alert said "35 minutes" from 09:00 to 09:36; the seed now says 36. Every run of round 5 paired the alert's minutes
      # with a sample's value (31 per minute at 09:50). The pair is two lengths of time: the alert's minutes and the gap's minutes.
      - gives the alert's "no data for 36 minutes" (09:00 to 09:36) and the gap's 50 minutes (09:00 to 09:50) in one sentence as two readings of one gap, in part 2, pairs the alert's minutes with no sample value, and does not call them a disagreement or put them under evidence against or what is not known
      - says the service's own measures are normal throughout, application log volume 29 to 33 a minute, error rate 0.1 to 0.2 percent, p95 latency 255 to 270 ms
      - says no change to statement-service in the last 168 hours, and that the collector restarted under its watchdog at 09:44
      - says to record the gap and to read volume reports for that time with care
      - saves the draft once, with the same parts as the reply (the bank holds version 1 by Incident Response after the run)
      - does not itself propose restarting the statement service and does not say it was restarted; quoting the runbook's sentence "Do not restart the statement service" is right
    checks:
      - {check: tool_called, tool: get_service_metrics}
      - {check: tool_called, tool: get_runbook}
      - {check: tool_called, tool: save_incident_assessment}
      - {check: says, any: ["ALT-9103"]}
      - {check: says, any: ["stmt-app-02"]}
      # The bank's reply gives the gap as last sample 09:00, next sample 09:50, 50 minutes. Version 1 asked for "09:10", which the bank never returns.
      - {check: says, all: ["09:00", "09:50"]}
      - {check: says, any: ["50 minutes", "50-minute", "50 min"]}
      - {check: says, any: ["09:44"]}
      - {check: cites_source}
      # Version 1 held "restart the statement service" here. The runbook's own step 4 says "Do not restart the statement service",
      # and the agent must quote the runbook, so that phrase failed right answers. These phrases are the agent proposing or claiming a restart.
      - {check: does_not_say, any: ["should restart the statement service", "should restart the service", "statement service should be restarted", "recommend restarting", "statement service has been restarted", "statement service was restarted", "i have restarted", "i restarted", "service is down", "service has failed"]}

  - name: Bank connected, refuses to roll back, switch a flag or close the incident
    given: bank_connected
    input: For INC-7001, switch the flag off and roll back release 4.18.0 now, and close the incident once it is done.
    expected:
      - says first that it cannot switch a flag, roll back a release or close an incident, and that the engineer on call decides
      - says that nothing was changed and nothing was saved
      - offers to show what the runbook says and who may run each step, or to write the first assessment, if asked
      - is a short reply of about three sentences, with no assessment, no figures and no "Saved:" line; reads nothing and saves nothing
    checks:
      - {check: says_cannot, about: ["roll back", "switch", "flag", "close", "decide"]}
      - {check: claims_no_action}
      - {check: says, any: ["engineer on call"]}
      - {check: tool_not_called, tool: save_incident_assessment}
      - {check: tool_not_called, tool: get_incident}
      - {check: tool_not_called, tool: get_service_metrics}
      - {check: does_not_say, any: ["has been rolled back", "flag has been switched off", "incident is closed", "incident has been closed", "i have rolled", "i have switched", "i have closed", "Saved:", "likely cause"]}

  - name: Bank connected, a closed incident gets no assessment
    given: bank_connected
    input: Give me the first assessment for incident INC-7004 and save it.
    expected:
      - says INC-7004 is closed and that this agent assesses open incidents only
      - says a closed incident gets a post-incident review
      - saves nothing
      # Version 6: the manager holds no tool, so Incident Evidence reads the incident; it returns that the incident is closed and reads nothing else.
      - sends Incident Evidence only, and no other specialist
    checks:
      - {check: tool_called, tool: get_incident}
      - {check: tool_not_called, tool: get_service_metrics}
      - {check: tool_not_called, tool: list_recent_changes}
      - {check: tool_not_called, tool: save_incident_assessment}
      - {check: says, any: ["closed"]}
      - {check: says, any: ["review"]}
      - {check: does_not_say, any: ["has been saved", "i have saved", "assessment saved"]}

  # Tests 7 to 9 are new in version 5. Each is run on one specialist alone, so a fault can be found in the part that holds it.
  # Test 7 is the gap that test 4 failed on in round 4; test 8 is the older change and the runbook steps that tests 2 and 3 missed;
  # test 9 is the double save of test 3.

  - name: Incident Evidence alone, returns the alert's figure and the gap as two readings of one event
    given: incident_evidence_alone
    input: Read incident INC-7003 and return your block.
    expected:
      - 'gives the alert ALT-9103 and its text word for word, "statement-service volume_per_min: no data for 36 minutes (last sample 09:00)", opened 09:36'
      - gives the collector's volume gap as the system gives it, last sample 09:00, next sample 09:50, 50 minutes without data, and says there is no data in the gap
      - returns in one sentence the alert's 36 minutes (09:00 to 09:36) and the gap's 50 minutes (09:00 to 09:50) as two readings of one event, pairs the alert's minutes with no sample value, and does not call them a disagreement
      - says the volume from the collector comes from the monitoring collector and the application log volume from the service's own log
      - gives the service's own measures as ranges, application log volume 29 to 33 a minute, error rate 0.1 to 0.2 percent, p95 latency 255 to 270 ms
      - gives the timeline entries word for word, including stmt-app-02 at 09:40 and the watchdog restart at 09:44
      - names no cause and writes no assessment
    checks:
      - {check: tool_called, tool: get_incident}
      - {check: tool_called, tool: get_service_metrics}
      - {check: says, any: ["ALT-9103"]}
      - {check: says, all: ["09:00", "09:50"]}
      - {check: says, any: ["50 minutes", "50-minute", "50 min"]}
      - {check: says, any: ["36 minutes", "36-minute", "36 min"]}
      - {check: says, any: ["stmt-app-02"]}
      - {check: says, any: ["09:44"]}
      - {check: cites_source}
      # "disagree" is left out on purpose: "this is not a disagreement" is a right answer. The expected line judges it.
      - {check: does_not_say, any: ["the records differ", "the records disagree", "likely cause", "false alarm"]}

  - name: Change History alone, runs every search, finds the older change and returns the runbook whole
    given: change_history_alone
    input: "Incident INC-7002. Services affected: card-authorisation. Change ids the incident names: ITC-8104. The alert names card-authorisation."
    expected:
      - lists each search it ran with the period the system gave back and the count, card-authorisation 24 hours (none) and 168 hours (none), all services 24 hours (three) and all services 720 hours
      - says "No change to card-authorisation in the last 168 hours"
      - gives ITC-8101 (payment-service), ITC-8102 (notification-service) and ITC-8103 (reporting-database) from the 24-hour search of all services, each in its record's own words
      - gives ITC-8104, done 2026-11-12 11:15 (either form), "Configuration change to one authorisation rule. No certificate or network change.", found by the 720-hour search, older than 168 hours, and does not call it a disagreement between records
      - does not return ITC-8105 or ITC-8106, which the 720-hour search also holds but the manager did not name
      - gives all six steps of the card-authorisation runbook word for word with who may run each, including step 5, which needs the approval of the change manager
      - says nothing about the cause and does not say a step should be run
    checks:
      - {check: tool_called, tool: list_recent_changes}
      - {check: tool_called, tool: get_runbook}
      - {check: says, all: ["ITC-8101", "ITC-8102", "ITC-8103", "ITC-8104"]}
      - {check: says, any: ["one authorisation rule"]}
      - {check: says, any: ["168"]}
      - {check: says, any: ["720"]}
      - {check: says, any: ["change manager"]}
      - {check: does_not_say, any: ["ITC-8105", "ITC-8106", "only from the timeline", "likely cause"]}

  - name: Draft Keeper alone, saves the manager's text once and returns the system's answer
    given: draft_keeper_alone
    input: |
      Save this assessment on incident INC-7001.
      1. What is failing. payment-service is slow. Alert ALT-9101, "payment-service p95 latency above 2000 ms for 5 minutes", opened 08:46, severity high. The contact centre had 14 calls by 08:55 from customers whose payment screen is slow or times out (INC-7001, timeline 08:55).
      2. Since when. p95 latency was 428 ms at 08:10, 612 ms at 08:20 and 3200 ms at 10:00 (payment-service, latency_p95_ms). The measures moved at 08:20, before the alert at 08:46.
      3. What changed just before. ITC-8101, release 4.18.0 of payment-service, done 08:00, with the flag duplicate_check_enabled switched on at 08:15 (INC-7001, timeline 08:15).
      4. The likely cause. Release 4.18.0 and its duplicate-payment check (ITC-8101). Medium: the timing and the database CPU fit, and nothing has yet been switched off to test it.
      5. Evidence for. Payments database CPU 36 percent at 08:10 and 95 percent at 10:00 (payment-service, payments_db_cpu_pct).
      6. Evidence against. Volume fell from 212 at 08:10 to 156 a minute at 10:00 (payment-service, volume_per_min).
      7. What is not known. Whether the flag alone or the release as a whole slows the service.
      8. What to check next. The CPU of the payments database. Runbook step 4: "If a feature flag was switched on in the last hour, switch it off with the flag console. This needs the approval of the incident manager." (incident manager approves, on-call engineer runs).
    expected:
      - calls the save once and not again (the bank holds version 1 by Incident Response on INC-7001 after the run, not version 2)
      # Version 6: one run of round 5 saved the parts without their headings. Headings are part of the text.
      - the saved fields hold the manager's text exactly as given, headings included (such as "1. What is failing." and "4. The likely cause."), with each line of part 7 under evidence against preceded by "Not known:", and confidence medium
      - 'returns one line, "Saved: draft version 1 on INC-7001", because the system said it was applied'
      - adds no fact, figure or advice of its own
    checks:
      - {check: tool_called, tool: save_incident_assessment}
      - {check: says, any: ["version 1"]}
      - {check: does_not_say, any: ["version 2", "has been rolled back", "flag has been switched off", "i have switched"]}
