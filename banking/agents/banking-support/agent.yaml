id: banking-support
name: Banking Support
pack: banking
area: Customer service
summary: >
  For a member of staff with a customer's question. Drafts the reply from the
  bank's product and policy documents and the customer's own records, with a
  source for every statement. It stops before any reply is sent: the member of
  staff sends it.

type: conversational
form: acting
started_by: A staff member's request

meets_people_through: chat
application: null

platform:
  kind: chat
  tier: reasoning

needs:
  - id: product-documents
    kind: knowledge_source
    required: true
    label: A knowledge source that holds the bank's product and policy documents
    met_by: [SharePoint, Confluence, Google Drive, Notion, File Upload]
  - id: customer-records
    kind: api
    required: true
    label: The bank's customer records, to find a customer, read their accounts, transactions and contacts, and save a draft note
    operations:
      - search_customers
      - list_customer_accounts
      - list_account_transactions
      - list_customer_contacts
      - add_contact_note

demo_bank_systems: [core]

stops_for_a_person:
  - The member of staff reads the draft reply and sends it. The agent sends nothing to the customer.
  - A refund, a reversal, a waiver or any change to an account or a customer detail is decided and made by the bank's staff through the bank's usual process. The agent changes nothing.
  - A question about another customer's account is not answered. It goes through the bank's usual process for such a request.

# Adding a contact note is a draft note on the customer's contact history,
# kept with its author, a time and a version number. It sends nothing and
# changes nothing else.
changes:
  - {tool: add_contact_note, waits_for_approval: false}

sample_data:
  - ../../policy-library/MTB-PRD-051-current-account-terms-and-fees.md
  - ../../policy-library/MTB-PRD-052-savings-account-terms.md

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and tested as a draft on a development cluster on 25 November 2026; three versions of the instructions were tested there the same day. Not published: the cluster's receiving environment does not hold the knowledge source, so an agent with a knowledge source cannot be published there yet. All seven tests pass five runs in a row in the draft's test window: tests 2, 4, 5, 6 and 7 on the second version, with one run each repeated on the third; tests 1 and 3 on the third. Test 1 with the tools and the knowledge source taken off, the others with them attached, the core banking system put back before each run that saves. What changed for the third version: the agent keeps a relative day the customer names, such as tomorrow, as the customer's word, because it otherwise counted from its own clock and not from the bank's date; and it says in one sentence whether the balance covers the amount the customer wants to move. Things to know. Not tried as a published agent in the Work Room. The saved note often records who drafted it as "agent" where the agent says it gave its own name; which side drops the name is not yet known. No reply was sent to a customer and nothing was refunded in any run: the agent saves a draft note and the member of staff sends the reply.
