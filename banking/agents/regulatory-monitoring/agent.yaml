id: regulatory-monitoring
name: Regulatory Monitoring Daily Sweep
pack: banking
area: Compliance and audit
summary: >
  On a clock, reads the publication feeds of two financial regulators, works
  out what is new since its last run and writes a digest for a compliance
  officer: each new publication with its title, date and link, or a plain line
  that nothing is new. It changes nothing.

type: workflow
form: scheduled
started_by: A clock. A schedule starts a run at a set time each day. A person can also start one by hand

meets_people_through: application
application: Regulatory change desk

platform:
  kind: workflow
  tier: balanced                # the platform's tier label. The digest step pins one model by name
  steps:
    - fetch each feed (HTTP GET)
    - tidy each feed to one line per publication (code)
    - compare each with the copy the last run saved (compare_last)
    - write the digest (one model step)

needs: []
# None of the four kinds apply. The two feeds are public addresses that need no
# sign-in, and the platform's HTTP step reads them without a connector, a
# server or a knowledge source. The workflow keeps its own state between runs.

demo_bank_systems: []

stops_for_a_person:
  - The compliance officer reads the digest. Nothing is changed, so there is nothing to approve.
  - What a new publication means for the bank, and what to do about it, is for the officer.

changes: []

sample_data: []

feeds:
  - name: Financial Conduct Authority (FCA), news
    url: https://www.fca.org.uk/news/rss.xml
    note: RSS, about 66 KB, 20 items, one element per line
  - name: European Central Bank (ECB), press, speeches and interviews
    url: https://www.ecb.europa.eu/rss/press.xml
    note: RSS, about 6 KB, 15 items, all on a few long lines

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built as a scheduled workflow and published to the development environment of a development cluster in November 2026. Not promoted. All five tests pass five runs in a row, on 26 November 2026, on a copy of the workflow that differs from the published one only in its two feed addresses: the copy reads two test feeds with invented items served by the invented bank, where a tester can publish one new item or make a feed unreadable on demand. The digest step's instructions are this folder's, checked by hash. Each run was started by hand with the workflow's own Run now button. Test 1, the first run: five first runs, each after the two saved-copy names were changed and the copy published again, because publishing again under the same names keeps the saved copy. Test 2, nothing new: five of five. Test 3, a feed has changed: five runs after one new item, each listing exactly that item under the right regulator, and one run after two items on one feed and one on the other. Test 4, a feed that cannot be read: five of five. Test 5, asked to add a regulator it does not read: five of five. On the live feeds, on 25 November 2026, tests 2 and 5 also passed five runs each, and one run listed the five new items of the two regulators exactly as the live feeds gave them. Things to know. After a feed could not be read, the next run lists every item of that feed as new, because the failed read replaces the saved copy. Every publish of the copy turned its schedule back on, and it was paused again each time. The digest shows a date in the feed's own form. The sweep changes nothing: a compliance officer reads the digest.
