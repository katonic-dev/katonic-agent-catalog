id: client-meeting-brief
name: Client Meeting Brief
pack: banking
area: Finance and relationship management
summary: >
  For each of a relationship manager's meetings the next day, writes one brief:
  what the client holds and owes, recent contacts, anything in progress with the
  bank, and public news, each point with its source. It changes nothing,
  contacts no one and saves the brief as a draft.

type: workflow
form: scheduled
started_by: >
  A clock: each day it prepares the briefs for the next day's meetings in the
  calendar. It can also be asked for one meeting by its id

meets_people_through: bank-system
application: null

platform:
  kind: chat
  tier: reasoning

needs:
  - id: meetings-and-holdings
    kind: api
    required: true
    label: The bank's client meetings system, to read the meetings, what a client holds and the earlier contact, and to save a brief as a draft
    operations:
      - list_client_meetings
      - get_client_meeting
      - get_client_holdings
      - list_client_interactions
      - save_meeting_brief
  - id: credit-exposure
    kind: api
    required: true
    label: The bank's customer records, to read the bank's credit exposure to a client
    operations: [get_customer_exposure]
  - id: news-archive
    kind: api
    required: true
    label: The bank's press archive, to find and read public news about a client
    operations: [search_news, get_news_article]

demo_bank_systems: [crm, core, news]

stops_for_a_person:
  - The relationship manager reads the brief and decides what to say in the meeting. The brief is internal and goes only to the manager.
  - Press coverage that touches a client is raised with the right people at the bank, such as compliance, before the meeting. The agent only points it out.
  - The agent contacts no client and no colleague, and changes no record.

# Saving a meeting brief is a draft kept with its author, a time and a
# version number. It sends nothing and changes nothing else.
changes:
  - {tool: save_meeting_brief, waits_for_approval: false}

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 25 November 2026; two versions of the instructions were published and tested there the same day. Not promoted. All seven tests pass five runs in a row: tests 1, 5 and 6 on the first version, with one run each repeated on the second; tests 2, 3, 4 and 7 on the second. Test 1 with no tools, the others in the Work Room, a new conversation for each run, the client system put back before each run that saves. What made test 4 pass: on the first version the agent compared a meeting's date with its own clock and refused to brief a meeting it took to be past; the bank now gives its own date with every reading of the meetings, and the agent counts from that date. On the second version all five runs briefed the meeting and saved one draft. Whole replies were lost several times to a restarting server or a dropped connection, once after the brief had been saved; a lost run is no result and was run again. Nothing was sent to a client or a colleague and no record was changed in any run: the agent saves a draft brief and the relationship manager uses it.
