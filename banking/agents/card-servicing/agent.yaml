id: card-servicing
name: Card Servicing
pack: banking
area: Customer service
summary: >
  For a member of staff on a call about a card. Shows the card's status, recent
  payments and open disputes, and prepares a block, a replacement or a dispute.
  It changes nothing until the staff member confirms.

type: conversational
form: acting
started_by: A staff member's request

meets_people_through: application
application: Card servicing screen

platform:
  kind: chat
  tier: reasoning

needs:
  - id: customer-records
    kind: api
    required: true
    label: The bank's customer records, to find a customer and read their contacts
    operations: [search_customers, get_customer, list_customer_contacts]
  - id: card-system
    kind: api
    required: true
    label: The bank's card system, to read cards, payments and disputes and to request changes
    operations:
      - list_customer_cards
      - get_card
      - list_card_transactions
      - list_card_disputes
      - block_card
      - request_card_replacement
      - open_card_dispute

demo_bank_systems: [core, cards]

stops_for_a_person:
  - The staff member confirms every block, replacement and dispute in the conversation before it is requested.
  - Whether the customer gets money back is decided by the disputes team, not by the agent.

changes:
  - {tool: block_card, waits_for_approval: true}
  - {tool: request_card_replacement, waits_for_approval: true}
  - {tool: open_card_dispute, waits_for_approval: true}

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 24 November 2026; the second version of the instructions was published and tested there on 26 November 2026. Not promoted. All seven tests pass five runs in a row on the second version: test 1 with no tools, tests 2 to 7 in the Work Room, a new conversation for each run, the card system put back before each run; tests 6 and 7 with the messages the card servicing screen sends. On the first version only two tests held for five runs. What changed for the second version: set sentences for the reply when nothing is connected and for a question about a refund; after a confirmed proposal, one line for each change asked for, with the card, the reason, each payment with its amount and the total; a plain rule for each of the four marks on the screen; and tests that no longer trip on a right reply such as "No card has been blocked". One test line was corrected after the run: a reply that says the disputes team decides about a refund does not rule on the refund. Every change the agent asked for, a block, a replacement and a dispute, waited for approval in every run, and the bank's records stayed as they were. Not tried: the step after a second person approves. One oddity on the platform: the same approval reference appeared in more than one conversation.
