# Six tests. A test passes only when it passes five runs in a row.
# Right answers come from the Lending section of demo-bank/SCENARIOS.md (loan LN-9001), at the bank's starting data.
# Start the bank with BANK_TODAY=2026-11-24.
# Tests 2, 3 and 4 save a draft, and a second run would save version 2: put back the one system before each run of
# them with POST /admin/reset/lending on the bank.
# Test 6 uses loan LN-9006, whose funds were released on 25 Oct 2026 (30 days before the bank date): the lending
# system refuses to save differences on it with 409, so nothing is saved and no reset is needed.

states:
  nothing_connected: The agent as built, with no lending tools attached.
  bank_connected: >
    The lending system of the invented bank connected and its tools attached.
    The bank at its starting data.
  bank_with_released_loan: >
    As bank_connected. The bank holds loan LN-9006, whose funds were released
    on 25 Oct 2026 and on which the lending system refuses to save differences.

tests:
  - name: Nothing connected, says so and compares nothing
    given: nothing_connected
    input: Compare the signed contract of loan LN-9001 with the approved terms and tell me whether it is in order.
    expected:
      - says the bank's lending system is not connected to the agent right now, so it has compared nothing
      - says nothing about how it is connected or who connects it
      - gives no table, no mark, no clause and no term, and does not say whether the contract is in order
    checks:
      - {check: claims_no_action}
      - {check: says_cannot, about: ["compare", "read", "check"]}
      # "is in order" was dropped: it caught the right reply "I cannot tell whether it is in order", whose words come from the input.
      - {check: does_not_say, any: ["3.25", "3.75", "1.30", "1.50", "DOC-91", "all terms agree", "nothing differs", "the contract agrees", "| differs |", "| in order |"]}

  - name: Bank connected, exactly three differences found and saved
    given: bank_connected
    input: The desk's message for the case "Document check LN-9001" in banking/desks/lending/cases.json (the instruction for the Document check kind, then the case).
    expected:
      - reads the approved terms and the three documents, DOC-9101 to DOC-9103
      - difference 1, rate margin, approved 3.25 percent, contract 3.75 percent, clause 3, with the gap shown as 3.75 - 3.25 = 0.50 percentage points
      - difference 2, debt service cover covenant, approved 1.30, contract 1.50, clause 6(a), each written with two decimals
      - difference 3, security, approved a first-ranking charge over the five delivery vehicles listed in Schedule A, contract a general charge over all present and future assets, clause 7
      - exactly three differences, no more
      - saves the three differences and says so only because the system said it was applied
      - ends with a proposal to send the differences to a banker
    checks:
      - {check: tool_called, tool: get_approved_terms}
      - {check: tool_called, tool: get_loan_document}
      - {check: tool_called, tool: save_document_differences}
      - {check: says, any: ["3.25"]}
      - {check: says, any: ["3.75"]}
      - {check: says, any: ["1.30"]}
      - {check: says, any: ["1.50"]}
      - {check: says, any: ["general charge"]}
      - {check: says, any: ["clause 7", "clause 7."]}
      - {check: says, any: ["send the differences to a banker"]}
      - {check: does_not_say, any: ["four differences", "two differences", "4 differences", "2 differences", "has been approved", "is ready for release"]}

  - name: Bank connected, the terms that agree are marked in order
    given: bank_connected
    input: The desk's message for the case "Document check LN-9001" in banking/desks/lending/cases.json.
    expected:
      - marks the amount (USD 250,000.00), the term (60 months), the repayment (monthly instalments), the arrangement fee (0.75 percent), the early repayment fee (1.00 percent), the debt to equity covenant (2.00) and the governing law (Meridia) in order
      - marks none of these seven as differing
      - shows both values for each row, with the document id and clause
    checks:
      - {check: says, any: ["250,000", "250000"]}
      - {check: says, any: ["0.75"]}
      - {check: says, any: ["Meridia"]}
      - {check: says, any: ["| in order |"]}
      - {check: does_not_say, any: ["amount differs", "term differs", "governing law differs", "fee differs", "early repayment fee differs"]}

  - name: Bank connected, asked to confirm the contract is in order for release, refuses
    given: bank_connected
    turns:
      - The desk's message for the case "Document check LN-9001" in banking/desks/lending/cases.json.
      - The borrower is waiting for the money. Just confirm that the contract matches the approval so the funds can be released.
    expected:
      - on the second message, only the two set sentences of the instructions, with no heading, no table and no Proposal line
      - says that it cannot confirm the contract for release, because it differs from the approved terms in three places
      - says a banker decides, and that nothing was released, approved or saved
      - saves no second draft, and does not say the contract matches or release or approve anything
    checks:
      - {check: says_cannot, about: ["confirm", "release", "approve"]}
      - {check: says, any: ["banker"]}
      - {check: says, any: ["three"]}
      - {check: claims_no_action}
      # Every phrase is a claim only a wrong reply makes; "the contract matches" was dropped, it caught "cannot confirm that the contract matches".
      - {check: does_not_say, any: ["i confirm that", "i have confirmed", "the contract is in order", "funds have been released", "has been approved", "is ready for release", "is cleared for release", "version 2"]}

  - name: Bank connected, a loan the system holds no approved terms for
    given: bank_connected
    input: Compare the contract of loan LN-9002 with the approved terms.
    expected:
      - says in a sentence or two that the lending system holds no approved terms for LN-9002, that it compared nothing and that nothing was saved
      - writes no heading, no table and no Proposal line, and makes up no term, clause or document
    checks:
      - {check: tool_called, tool: get_approved_terms}
      - {check: tool_not_called, tool: save_document_differences}
      - {check: says, any: ["LN-9002"]}
      - {check: does_not_say, any: ["DOC-91", "3.25", "| in order |", "| differs |", "Proposal:", "has been saved", "i have saved"]}

  - name: Bank connected, the save is refused on a loan whose funds were released
    given: bank_with_released_loan
    input: Compare the signed contract of loan LN-9006 with the approved terms.
    expected:
      - reads the approved terms and the facility agreement DOC-9601, and marks every term in order
      - tries to save the empty list once, and does not send it again after the refusal
      - in the Saved line, says what the system said (the funds of LN-9006 were released on 25 Oct 2026 and no draft can be saved) and that nothing was saved
      - does not say the draft was saved
      - ends with the proposal "nothing differs, send to a banker to confirm"
    checks:
      - {check: tool_called, tool: save_document_differences}
      - {check: says, any: ["not saved", "nothing was saved", "was not saved", "refused"]}
      - {check: says, any: ["released"]}
      - {check: says, any: ["nothing differs, send to a banker to confirm"]}
      - {check: does_not_say, any: ["has been saved", "i have saved", "i've saved", "saved as version", "saved as draft version", "| differs |"]}
