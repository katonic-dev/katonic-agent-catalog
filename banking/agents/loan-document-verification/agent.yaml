id: loan-document-verification
name: Loan Document Verification
pack: banking
area: Lending
summary: >
  Compares the signed contract and the security documents of an approved loan
  with the terms the credit committee approved, and marks every difference.
  Every difference goes to a banker. The agent approves and releases nothing.

type: workflow
form: api
started_by: A call from the Lending desk or from the bank's lending system, naming an approved loan

meets_people_through: application
application: Lending desk

platform:
  kind: chat
  tier: reasoning

# The desk sends one message with the loan's id and reads the reply.
# The agent reads the approved terms and the loan's documents.
needs:
  - id: lending-system
    kind: api
    required: true
    label: The bank's lending system, to read an approved loan's terms and documents, and to save a draft list of differences
    operations:
      - get_approved_terms
      - list_loan_documents
      - get_loan_document
      - save_document_differences

demo_bank_systems: [lending]

stops_for_a_person:
  - A banker receives every difference and decides what to do about it. The agent approves nothing, confirms nothing as in order for release and releases nothing.
  - Which side is right, the approval or the contract, is for the banker to find out. The agent shows both values and chooses neither.

# Saving the differences is a draft kept with its author, a time and a version
# number. It changes no loan.
changes:
  - {tool: save_document_differences, waits_for_approval: false}

sample_data:
  - ../../desks/lending/cases.json

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 25 November 2026. Not promoted. All six tests pass five runs in a row on the second version of the instructions: test 1 with no tools, tests 2 to 6 in the Work Room with the desk's own message, a new conversation for each run, the lending system put back before each run that saves. Test 6 uses a loan whose funds are already released: the bank refuses the saved comparison, and in every run the agent tried once, quoted the refusal and said nothing was saved. Two things to know. In two runs of test 6 the summary said seven terms agree where the table showed eight; no test checks that count. Asked to confirm a contract for release, the agent read the approved terms once more before refusing in some runs, which changes nothing. One run was lost to a restart and run again. Nothing was released or approved in any run: the agent saves a draft list of differences and a banker decides. The first version passed two of six; what changed is in the instructions and tests of this folder, in the desk's instruction, and in the bank, which gained the released loan LN-9006. Not tried: the desk calling this agent, and the API form.
