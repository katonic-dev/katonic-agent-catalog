id: post-incident-review
name: Post-Incident Review
pack: banking
area: Technology
summary: >
  Given a closed incident, plans its own investigation across the IT
  operations records, stops when it has a root cause the records support or has
  shown that they cannot settle it, and drafts the review: a timeline with
  sources, the root cause with the evidence, contributing factors, what went
  well and proposed actions with no owner. It blames no person.

type: autonomous
form: autonomous
started_by: A person choosing a closed incident

# Meant to be met through an application, a deployed app that lists closed
# incidents and shows the draft review. That app is not written yet. Until it
# is, the agent is used in a chat.
meets_people_through: application
application: Post-incident review app (not written yet)

platform:
  kind: chat
  tier: reasoning

# The agent decides which read to make next from what the last one returned.
needs:
  - id: itops-system
    kind: api
    required: true
    label: The bank's IT operations system, to read a closed incident, the metrics, the changes and the runbook, and to save the review as a draft
    operations:
      - list_incidents
      - get_incident
      - get_service_metrics
      - list_recent_changes
      - get_runbook
      - save_post_incident_review

demo_bank_systems: [itops]

stops_for_a_person:
  - A person assigns the owner and the date of every action. The agent leaves both empty, and the bank's system refuses a review that names an owner.
  - A person decides what the review finally says, and approves it. The agent marks nothing approved.
  - Where the records do not settle the cause, the agent lists the candidates and a person decides which one to pursue.

# Saving a review is a draft kept with its author, a time and a version
# number. It changes no incident, no change record and no service.
changes:
  - {tool: save_post_incident_review, waits_for_approval: false}

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 25 November 2026; the second version of the instructions was published and tested there the same day. Not promoted. All six tests pass five runs in a row on the second version: test 1 with no tools, tests 2 to 6 in the Work Room, a new conversation for each run, the IT operations system put back before each run. In every run of the full review the agent showed no plan, quoted the timeline entry with its time, gave the latency and the error rate before and after, and saved one draft with the owner and the date of every action left empty. Things to know. Beside the six minutes it took to detect the fault, every reply adds a note that the figure was not worked out by a tool and should be checked; the instructions do not ask for that note. One run was lost when its browser tab closed and was run again. Nothing was closed, assigned or changed in any run: the agent saves a draft review and a person decides.
