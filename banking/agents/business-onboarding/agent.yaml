id: business-onboarding
name: Business Onboarding
pack: banking
area: Onboarding and know your customer
summary: >
  Reads a company's registry extract and constitutional documents, draws its
  ownership chain, lists its directors and owners for screening, and prepares
  the account opening file. Gaps in the ownership chain are listed and never
  filled in. A member of staff approves or declines every account.

type: multi-agent
form: pipeline
started_by: An application from a company arriving with its documents. The bank's onboarding system can announce one through its event for new onboarding applications

meets_people_through: application
application: Onboarding and review desk

# The stages are fixed and run in this order: read the registry extract and
# the constitutional documents; draw the ownership chain; list the directors
# and owners for screening and screen them; prepare the file. The desk
# sends one message and reads one reply, so this guide builds the pipeline as
# one chat agent that works through the four stages in turn. A platform that
# can run the stages as a team of specialists may split them at the same lines.
platform:
  kind: chat
  tier: reasoning

needs:
  - id: onboarding-system
    kind: api
    required: true
    label: The bank's onboarding system, to read an application, its documents and the account opening requirements, and to save a draft file
    operations:
      - get_onboarding_application
      - get_onboarding_document
      - get_onboarding_requirements
      - save_onboarding_file
  - id: screening-service
    kind: api
    required: true
    label: The bank's screening service, to screen a name against the watchlist and read a watchlist entry
    operations:
      - screen_name
      - get_watchlist_entry

demo_bank_systems: [onboarding, screening]

stops_for_a_person:
  - A member of staff approves or declines every account. The agent opens none and declines none.
  - A gap in the ownership chain is for the applicant to close with a document. The agent lists it and names no owner behind it.
  - A strong watchlist match goes to Compliance. A weaker hit is for the officer to clear.

changes:
  - {tool: save_onboarding_file, waits_for_approval: false}

sample_data:
  - ../../desks/onboarding-and-review/cases.json

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand as one agent and published to the development environment of a development cluster on 25 November 2026; the second version of the instructions was published and tested there on 26 November 2026. Not promoted. All six tests pass five runs in a row: tests 1, 3, 4, 5 and 6 on the first version, with one or two runs each repeated on the second; test 2 on the second. Test 1 with no tools, the others in the Work Room, a new conversation for each run, the onboarding system put back before each run that saves. What changed for the second version: a watchlist hit is reported part by part, the first name and the surname each as agrees or differs, then the date of birth, the nationality and the identity number each as agrees, differs or not given by the documents; on the first version four runs of five showed the two names without saying that the first name differs. One test line was corrected to the bank's data: the documents give the director's country, not a nationality. Things to know. The platform holds for approval any operation sent as a POST by an agent published after 26 November 2026, the watchlist name search and the draft save included; on this cluster both were cleared by the workspace owner, and a bank must decide the same for its own systems. The onboarding desk's message was refused by the workspace guardrail three times and went through on the next try. Not tried: the job as separate stages. No account was opened and no applicant was told anything in any run: the agent saves a draft file and a person decides.
