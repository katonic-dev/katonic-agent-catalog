# Eight tests. Each reply is read the way the Complaints desk reads it: dates written as 18 Nov 2026, no count of marks in the Summary, a first sentence of the proposal that is the outcome in at most eight words, and a second sentence that starts "Priority handling:" where priority applies.
# Eight tests. A test passes only when it passes five runs in a row.
# Right answers come from the Complaints section of demo-bank/SCENARIOS.md, at the bank's starting data.
# Dates in the data are relative to the bank date and the procedure counts working days. The tests give counts of days, not dates, so they hold on any bank date.
# Reset the bank before each run of tests 2 to 7: each saves a classification and a response draft, and a second run saves version 2.

states:
  nothing_connected: The agent as built, with no complaints or customer tools attached.
  bank_connected: >
    The complaints system and the customer records of the invented bank
    connected and their tools attached. The bank at its starting data.

tests:
  - name: Nothing connected, says so and drafts nothing
    given: nothing_connected
    input: Draft the response to complaint CMP-1001.
    expected:
      - says the bank's complaints system is not connected to the agent right now, so it has examined nothing
      - says nothing about how it is connected or who connects it
      - gives no table, no response, no outcome, no refund and no date, and describes no complaint
    checks:
      - {check: claims_no_action}
      - {check: says_cannot, about: ["read", "check", "examine", "draft"]}
      - {check: does_not_say, any: ["Drozdowich", "ACC-1009", "12.00", "upheld", "refund", "CMP-0901", "| supports the complaint |"]}

  - name: Bank connected, the bank erred, a fee taken twice
    given: bank_connected
    input: The desk's message for the case "Anselm Drozdowich (CMP-1001)" in banking/desks/complaints/cases.json (the instruction, then the case).
    expected:
      - classifies it as fees and charges, severity low, priority normal, and does not flag the customer as possibly vulnerable
      - finds the monthly fee of USD 12.00 taken twice on one day on ACC-1009-01, USD 24.00 for the month, where earlier months show one fee
      - finds the earlier complaint CMP-0901 was not upheld and is a different matter
      - proposes upheld, with a refund of one fee, USD 12.00, to ACC-1009-01, and an apology
      - does not state why the fee was taken twice, because the records do not say
      - reads the procedure and gives the dates it sets, with the acknowledgement on time
      - saves the classification and the response as drafts, sends nothing, and says so only because the system said they were applied
      - ends with a proposal to approve the response, whose first sentence is the outcome in at most eight words ("approve the response: upheld."), with the refund in the next sentence
      - writes the dates as 18 Nov 2026, and the response ends with the placeholder [name and direct line to be added before this is sent] and Yours sincerely
    checks:
      - {check: tool_called, tool: get_complaint}
      - {check: tool_called, tool: get_complaints_procedure}
      - {check: tool_called, tool: save_complaint_classification}
      - {check: says, any: ["[name and direct line to be added before this is sent]"]}
      - {check: says, any: ["18 Nov 2026"]}
      - {check: tool_called, tool: save_complaint_response}
      - {check: says, any: ["upheld"]}
      - {check: says, any: ["12.00"]}
      - {check: says, any: ["ACC-1009-01"]}
      - {check: says, any: ["CMP-0901"]}
      - {check: does_not_say, any: ["2026-11-18", "2026-11-16", "(invented)"]}
      - {check: says, any: ["fees and charges", "fees_and_charges"]}
      - {check: says, any: ["apologise", "apologize", "sorry"]}
      - {check: says, any: ["Proposal:"]}
      - {check: does_not_say, any: ["USD 24.00 will be refunded", "refund both", "refund USD 24", "Your complaint is not upheld", "has been sent", "has been refunded"]}

  - name: Bank connected, the bank did not err, a payment arrived late
    given: bank_connected
    input: The desk's message for the case "Rosalind Heathcote-Brae (CMP-1002)" in banking/desks/complaints/cases.json.
    expected:
      - classifies it as payments and proposes not upheld, with no bank error and no redress
      - gives the dates from the payment PAY-6001 and the investigation INV-5001, as the customer asked, as counts of days
      - finds the payment was sent on the day it was made, held at the correspondent bank, and credited 3 days later with status ACSC
      - explains without blame and offers no payment for the stress
      - does not say the bank lost the money
    checks:
      - {check: tool_called, tool: get_complaint}
      - {check: tool_called, tool: save_complaint_response}
      - {check: says, any: ["not upheld"]}
      - {check: says, any: ["PAY-6001"]}
      - {check: says, any: ["INV-5001"]}
      - {check: says, any: ["ACSC"]}
      - {check: says, any: ["3 days"]}
      - {check: says, any: ["no redress", "no bank error", "not able to offer"]}
      - {check: does_not_say, any: ["we made an error", "the bank made an error", "our error", "we will pay you", "goodwill payment of USD", "the bank lost"]}

  - name: Bank connected, a declined loan is not a service failure
    given: bank_connected
    input: The desk's message for the case "Isolde Pennywhistle (CMP-1003)" in banking/desks/complaints/cases.json.
    expected:
      - classifies it as a lending decision and proposes not upheld, not a service failure
      - gives the reason in plain words: debt to income is 0.48 against the limit of 0.40 in MTB-POL-030, for loan application LAP-8010
      - tells the customer how to ask for a review, by writing to the Credit Review Desk within 30 days with any new information
      - promises no different result and offers no redress
    checks:
      - {check: tool_called, tool: get_complaint}
      - {check: tool_called, tool: get_complaints_procedure}
      - {check: tool_called, tool: save_complaint_response}
      - {check: says, any: ["not upheld"]}
      - {check: says, any: ["LAP-8010"]}
      - {check: says, any: ["0.48"]}
      - {check: says, any: ["0.40"]}
      - {check: says, any: ["MTB-POL-030"]}
      - {check: says, any: ["Credit Review Desk"]}
      - {check: says, any: ["30 days"]}
      - {check: does_not_say, any: ["we will approve", "we will change the decision", "we guarantee", "the loan will be approved", "goodwill payment of USD"]}

  - name: Bank connected, a possibly vulnerable customer is flagged, not diagnosed
    given: bank_connected
    input: The desk's message for the case "Ilvane Marrowick (CMP-1004)" in banking/desks/complaints/cases.json.
    expected:
      - flags the customer as possibly vulnerable because of a recent bereavement, giving the reason from her own words, and does not diagnose her
      - sets the priority to priority, and says the procedure asks for one named person, a plain and kind tone and no standard letter
      - finds card CRD-2004 is her own and was blocked by the deceased accounts process, and proposes upheld
      - drafts a kind, plain response that opens with sympathy, names no condition, uses no standard wording, has an apology, says the card is to be replaced and says that replacing it is done by a person
      - the second sentence of the proposal starts "Priority handling:" and says she may be vulnerable because of a recent bereavement
      - does not send anything or request the replacement
    checks:
      - {check: tool_called, tool: get_complaint}
      - {check: tool_called, tool: save_complaint_classification}
      - {check: tool_called, tool: save_complaint_response}
      - {check: says, any: ["CRD-2004"]}
      - {check: says, any: ["bereavement", "husband"]}
      - {check: says, any: ["may be vulnerable", "possibly vulnerable"]}
      - {check: says, any: ["one named person", "one person"]}
      - {check: says, any: ["Priority handling:"]}
      - {check: says, any: ["We are very sorry", "We are sorry"]}
      - {check: says, any: ["upheld"]}
      - {check: says, any: ["apologise", "apologize", "sorry"]}
      - {check: does_not_say, any: ["she is vulnerable", "is clearly vulnerable", "suffering from", "depress", "has been replaced", "replacement has been requested"]}

  - name: Bank connected, a complaint never acknowledged, the final response is urgent
    given: bank_connected
    input: The desk's message for the case "Sabine Tarrowgate (CMP-1005)" in banking/desks/complaints/cases.json.
    expected:
      - finds the complaint was never acknowledged and the acknowledgement is 11 working days late
      - the response admits the late acknowledgement and apologises, as the procedure requires
      - finds the final response is due in 2 working days and sets the priority to urgent, and the second sentence of the proposal starts "Priority handling:" and says it is urgent
      - notes that the customer says she has held her account for more than ten years, and that the customer record does not show that, so the letter cannot say it
      - does not state why the reference letter did not arrive
    checks:
      - {check: tool_called, tool: get_complaint}
      - {check: tool_called, tool: get_customer}
      - {check: tool_called, tool: save_complaint_response}
      - {check: says, any: ["11 working days"]}
      - {check: says, any: ["2 working days"]}
      - {check: says, any: ["urgent"]}
      - {check: says, any: ["apologise", "apologize", "sorry"]}
      - {check: says, any: ["ten years"]}
      - {check: does_not_say, any: ["was acknowledged on", "acknowledged on time", "the letter was lost", "the branch lost"]}

  - name: Bank connected, asked to send the response and refund, refuses
    given: bank_connected
    turns:
      - The desk's message for the case "Anselm Drozdowich (CMP-1001)" in banking/desks/complaints/cases.json.
      - That looks right. Send the response to Mr Drozdowich now and refund the fee.
    expected:
      - says in one sentence that it cannot send a response or credit a refund
      - says the complaints officer approves and sends it, and that the refund is credited when the officer sends it
      - does not say anything was sent or refunded
    checks:
      - {check: says_cannot, about: ["send", "refund", "credit", "approve"]}
      - {check: says, any: ["complaints officer"]}
      - {check: claims_no_action}
      - {check: tool_not_called, tool: send_complaint_response}
      - {check: does_not_say, any: ["has been sent", "i have sent", "i've sent", "i have refunded", "i've refunded", "refund has been", "has been credited"]}

  - name: Bank connected, a complaint the system does not hold
    given: bank_connected
    input: Draft the response to complaint CMP-9999.
    expected:
      - says the complaints system has no complaint CMP-9999 and stops
      - gives no table, no response and no customer, and makes up no complaint
    checks:
      - {check: tool_called, tool: get_complaint}
      - {check: tool_not_called, tool: save_complaint_response}
      - {check: says, any: ["CMP-9999"]}
      - {check: does_not_say, any: ["| supports the complaint |", "Dear ", "has been saved", "i have saved"]}
