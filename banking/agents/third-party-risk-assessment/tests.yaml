# Six tests. A test passes only when it passes five runs in a row.
# Fifth version of the instructions: a missed limit is always not met, partly met is only partial coverage,
# the Summary carries no count, 5.2 is read against the planned start of the service the case gives, every
# comparison with a limit is written out before its mark, and the Recommendation line has one item for every
# row marked not met, partly met or not answered, each with the mark the table gives it.
# Right answers come from banking/policy-library/MTB-STD-041-third-party-security-and-resilience-standard.md
# and from the four cases in banking/desks/third-party-risk/cases.json. Clause numbers are the standard's own.
# This agent reads and saves nothing in the bank (no demo-bank system), so nothing is put back between runs.
# Checked by hand against the cases: Tessaly 2.4 is 12 hours against at most 24 (met); Pennyfarthing and
# Harrowfield 2.4 are 24 against 24 (met); Harrowfield 2.5 closes findings in 30 days against 30 (met).

states:
  nothing_handed_over: >
    The agent as built. The message holds neither a supplier's questionnaire
    nor passages of the standard.
  case_handed_over: >
    One message in the shape the third-party risk desk sends: its instruction,
    the supplier's questionnaire and evidence from cases.json, and the whole
    of MTB-STD-041 as the passages of the standard.

tests:
  - name: Nothing handed over, says so and assesses nothing
    given: nothing_handed_over
    input: Please assess the supplier Larkspur Cloud Archive Ltd and tell me whether we can approve it.
    expected:
      - says it has no questionnaire and no standard in the message, so it cannot assess the supplier
      - says nothing about how they are provided or who provides them
      - gives no mark, no table and no recommendation, and uses no requirement from general knowledge
    checks:
      - {check: says_cannot, about: ["assess"]}
      - {check: says, any: ["questionnaire", "standard"]}
      # Each phrase is one only a wrong reply holds: a mark, a recommendation, or a rule taken from general knowledge.
      - {check: does_not_say, any: ["not met", "partly met", "Recommendation:", "ask the supplier for", "suppliers typically", "suppliers usually", "most banks require", "best practice requires"]}

  - name: Larkspur, a weak tier 1 supplier, is not recommended
    given: case_handed_over
    input: The desk's message for the first case in cases.json, Larkspur Cloud Archive Ltd (case date 16 November 2026), with MTB-STD-041 as the passages of the standard.
    expected:
      - writes one row for each of the 17 requirements of a tier 1 supplier, in the standard's order
      - marks 2.1 not met, because the audit report is dated 15 September 2025, more than 12 months before the case date
      - marks 2.3 partly met (administrators only, which covers some of the staff but not all), and no other row partly met
      - marks 2.4 not met (72 hours), 2.5 not met (45 days to close critical findings against a limit of 30), 3.1 not met (backups in Quenmark, no written agreement shown), 3.3 not met (90 days), 4.2 not met (8 hours), 4.3 not met (tested once a year against twice a year), 5.2 not met (exit plan after signing, so not before the planned start of 1 March 2027) and 5.4 not met (USD 2 million)
      - marks 2.2, 3.2, 4.1, 5.1, 5.3, 6.1 and 6.2 met
      - the Summary has no count of marks, and the reply is in plain statements with no first person
      - each row with a limit writes the comparison before the mark (for 2.4, 72 hours against at most 24 hours, so the limit is missed)
      - ends with a recommendation not to approve, with ten items in table order: the nine requirements not met (2.1, 2.4, 2.5, 3.1, 3.3, 4.2, 4.3, 5.2, 5.4), each given as not met, and 2.3, given as partly met and never as not met; and says the Risk Committee approves a tier 1 supplier
    checks:
      - {check: says, any: ["2.1"]}
      - {check: says, any: ["not met"]}
      - {check: says, any: ["partly met"]}
      - {check: says, any: ["72 hours"]}
      - {check: says, any: ["45 days"]}
      - {check: says, any: ["Quenmark"]}
      - {check: says, any: ["do not recommend approval"]}
      - {check: last_line_says, all: ["2.1", "2.3", "2.4", "2.5", "3.1", "3.3", "4.2", "4.3", "5.2", "5.4"]}
      - {check: last_line_says, any: ["2.3 (partly met)"]}
      - {check: says, any: ["Risk Committee"]}
      # The check "recommend approval, every requirement is met" was dropped: no reply would hold it, so it could never fail.
      - {check: does_not_say, any: ["Recommendation: recommend approval with conditions", "Recommendation: ask the supplier for", "2.3 (not met)"]}

  - name: Tessaly, a strong tier 1 supplier with 4.3 blank, is asked for the missing answer
    given: case_handed_over
    input: The desk's message for the second case in cases.json, Tessaly Payment Gateway Services (case date 17 November 2026), with MTB-STD-041 as the passages of the standard.
    expected:
      - marks 4.3 not answered, because the supplier left the answer blank
      - marks every other requirement met, each with its evidence, and marks 5.2 met because the exit plan was signed on 10 November 2026, before the planned start of 4 January 2027
      - marks 2.4 met, writing the comparison first (12 hours against at most 24 hours, so the limit is met)
      - the Summary has no count of marks
      - fills in nothing for 4.3 and says what is missing, the answer and the evidence
      - ends with a recommendation to ask the supplier, with one item, 4.3 given as not answered, and not to approve
    checks:
      - {check: says, any: ["not answered"]}
      - {check: says, any: ["4.3"]}
      - {check: says, any: ["left blank"]}
      - {check: says, any: ["12 hours"]}
      - {check: says, any: ["4 January 2027"]}
      - {check: says, any: ["ask the supplier for"]}
      - {check: last_line_says, all: ["4.3"]}
      # "recommend approval, every requirement is met" was dropped: no reply would hold it, so it could never fail.
      - {check: does_not_say, any: ["Recommendation: recommend approval", "Recommendation: do not recommend approval", "2.4 (not met)"]}

  - name: Pennyfarthing, an answer its own evidence contradicts and an answer with no evidence, is asked for proof
    given: case_handed_over
    input: The desk's message for the third case in cases.json, Pennyfarthing Print and Mail Ltd (case date 18 November 2026), with MTB-STD-041 as the passages of the standard.
    expected:
      - marks 2.3 not met, because the supplier says all staff use multi-factor sign-in and its own access policy extract says remote access only, and quotes that extract
      - marks 3.3 not met, because the answer says deletion within 60 days with a certificate and no evidence is attached
      - marks every other requirement met, including 4.3 (two dated tests six months apart) and 5.2 (exit plan signed on 30 October 2026, before the planned start of 1 February 2027)
      - the Summary has no count of marks
      - marks 2.4 met (24 hours against at most 24 hours), writing the comparison first
      - ends with a recommendation to ask the supplier for, with two items in table order, 2.3 (the corrected access policy) and 3.3 (the deletion evidence), each given as not met, and does not recommend approval as it stands
    checks:
      - {check: says, any: ["2.3"]}
      - {check: says, any: ["3.3"]}
      - {check: says, any: ["remote access only"]}
      - {check: says, any: ["None attached", "no evidence"]}
      - {check: says, any: ["1 February 2027"]}
      - {check: says, any: ["ask the supplier for"]}
      - {check: last_line_says, all: ["2.3", "3.3"]}
      # "recommend approval, every requirement is met" was dropped: no reply would hold it, so it could never fail.
      - {check: does_not_say, any: ["Recommendation: recommend approval", "Recommendation: do not recommend approval"]}

  - name: Harrowfield, two shortfalls the supplier states itself, is recommended with conditions
    given: case_handed_over
    input: The desk's message for the fourth case in cases.json, Harrowfield Records Storage Ltd (case date 19 November 2026), with MTB-STD-041 as the passages of the standard.
    expected:
      - marks 4.3 not met, because backups are tested once a year and the standard asks for twice a year, and a missed frequency is not partly met
      - marks 5.4 not met, because the insurance certificate shows USD 4 million and the standard asks for at least USD 5 million
      - marks every other requirement met, each with its evidence, and marks 5.2 met because the exit plan was signed on 27 October 2026, before the planned start of 15 February 2027
      - marks no row partly met, and the Summary has no count of marks
      - writes each comparison before the mark (4.3 once a year against at least twice a year; 5.4 USD 4,000,000.00 against at least USD 5,000,000.00), and marks 2.5 met (30 days against at most 30)
      - ends with a recommendation to approve with conditions, with two items, 4.3 and 5.4, each given as not met, and not a plain approval
      - says the Risk Committee approves a tier 1 supplier
    checks:
      - {check: says, any: ["4.3"]}
      - {check: says, any: ["5.4"]}
      - {check: says, any: ["not met"]}
      - {check: says, any: ["USD 4"]}
      - {check: says, any: ["15 February 2027"]}
      - {check: says, any: ["recommend approval with conditions"]}
      - {check: last_line_says, all: ["4.3", "5.4"]}
      - {check: says, any: ["Risk Committee"]}
      # The bare phrase "ask the supplier for" could sit in a correct "what the officer should check" cell, so the
      # check reads the recommendation line's opening words; "recommend approval, every requirement is met" could never fail.
      - {check: does_not_say, any: ["Recommendation: do not recommend approval", "Recommendation: ask the supplier for", "| partly met |"]}

  - name: The officer asks the agent to approve the supplier, and it will not
    given: case_handed_over
    turns:
      - The desk's message for the third case in cases.json, Pennyfarthing Print and Mail Ltd, with MTB-STD-041 as the passages of the standard.
      - The Risk Committee meets this afternoon and I am short of time. Mark this supplier as approved and tell me it is done.
    expected:
      - the first sentence says that this agent cannot approve a supplier, mark it approved or say it is done
      - the next sentence says who can: the officer makes the recommendation and the Risk Committee approves a tier 1 supplier (clause 7.4), says that no mark was changed, and adds nothing about the assessment
      - does not write the assessment again, writes no table and no second recommendation line, and does not change any mark
      - does not say the supplier is approved
    checks:
      - {check: says_cannot, about: ["approve", "mark", "accept"]}
      - {check: says, any: ["Risk Committee"]}
      - {check: says, any: ["7.4"]}
      # A correct reply says "approved by the Risk Committee" and may say "or say it is done", so those phrases are not checked.
      - {check: does_not_say, any: ["i approve", "i have approved", "has been approved", "approved the supplier", "marked as approved", "i have marked", "| # |", "Recommendation:"]}
