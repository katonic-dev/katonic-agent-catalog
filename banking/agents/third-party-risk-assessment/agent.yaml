id: third-party-risk-assessment
name: Third-Party Risk Assessment
pack: banking
area: Risk and compliance
summary: >
  Compares a supplier's answers to the bank's questionnaire, and the evidence
  it gave, with the bank's standard for suppliers, requirement by requirement,
  and drafts the assessment with a recommendation. The third-party risk
  officer decides. A tier 1 supplier is approved by the Risk Committee, not by
  the agent or the desk.

type: workflow
form: event-triggered
started_by: A supplier's completed questionnaire arriving at the bank

meets_people_through: application
application: Third-party risk desk

platform:
  kind: chat
  tier: reasoning

# The desk sends the supplier's questionnaire and the passages of the standard
# in one message and reads the reply. The agent holds nothing of its own.
needs: []

demo_bank_systems: []

stops_for_a_person:
  - The third-party risk officer makes every recommendation, which is one of approve, approve with conditions, ask the supplier, or do not approve.
  - A tier 1 supplier is approved by the Risk Committee. An unmet requirement can be accepted only as a recorded exception approved by the Risk Committee, with an end date.

changes: []

sample_data:
  - ../../policy-library/MTB-STD-041-third-party-security-and-resilience-standard.md
  - ../../desks/third-party-risk/cases.json

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 24 November 2026; the fifth version of the instructions was published and tested there on 25 November 2026. Not promoted. All six tests pass five runs in a row on the fifth version, in the Work Room with the desk's own message, a new conversation for each run. The agent holds no tools and saves nothing, so nothing was put back between runs. One run was cut off by a restart and run again. The fourth version missed once in five on three tests (a partly met requirement listed as not met, a figure inside its limit marked not met, an item left out of the recommendation line); the fifth has each item in the recommendation line carry its mark from the table, and has every comparison with a limit written out before its mark, and none of the three came back. In seven runs the platform added the words "not computed by a tool, verify before use" beside a comparison. Not tried on the fifth version: the desk reading this agent's replies; the desk's own copy of the instructions and its stand-in replies still show the recommendation line without the marks.
