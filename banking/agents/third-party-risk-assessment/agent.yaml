id: third-party-risk-assessment
name: Third-Party Risk Assessment
pack: banking
area: Risk and compliance
summary: >
  Compares a supplier's answers to the bank's questionnaire, and the evidence
  it gave, with the bank's standard for suppliers, requirement by requirement,
  and drafts the assessment with a recommendation. The third-party risk
  officer decides. A tier 1 supplier is approved by the Risk Committee, not by
  the agent or the desk.

type: workflow
form: event-triggered
started_by: A supplier's completed questionnaire arriving at the bank

meets_people_through: application
application: Third-party risk desk

platform:
  kind: chat
  tier: reasoning

# The desk sends the supplier's questionnaire and the passages of the standard
# in one message and reads the reply. The agent holds nothing of its own.
needs: []

demo_bank_systems: []

stops_for_a_person:
  - The third-party risk officer makes every recommendation, which is one of approve, approve with conditions, ask the supplier, or do not approve.
  - A tier 1 supplier is approved by the Risk Committee. An unmet requirement can be accepted only as a recorded exception approved by the Risk Committee, with an end date.

changes: []

sample_data:
  - ../../policy-library/MTB-STD-041-third-party-security-and-resilience-standard.md
  - ../../desks/third-party-risk/cases.json

state:
  built_on_a_cluster: true
  tests_passed: false
  on_the_catalog_shelf: false
  notes: Built, published to the development environment of a development cluster and tested on 24 November 2026, on the fourth version of the instructions. Not promoted. Tests 1, 5 and 6 pass five runs in a row on checks and expected lines. Test 2 run 3 lists a partly met requirement among those not met, test 3 run 1 marks 2.4 not met (12 hours against a limit of 24), and test 4 run 1 leaves the 2.3 request out of the recommendation line (it fails the last_line_says check). tests_passed stays false until all six tests pass five runs in a row.
