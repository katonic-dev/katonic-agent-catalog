id: mainframe-modernisation
name: Mainframe Modernisation
pack: banking
area: Technology
summary: >
  Converts a program, or a batch of programs, of the bank's old system in four
  fixed stages: the rules the program follows with line references, tests from
  those rules using the old system's sample rows, the converted code, and a
  check of the code against the tests with every difference listed. An engineer
  reviews every stage and nothing is deployed. Old behaviour that looks like a
  bug is kept and flagged, never fixed silently.

type: multi-agent
form: pipeline
started_by: An engineer naming a program or a batch of programs

# Meant to be met through a deployed app that lists programs and shows each
# stage for review. That app is not written yet. Until it is, the pipeline is
# used in a chat.
meets_people_through: application
application: Modernisation app (not written yet)

# The stages are fixed and run in this order: read the program and write down
# its rules with line references; write tests from the rules using the sample
# rows; write the converted code; check the code against the tests and list
# every difference. The bank's old system takes one message and one saved
# draft per program, so this guide builds the pipeline as one chat agent that
# works through the four stages in turn. A platform that can run the stages as
# separate agents may split them at the same lines.
platform:
  kind: chat
  tier: reasoning

needs:
  - id: legacy-system
    kind: api
    required: true
    label: The bank's old core system, read only, to read programs, tables, sample rows and stored procedures, and to save a converted program as a draft
    operations:
      - list_legacy_programs
      - get_legacy_program
      - get_legacy_table
      - get_stored_procedure
      - save_converted_program

demo_bank_systems: [legacy]

stops_for_a_person:
  - An engineer reviews the output of every stage. Nothing is deployed, installed, scheduled or run in the bank.
  - Whether a flagged old behaviour is kept or changed is for the engineer and the owner of the rule. A rule marked in a comment as needing sign-off is named as such.
  - The agent has no way to run code in the invented bank. Unless the platform gives it one, every check is made by reading, and the draft says so.

# Saving a conversion is a draft kept with its author, a time and a version
# number. It changes nothing in the old system and installs nothing.
changes:
  - {tool: save_converted_program, waits_for_approval: false}

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand as one agent and published to the development environment of a development cluster on 25 November 2026; four versions of the instructions were published and tested there on 25 and 26 November 2026. Not promoted. All seven tests pass five runs in a row: test 1 on the first version, with one run repeated on the third; tests 2, 3, 5, 6 and 7 on the third, with one run each repeated on the fourth; test 4 on the fourth. Test 1 with no tools, the others in the Work Room, a new conversation for each run, the legacy system put back before each run. What changed along the way: a test is written for the behaviour the old program has, a known fault included, and "open" is kept for what the program text, its comments and the data cannot settle; a rule stated in a comment is a rule; and every comment that states a number or a period is set beside the value the code uses, so a comment of 24 months against a code of 730 days is flagged and the code is kept. In one of the five runs of test 4 the difference is shown by placing the two side by side under the flagged heading, without a sentence saying that they differ. Things to know. A conversion takes about two minutes, at the edge of the platform's time limit, and several replies were lost to a timeout, a restarting server or a dropped connection after the draft had been saved; a lost run is no result and was run again. One save in six on the second version was refused by the workspace guardrail, which read the program text as an attack on a database. Not tried: the job as separate stages; a run of the converted code. Nothing was put into service in any run: the agent saves a draft conversion and an engineer reviews it.
