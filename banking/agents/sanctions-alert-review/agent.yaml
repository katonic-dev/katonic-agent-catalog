id: sanctions-alert-review
name: Sanctions Alert Review
pack: banking
area: Financial crime
summary: >
  Compares a customer's record with a watchlist entry field by field (name,
  aliases, date of birth, place of birth, nationality, identity number,
  address, earlier alerts on the same pair) and recommends clear or escalate,
  with the reason beside each field. It closes no alert: a compliance officer
  decides every true or uncertain match.

type: workflow
form: event-triggered
started_by: A screening alert arriving at the bank. The bank's screening system can announce one through its event for new screening alerts

meets_people_through: application
application: Sanctions desk

platform:
  kind: chat
  tier: reasoning

# The desk sends one message with the alert's id and reads the reply.
# The agent reads the alert, the list entry and the customer's contacts from the bank's systems.
needs:
  - id: screening-system
    kind: api
    required: true
    label: The bank's screening system, to read an alert with the customer's and the entry's fields side by side (place of birth and address included) and the list entry, and to save a draft recommendation with its field by field comparison
    operations:
      - get_screening_alert
      - get_watchlist_entry
      - record_alert_recommendation
  - id: core-banking-system
    kind: api
    required: true
    label: The bank's core system, to read a customer's contact history for a relationship the alert points to
    operations:
      - list_customer_contacts

demo_bank_systems: [screening, core]

stops_for_a_person:
  - The compliance officer decides every true or uncertain match. The agent closes no alert, freezes nothing and files nothing.
  - Whether a close name is the same person is for the compliance officer to find out. The agent shows both values and chooses neither.

# Saving a recommendation is a draft kept with its author, a time and a
# version number. The alert stays open. Each row of the saved comparison takes
# one of five words: matches, partly_matches, differs, not_on_entry, noted.
changes:
  - {tool: record_alert_recommendation, waits_for_approval: false}

sample_data:
  - ../../desks/sanctions/cases.json

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 24 November 2026. Not promoted. All ten tests pass five runs in a row on the second version of the instructions: test 1 with no tools on the draft's Test tab, tests 2 to 10 in the Work Room with the desk's own message, a new conversation for each run, the screening system put back before each. The first version passed one of ten on every check and expected line; what changed is in the instructions and tests of this folder and in the desk's instruction. For a closed alert the save is tried once and the system refuses it, and the agent says so. Passing replies were recorded in short form, not word for word. Not tried: the desk itself calling this agent, and an alert arriving starting it.
