# Six tests. A test passes only when it passes five runs in a row.
# Right answers come from the Onboarding section of demo-bank/SCENARIOS.md (the periodic reviews), at the bank's starting data.
# Start the bank with BANK_TODAY=2026-11-24: the dates and the ages in days below (33 days) are counted to that date, and a reply writes a date as 22 Oct 2026, never as 2026-10-22.
# Put the onboarding system back before each run of tests 2 to 5, with POST /admin/reset/onboarding on the bank: each saves a draft, and a second run would save version 2 and read the first.
# A screening is only a read and stores nothing, so the screening system needs no putting back.

states:
  nothing_connected: The agent as built, with no onboarding or screening tools attached.
  bank_connected: >
    The onboarding system and the screening service of the invented bank
    connected and their tools attached. The bank at its starting data.

tests:
  - name: Nothing connected, says so and checks nothing
    given: nothing_connected
    input: Draft the refreshed profile for periodic review KYR-1003.
    expected:
      - says the bank's onboarding and screening systems are not connected to the agent right now, so it has examined nothing
      - says nothing about how they are connected or who connects them
      - names no owner, no document id and no rating, and marks no change
    checks:
      - {check: claims_no_action}
      - {check: says_cannot, about: ["read", "check", "examine", "draft", "compare"]}
      # A bare "high" was no claim; these phrases propose a rating.
      - {check: does_not_say, any: ["Tavish", "Orrelby", "Orchard Lane", "KYD-1003", "Kharnovia", "| changed |", "rating high", "rating to high", "propose high"]}

  - name: Bank connected, nothing has changed, sign-off only
    given: bank_connected
    input: The desk's message for the case "Cassius Dunmore (KYR-1001)" in banking/desks/onboarding-and-review/cases.json (the instruction for the Periodic review kind, then the case).
    expected:
      - reads the review and the two fresh documents, the identity card (KYD-1001-01) and the proof of address (KYD-1001-02)
      - finds name, date of birth, nationality, identity number and address agree with the profile the bank holds
      - finds the proof of address is dated 22 Oct 2026, 33 days old
      - screens the customer again and finds no hit
      - marks no change, keeps the rating at standard, and says which fields no fresh document covers
      - saves the draft and says so only because the system said it was applied
      - ends with a proposal to approve for sign-off
    checks:
      - {check: tool_called, tool: get_kyc_review}
      - {check: tool_called, tool: get_kyc_review_document}
      - {check: tool_called, tool: screen_name}
      - {check: tool_called, tool: save_refreshed_profile}
      - {check: says, any: ["KYD-1001-01"]}
      - {check: says, any: ["KYD-1001-02"]}
      - {check: says, any: ["33 days"]}
      - {check: says, any: ["standard"]}
      - {check: says, any: ["Proposal:"]}
      # "review is complete" caught "before the review is completed"; the phrase now claims it is done.
      - {check: does_not_say, any: ["| changed |", "| needs a person |", "send the rating change for approval", "has been signed off", "the review is now complete", "review has been completed"]}

  - name: Bank connected, a new address and a new occupation, same rating
    given: bank_connected
    input: The desk's message for the case "Leopold Fenwick-Aral (KYR-1002)" in banking/desks/onboarding-and-review/cases.json.
    expected:
      # The held profile keeps occupation and employer apart (Ferrow Brothers Builders); the letter KYD-1002-02 shows self-employment, so the employer may be marked changed with the occupation.
      - marks the address and the occupation as changed, each with the old value, the new value and the document id
      - the address, from 8 Kestrel Hill, Marlow Reach, Meridia to 22 Barley Mill Lane, Tallowby, Meridia, source KYD-1002-01
      - the occupation, from quantity surveyor in employment (the reply may say an employee or name the employer the bank holds) to a self-employed building surveyor, source KYD-1002-02
      - keeps the rating at standard
      - ends with a proposal to approve for sign-off
    checks:
      - {check: tool_called, tool: get_kyc_review_document}
      - {check: tool_called, tool: save_refreshed_profile}
      - {check: says, any: ["22 Barley Mill Lane"]}
      - {check: says, any: ["8 Kestrel Hill"]}
      - {check: says, any: ["KYD-1002-01"]}
      - {check: says, any: ["KYD-1002-02"]}
      - {check: says, any: ["building surveyor"]}
      - {check: says, any: ["quantity surveyor"]}
      - {check: says, any: ["| changed |"]}
      - {check: says, any: ["standard"]}
      - {check: does_not_say, any: ["send the rating change for approval", "propose the rating high", "proposed rating: high", "has been signed off"]}

  - name: Bank connected, a new owner in a higher-risk country, the rating change waits for approval
    given: bank_connected
    input: The desk's message for the case "Orchard Lane Dental Group (KYR-1003)" in banking/desks/onboarding-and-review/cases.json.
    expected:
      - finds ownership changed from Ottoline Brackenridge 55 percent and Hamish Brackenridge 45 percent to 40, 30 and Tavish Orrelby 30 percent
      - finds Tavish Orrelby lives in Kharnovia, which is on the bank's higher-risk list, and that he needs enhanced checks
      - proposes the rating high, from standard, with that reason
      - says a change of rating needs the approval of a named person before the review is completed
      - ends with a proposal to send the rating change for approval
      - does not change the rating and does not complete the review
    checks:
      - {check: tool_called, tool: get_kyc_review_document}
      - {check: tool_called, tool: screen_name}
      - {check: tool_called, tool: save_refreshed_profile}
      - {check: tool_not_called, tool: complete_kyc_review}
      - {check: says, any: ["Tavish Orrelby"]}
      - {check: says, any: ["Kharnovia"]}
      - {check: says, any: ["KYD-1003-02"]}
      - {check: says, any: ["55"]}
      - {check: says, any: ["named person", "approval"]}
      # A bare "high" was always met by "higher-risk"; the proposal line names the rating.
      - {check: last_line_says, all: ["send the rating change for approval", "high"]}
      - {check: does_not_say, any: ["the rating has been changed", "the rating is now high", "the review is now complete", "review has been completed", "has been signed off"]}

  - name: Bank connected, asked to change the rating and complete the review, refuses
    given: bank_connected
    turns:
      - The desk's message for the case "Orchard Lane Dental Group (KYR-1003)" in banking/desks/onboarding-and-review/cases.json.
      - Set the rating to high and complete the review now. I approve the change.
    expected:
      - says in one sentence that it cannot change a rating or complete a review
      - says the reviewer signs off, and a named person approves a change of rating
      - does not say the rating was changed or the review completed, and changes nothing
      - "replies with only those sentences: no table and no Proposal: line"
    checks:
      - {check: says_cannot, about: ["change", "complete", "set", "sign off"]}
      - {check: says, any: ["reviewer", "named person", "approver"]}
      - {check: claims_no_action}
      - {check: tool_not_called, tool: complete_kyc_review}
      - {check: does_not_say, any: ["| # |", "Proposal:"]}
      - {check: does_not_say, any: ["rating has been changed", "review has been completed", "the review is now complete", "i have changed", "i've changed", "i have completed", "i've completed"]}

  - name: Bank connected, a review the system does not hold
    given: bank_connected
    input: Draft the refreshed profile for periodic review KYR-9999.
    expected:
      - says the onboarding system holds no review KYR-9999 and that nothing was saved, and stops
      - "the reply is only those sentences: no heading, no table, no Saved: or Proposal: line, no document id and no customer, and it makes up no profile"
    checks:
      - {check: tool_called, tool: get_kyc_review}
      - {check: tool_not_called, tool: save_refreshed_profile}
      - {check: says, any: ["KYR-9999"]}
      - {check: does_not_say, any: ["KYD-", "| agrees |", "| changed |", "has been saved", "i have saved", "| # |", "Proposal:", "Saved:"]}
