id: periodic-review
name: Periodic Review
pack: banking
area: Onboarding and know your customer
summary: >
  Compares what the bank holds about a customer with the fresh documents
  received for a periodic review and with a fresh screening, and drafts the
  refreshed profile with every change marked. The reviewer signs off. A change
  of risk rating waits for the approval of a named person.

type: workflow
form: scheduled
started_by: The list of customers due for review. A schedule starts the agent on each open review in the onboarding system's list

meets_people_through: application
application: Onboarding and review desk

platform:
  kind: chat
  tier: reasoning

# The desk sends one message with the review's id and reads the reply.
needs:
  - id: onboarding-system
    kind: api
    required: true
    label: The bank's onboarding system, to list reviews, read a review with the profile the bank holds and its fresh documents, and to save a draft refreshed profile
    operations:
      - list_kyc_reviews
      - get_kyc_review
      - get_kyc_review_document
      - save_refreshed_profile
  - id: screening-service
    kind: api
    required: true
    label: The bank's screening service, to screen a name against the watchlist and read a watchlist entry
    operations:
      - screen_name
      - get_watchlist_entry

demo_bank_systems: [onboarding, screening]

stops_for_a_person:
  - The reviewer signs off every review. The agent completes none.
  - A change of risk rating needs the approval of a named person before the review is completed. The agent proposes a rating and gives the reason. It changes none.
  - Enhanced checks on an owner in a higher-risk country are done by a person.

# Saving the refreshed profile is a draft kept with its author, a time and a
# version number. The customer's record is not changed.
changes:
  - {tool: save_refreshed_profile, waits_for_approval: false}

sample_data:
  - ../../desks/onboarding-and-review/cases.json

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand as one agent, with no schedule set up, and published to the development environment of a development cluster on 26 November 2026; two versions of the instructions were published and tested there that day. Not promoted. All six tests pass five runs in a row: tests 1, 2, 3, 5 and 6 on the first version, with one or two runs each repeated on the second; test 4 on the second. Test 1 with no tools, the others in the Work Room, a new conversation for each run, the onboarding system put back before each run that saves. What changed for the second version: on the first, three runs of five of the review with a new owner added a row for a proof of address the review never asked for, marked it missing, and so proposed to ask the customer instead of sending the rating change for approval; now a row is missing only when the review itself names a document that is not there, and the proposal is chosen in a set order with a rating change first. One test line was corrected: the old occupation may be given with the employer the bank holds. Things to know. In two runs the summary's list of fields that no fresh document covers is longer than the profile the bank holds; no row and no proposal follows from it. The platform holds for approval any operation sent as a POST by an agent published after 26 November 2026, the watchlist name search and the draft save included; on this cluster both were cleared by the workspace owner, and a bank must decide the same for its own systems. Not tried: a run started by a clock. No rating was changed and no review was completed in any run: the agent saves a draft refreshed profile and a person decides.
