id: credit-analysis
name: Credit Analysis
pack: banking
area: Lending
summary: >
  Spreads an application's financial figures, works out the ratios the bank's
  lending policy names, compares each with its limit, and drafts the credit
  memo with the source of every figure. The credit officer decides. The agent
  approves and declines nothing.

type: workflow
form: api
started_by: A call from the Lending desk or from the bank's lending system, naming an application

meets_people_through: application
application: Lending desk

platform:
  kind: chat
  tier: reasoning

# The desk sends one message with the application's id and reads the reply.
# The agent reads the application, its documents and the customer's exposure.
needs:
  - id: lending-system
    kind: api
    required: true
    label: The bank's lending system, to read an application, its documents and the lending policy, and to save a draft credit memo
    operations:
      - get_loan_application
      - list_application_documents
      - get_application_document
      - get_credit_policy
      - save_credit_memo
  - id: customer-exposure
    kind: api
    required: true
    label: The bank's customer records, to read the customer's existing credit exposure
    operations: [get_customer_exposure]

demo_bank_systems: [lending, core]

stops_for_a_person:
  - The credit officer reads the memo and decides. The agent approves nothing and declines nothing, and the recommendation it saves is always to refer the application to the credit officer.
  - A ratio outside policy, or one that could not be worked out, is for the credit officer to weigh.

# Saving a credit memo is a draft kept with its author, a time and a version
# number. It does not decide the application.
changes:
  - {tool: save_credit_memo, waits_for_approval: false}

sample_data:
  - ../../desks/lending/cases.json

state:
  built_on_a_cluster: true
  tests_passed: true
  on_the_catalog_shelf: false
  notes: >
    Built by hand and published to the development environment of a development cluster on 25 November 2026. Not promoted. All six tests pass five runs in a row on the third version of the instructions: test 1 with no tools, tests 2 to 6 in the Work Room with the desk's own message, a new conversation for each run, the lending system put back before each. Tests 2, 3 and 4 and four runs of test 5 ran while the bank's date was one day later than the tests assume; one run of each of tests 2, 3 and 4 was repeated on the right date and nothing differed. In two runs of test 5 the summary wrote the product code with an underscore; no check forbids it. Nothing was approved or declined in any run: the agent saves a draft memo that refers the application and the credit officer decides. The first version passed three of six; what changed is in the instructions and tests of this folder, in the desk's instruction, and in the bank, whose business applications now carry the indicative instalment. Not tried: the desk calling this agent, and the API form.
